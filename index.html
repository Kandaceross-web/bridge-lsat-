    sec("2 · That is SUPPORT", '<p class="explain">A reason that helps make something more believable is called <strong>support</strong>.</p>'+chainHTML(["REASON: “It only has 20,000 miles.”","makes this more believable","CLAIM: “You should buy this car.”"])+fourLevels("support")+purposeHTML("support"))+
    sec("3 · Try it, one question at a time", '<div class="stim">Carlos should take the earlier flight because storms are expected tonight.</div>'+reveal("r2","What does the speaker think should happen?","Carlos should take the earlier flight.")+reveal("r3","Why does the speaker think that?","Storms are expected tonight.")+reveal("r4","Which statement is the POINT? Which is the REASON?","POINT: Carlos should take the earlier flight. REASON: storms are expected tonight.")+'<p class="muted">Soon you’ll attach LSAT labels: the point is the <strong>conclusion</strong>, the reason is <strong>support</strong>. Later the reason gets one more name: <strong>premise</strong>.</p>')+
    sec("4 · Same logic, harder words", '<div class="stim">Maria will probably get the job. She has ten years of experience and excellent references.</div><p>Point: Maria will probably get the job. Reasons: experience and references.</p><p>Now the LSAT version:</p><div class="stim">Given the candidate’s extensive experience and consistently strong references, she is likely to receive the position.</div><div class="translate"><div class="from">“is likely to receive the position”</div><div class="arrow">→</div><div class="to">will probably get the job</div></div><p class="explain">The logic is <strong>exactly the same</strong>. Only the words got harder. The LSAT does this on purpose. Your job is to strip the fancy wording away.</p>')+
    sec("5 · The habit: what job is this sentence doing?", '<p class="explain">From now on, every time you read a sentence, ask: <strong>what job is this sentence doing?</strong></p><div class="chips">'+["The point?","A reason?","Someone else’s opinion?","An example?","Scene-setting?","An explanation?"].map(x=>'<span class="chip">'+x+'</span>').join("")+'</div><p class="muted">Right now you only need two answers: the point, or a reason. The others get their own lessons later.</p>'),

  word: ()=> sec("1 · Start with real life", '<p class="explain">Your friend says: <strong>“I think we should leave early because traffic is always terrible at 5:00.”</strong></p>'+reveal("w1","What is your friend trying to get you to agree with?","“We should leave early.” That’s their POINT: what they want you to believe or agree with."))+
    sec("2 · Now the LSAT word: CONCLUSION", '<div class="row"><span class="bigword">Conclusion</span><button class="btn ghost" data-act="say" data-t="conclusion">Hear it</button><span class="muted">con-CLOO-zhun</span></div><p class="explain">Conclusion simply means <strong>the point the person is trying to get you to believe</strong>. You already understood it. Now it has its LSAT name.</p>'+fourLevels("conclusion")+'<div class="translate"><div class="from">Formal: “the claim that the argument is trying to establish”</div><div class="arrow">→</div><div class="to">The thing they are trying to prove.</div></div>'+purposeHTML("conclusion"))+
    sec("3 · Every conclusion is a claim. Not every claim is a conclusion.", '<p class="explain">A conclusion is a claim with a <strong>special job</strong>: it’s the one they want you to accept. The other claims are there to help it.</p><div class="stim">“The bakery sells out by 9. It’s already 8:30. We should go now.”</div><p>Three claims. Only one is the point: <strong>“We should go now.”</strong> The other two are claims doing the job of reasons.</p>')+
    sec("4 · An ARGUMENT is not a fight", '<p class="explain">On the LSAT, an <strong>argument</strong> doesn’t mean yelling or disagreeing. It means: <strong>“Here is what I believe, and here is why.”</strong></p><div class="stim">“I should bring a jacket because it will be cold tonight.”</div><p>That’s an argument. Nobody is fighting.</p>'+fourLevels("argument"))+
    sec("5 · The whole picture", chainHTML(["A PERSON","has an <strong>intention</strong> (wants you to believe something)","makes <strong>claims</strong>","some claims give <strong>reasons</strong>","those reasons <strong>support</strong> another claim","the claim they want you to accept is the <strong>CONCLUSION</strong>"])+'<p class="explain" style="margin-top:12px">In normal words: <strong>someone wants you to believe something, so they give you reasons.</strong> That’s an argument.</p>')+
    sec("6 · See it in an LSAT-style argument", argBox([["Biologist: Coral reefs that lose more than half their algae rarely recover.",0],["The reef off Point Hara has lost seventy percent of its algae.",0],["Therefore, the Point Hara reef is unlikely to recover.",1]])+'<div class="diagram"><div class="drow"><div class="dbox ev"><span class="mono">Reason</span>Reefs that lose half their algae rarely recover.</div><div class="dbox ev"><span class="mono">Reason</span>Point Hara lost 70%.</div></div><div class="darrow">↓</div><div class="drow"><div class="dbox con"><span class="mono">The point (conclusion)</span>Point Hara is unlikely to recover.</div></div></div><p class="muted">In normal words: “This reef lost too much algae, so it probably won’t come back.”</p>')
});
const _translateBody = LESSON_BODY.translate;
LESSON_BODY.translate = ()=> _translateBody() + sec("Same logic, harder words", '<p>The LSAT makes simple ideas look hard. Each pair below says the same thing.</p>'+(typeof HARDER!=="undefined"?HARDER.slice(0,4).map(h=>'<div class="translate"><div class="from">'+esc(h.hard)+'</div><div class="arrow">→</div><div class="to">'+esc(h.simple)+'</div></div>').join(""):"")+'<div><button class="btn primary" data-act="drill" data-k="harder">Practice: same logic, harder words</button></div>');

const S1_LADDERS_H = {
  doing:[{m:"breakdown", text:"Before finding any answer, ask: **what is this person trying to DO?** Convince me? Recommend? Predict? Explain? Disagree? Or just tell me a fact?\n\nIf they’re trying to convince you, there’s a point and there are reasons."},{m:"analogy", text:"A friend texts “the new pizza place is amazing, you have to try it.” They’re not just reporting. They’re trying to get you to go."},{m:"kid", text:"Is the person just telling you something, or trying to get you to agree with them? That’s the first question."}],
  claim:[{m:"breakdown", text:"A **claim** is anything someone says is true. It can be a fact, an opinion, a prediction or a recommendation. It doesn’t have to be right."},{m:"analogy", text:"Online reviews are full of claims: “Best burger in town.” “Service was slow.” Each is someone saying something is true."},{m:"kid", text:"If someone says it like it’s true, it’s a claim. Questions and commands aren’t claims."}],
  reason:[{m:"breakdown", text:"A **reason** answers “Why?” It makes another statement easier to believe. That’s called **support**."},{m:"analogy", text:"“We should order in tonight.” Why? “The kitchen is torn up for repairs.” The torn-up kitchen is the reason."},{m:"kid", text:"Ask “why?” The answer is the reason."}]
};
Object.assign(S1_LADDERS, S1_LADDERS_H);
Object.assign(S1_CHECKS, {
  doing:{q:"“The gym opens at 6 a.m.” What is this person doing?", opts:["Trying to convince you to go to the gym","Just reporting a fact","Criticizing the gym"], a:1},
  claim:{q:"Which is NOT a claim?", opts:["The dog is tired.","Is the dog tired?","We should walk the dog."], a:1},
  reason:{q:"“You should buy this car. It only has 20,000 miles.” What is “It only has 20,000 miles” doing?", opts:["It’s the point","It’s a reason that makes the point more believable","It’s a question"], a:1}
});

/* Normal <-> LSAT translator page section + drill builders */
function n2lHTML(){
  const N = (typeof N2L!=="undefined") ? N2L : [];
  return '<section class="panel stack"><div class="row" style="justify-content:space-between"><h3>Normal ↔ LSAT translator</h3><button class="btn" data-act="drill" data-k="n2l">Drill it</button></div><p class="muted">You already understand the idea on the left. The right side is just its LSAT name. Greyed rows come later in the course.</p><div class="tblwrap"><table class="cal n2l"><tr><th>In normal words</th><th>LSAT term</th><th>Ask yourself</th></tr>'+N.map(r=>'<tr class="'+(r.stage==="later"?"later":"")+'"><td>'+esc(r.normal)+'</td><td><strong>'+esc(r.lsat)+'</strong></td><td>'+esc(r.q||"")+'</td></tr>').join("")+'</table></div></section>'+
  '<section class="panel stack"><h3>Say it like a normal person</h3><p class="muted">Paste any LSAT-style sentence. You’ll get it in everyday English, plus the hard words explained.</p><textarea class="big" id="tx-in" style="min-height:80px" placeholder="e.g. The available evidence fails to substantiate the author’s assertion.">'+esc(U.txIn||"")+'</textarea><div><button class="btn primary" data-act="tx-go">Say it like a normal person</button></div>'+(U.txOut?'<div class="note">'+U.txOut+'</div>':"")+'</section>';
}
function n2lItems(){ const N = (typeof N2L!=="undefined") ? N2L.filter(r=>r.stage==="now") : []; const items = [];
  shuffle(N).forEach(r=>{ const others = shuffle(N.filter(x=>x!==r)).slice(0,3);
    if(Math.random()<.5){ const o = shuffle([r].concat(others)); items.push({type:"n2l", prompt:"In normal words: “"+r.normal+"” What does the LSAT call this?", opts:o.map(x=>x.lsat), answer:o.indexOf(r), why:r.note}); }
    else { const o = shuffle([r].concat(others)); items.push({type:"n2l", prompt:"The LSAT says “"+r.lsat+".” What does that mean in normal words?", opts:o.map(x=>x.normal), answer:o.indexOf(r), why:r.note}); } });
  return items; }
function harderItems(){ return shuffle(typeof HARDER!=="undefined"?HARDER:[]).slice(0,6).map(h=>({type:"harder", focus:esc(h.hard), prompt:"Same logic, harder words. What is this saying in normal English?", opts:h.opts, answer:h.answer, why:h.why})); }

/* ---------- breakdown modes (EXPLAIN THIS TO ME options) ---------- */
const BD_MODES = {
  doing:["What are they doing?","In plain words, say what the person is trying to DO (convince, recommend, predict, explain why something happened, disagree, criticize, compare, report a fact). Then say why each sentence is there, using everyday words first and the LSAT label only if she has learned it."],
  normal:["Say it like a normal person","Rewrite the passage or question in plain everyday English, sentence by sentence, with the same meaning and the same strength. End with: 'Basically, they\u2019re saying...'"],
  kid:["Explain like I’m 10","Explain it like she's 10. Very short sentences. One idea per sentence. No LSAT words at all."],
  sbs:["Break down every sentence","Go sentence by sentence: 'Sentence 1: here's what they're telling us... Sentence 2: here's why that matters...' then 'So in regular English, this whole thing is basically saying...'"],
  define:["Define every word","Define every word in this item that a beginner might not know. For each: simple meaning first, then the LSAT meaning. Never use a hard word to define a hard word."],
  analogy:["Real-life example","Give a real-life example from work, family, money, restaurants, friends or social media with the same structure, label its parts, then map it back."],
  draw:["Show the argument structure","Draw the structure in a code block with plain-text boxes and arrows (REASON / ↓ / CONCLUSION; anything that isn't support off to the side). Then explain the picture in two lines."],
  mywrong:["Why my answer is wrong","Explain exactly why her selected answer is wrong: what she probably thought, why it was tempting, and the precise point where it goes wrong. If she hasn't answered, say so kindly and give a hint instead."],
  right:["Why the right answer is right","Explain why the correct answer is correct, step by step, pointing at the exact words that prove it."],
  example:["Give me another example","Give a brand-new example of the same idea (different topic), walk through it, and label its parts."],
  restart:["Teach me a different way","Start from absolute zero with a completely new approach you haven't used yet. Tiny steps."]
};
Object.assign(METHOD_NAMES, {doing:"What are they doing?", normal:"Said like a normal person", why:"The Why test, out loud", define:"Every word, defined", mywrong:"Why your answer is wrong", right:"Why the right answer is right", example:"Another example", restart:"A different way"});
function bdExtras(key){
  const out = [];
  if(key.startsWith("s1:")){
    const it = S1_BY[key.slice(3)]; const set = s1().set; const cur = set && set.items[set.i]===it.uid;
    const answered = !cur || set.answered; const sel = cur ? set.sel : null;
    if(answered && sel!==null && sel!==undefined && cur && !set.ok){ const tk = trapFor(it, sel); const T2 = TRAPS_C[tk]; out.push({m:"mywrong", text:"**"+T2.name+"**\n\n**Why it was tempting:** "+T2.made+"\n**Where it goes wrong:** "+T2.wrong}); }
    else out.push({m:"mywrong", text: answered ? "Your answer was right on this one." : "Pick an answer first and I’ll tell you exactly what it’s doing. For now, a nudge: ask what the other sentences are trying to prove."});
    out.push({m:"right", text: answered ? itemWhy(it) || (it.vid?VB[it.vid].simple:"") : "I’ll show you why the answer works once you’ve answered. Try the Why test first."});
    const tk = it.kind==="tap" ? (it.task==="main"?"middle":it.task==="author"?"opposing":"important") : "concept";
    out.push({m:"example", text:"**Everyday:** "+TRAPS_C[tk].easy+"\n\n**LSAT-style:** "+TRAPS_C[tk].lsat});
    out.push({m:"restart", text:S1_LADDERS.job[0].text});
    if(it.kind==="tap"||it.kind==="mcq"){ const o = intentionOf(it); out.push({m:"doing", text:"They\u2019re trying to convince you. More exactly: **"+o.kind+"**."+(o.pushback?" They also push back on someone else\u2019s view.":"")+(answered?"\n\n"+o.sents.map(s=>"\u201c"+s.t+"\u201d \u2192 **"+jobLabel(s.role)+"**").join("\n"):"\n\nNow ask: which sentence is the thing they want you to accept?")}); }
    out.push({m:"normal", text:"**Hard words, in plain English:**\n"+(wordsIn(itemText(it)).filter(id=>VB[id].cat!=="signal").slice(0,6).map(id=>"- **"+VB[id].term+"** = "+(VB[id].kid||VB[id].simple)).join("\n")||"No hard words here. Read it slowly, one sentence at a time.")});
  } else if(key.startsWith("s1l:")){
    const lad = S1_LADDERS[key.slice(4)]||[];
    out.push({m:"example", text:"**Everyday:** "+TRAPS_C.important.easy+"\n\n**Another:** "+TRAPS_C.last.easy});
    out.push({m:"define", text:["conclusion","claim","argument","evidence","support"].map(id=>"**"+VB[id].term+"**: "+VB[id].simple).join("\n")});
    out.push({m:"restart", text:S1_LADDERS.word[0].text});
    out.push({m:"sbs", text:lad.map(x=>x.text).filter(Boolean).slice(-1)[0]||""});
  }
  return out;
}

function s1JournalEntry(j){
  const it = S1_BY[j.uid]; if(!it) return "";
  const tk = Object.keys(TRAPS_C).find(k=>TRAPS_C[k].name===j.trap) || "concept"; const T2 = TRAPS_C[tk];
  let mine = "", right = "";
  if(it.kind==="tap"){ mine = (it.sents[j.mine]||{}).t||""; right = it.sents.find(s=>s.role==="conclusion").t; }
  else if(it.kind==="mcq"){ const q = Q(it.qid); mine = j.mine+". "+(q.choices.find(c=>c.l===j.mine)||{}).t; right = q.answer+". "+q.choices.find(c=>c.l===q.answer).t; }
  else { const opts = it.opts || []; mine = opts[j.mine] || "(option "+(+j.mine+1)+")"; right = opts[it.answer] || (it.vid?VB[it.vid].simple:""); }
  const ws = wordsIn(itemText(it)).slice(0,5);
  const reasonLabel = {last:"It was the last sentence", important:"It sounded important", fact:"It had facts or numbers", signal:"It had a signpost word", word:"I didn’t know what a word meant", misread:"I misread the question", guess:"I guessed"}[j.reason];
  return '<article class="jentry"><div class="row" style="justify-content:space-between"><strong>Step 1 · '+esc((S1_SKILLS.find(s=>s.id===j.skill)||{label:j.skill==="exam"?"Mastery exam":j.skill==="retention"?"Retention check":"Practice"}).label)+' · '+esc(LVL_NAME[j.level]||"")+'</strong><span class="row" style="gap:6px">'+(j.cat?'<span class="trap">'+esc(j.cat)+'</span>':"")+'<span class="mono">'+new Date(j.at).toLocaleDateString()+'</span></span></div>'+
    '<p style="font-family:var(--f-display)">'+esc(itemText(it))+'</p><dl class="jgrid">'+
    '<dt>Task</dt><dd>'+esc(it.kind==="tap"?taskText(it):(it.q||"Question"))+'</dd><dt>Your answer</dt><dd>'+esc(mine)+'</dd><dt>Correct answer</dt><dd>'+esc(right)+'</dd>'+
    '<dt>Why you chose yours</dt><dd>'+(reasonLabel?esc(reasonLabel):'<span class="muted">Not answered</span>')+'</dd><dt>Why yours was wrong</dt><dd>'+esc(T2.wrong)+'</dd><dt>Why the answer works</dt><dd>'+esc(itemWhy(it)||"")+'</dd>'+
    '<dt>Trap</dt><dd>'+esc(T2.name)+'</dd><dt>Concept tested</dt><dd>Identifying conclusions</dd>'+(ws.length?'<dt>Vocabulary involved</dt><dd>'+ws.map(id=>'<button class="vw" data-act="vcard" data-id="'+id+'">'+esc(VB[id].term)+'</button>').join(", ")+'</dd>':"")+
    '<dt>Time / help / tries</dt><dd>'+(j.ms?fmtTime(j.ms):"—")+' · '+(j.assisted?"used help":"no help")+' · '+(j.attempts||0)+' earlier attempt'+(j.attempts===1?"":"s")+'</dd>'+
    '<dt>Notice next time</dt><dd>'+esc(T2.trick)+'</dd></dl></article>';
}
function s1Lvl(){ const st = s1(); if(st.mastered) return 5; const ph = s1Phase(); if(["exam","retention-wait","retention-due"].includes(ph)) return 4; const o = s1Stats()._overall; return o>=70?3:o>=40?2:(st.log.length?1:0); }

/* plan goal defaults (target 170, stretch 175, minimum 165) */
if(S.plan){ if(S.plan.start && !S.plan.target) S.plan.target = 170; if(!S.plan.stretch) S.plan.stretch = 175; if(!S.plan.minimum) S.plan.minimum = 165; }
/* boot */
if(S.welcomed && !S.steps.idea && U.view==="today"){}
render(); renderTutor();
initStore();
getSample().then(()=>{ if(!T.msgs.length) refreshMsgs(); });
