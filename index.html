  { id:"reasoning-is-flawed-because", term:"reasoning is flawed because", cat:"stem", aliases:["reasoning is flawed because","reasoning is flawed","flawed because"], simple:"Find the answer that names the argument's mistake.", lsat:"Flaw question: choose the answer that accurately describes the error in the argument's reasoning.", think:"Find the gap first in my own words, then match it to an answer.", effect:"Signals the argument is bad. Your job is to describe why, not fix it.", easy:"\"He cancelled once, so he hates me.\" Flawed because it jumps from one event to a big conclusion.", lsatEx:"The argument is flawed because it treats a lack of evidence that a drug is harmful as proof that it is safe.", mistake:"Picking an answer describing something the argument didn't actually do.", trick:"FLAWED BECAUSE = name the mistake.", confusers:["vulnerable-to-criticism","flaw","most-weakens"] },
  { id:"vulnerable-to-criticism", term:"vulnerable to criticism", cat:"stem", aliases:["vulnerable to criticism","most vulnerable to criticism","vulnerable to the criticism"], simple:"Another way of asking: what's wrong with this argument?", lsat:"Flaw question wording: choose the answer that describes how the reasoning fails.", think:"This is a flaw question. Find the gap and describe it.", effect:"Same task as 'reasoning is flawed.' The argument definitely has a problem.", easy:"A plan to save money by eating out more is vulnerable to criticism.", lsatEx:"The argument is most vulnerable to criticism on the grounds that it generalizes from a small sample.", mistake:"Thinking it means attacking with new facts. You describe the logic error.", trick:"VULNERABLE = has a weak spot. Name it.", confusers:["reasoning-is-flawed-because","most-weakens","flaw"] },
  { id:"depends-on-assuming", term:"depends on assuming", cat:"stem", aliases:["depends on assuming","depends on the assumption","relies on assuming","relies on the assumption"], simple:"Find a hidden belief the argument needs.", lsat:"Necessary assumption question: choose the unstated premise that must be true for the argument to hold.", think:"Use the negation test: if the answer is false, does the argument die?", effect:"Asks for a requirement, not a guarantee.", easy:"\"We'll make the movie on time\" depends on assuming traffic is light.", lsatEx:"The argument depends on assuming that the survey's respondents represent all the city's renters.", mistake:"Picking an answer that strengthens the argument but isn't actually required.", trick:"DEPENDS ON = can't live without it.", confusers:["assumption-required","necessary-assumption","enables-the-conclusion-to-be-properly-drawn"] },
  { id:"assumption-required", term:"assumption required", cat:"stem", aliases:["assumption required","required by the argument","argument requires"], simple:"Find what the argument needs to be true.", lsat:"Necessary assumption question: the right answer must be true for the reasoning to work.", think:"Negate each answer. The one that wrecks the argument is required.", effect:"A requirement standard. The answer may be modest, not powerful.", easy:"Planning dinner for 7 requires assuming the guests can come at 7.", lsatEx:"The town will save money by switching to LED streetlights. An assumption required: LED lights won't cost more to install than they save.", mistake:"Choosing a strong answer that proves the conclusion but isn't needed.", trick:"REQUIRED = negate it and it breaks.", confusers:["depends-on-assuming","necessary-assumption","sufficient-assumption"] },
  { id:"enables-the-conclusion-to-be-properly-drawn", term:"enables the conclusion to be properly drawn", cat:"stem", aliases:["enables the conclusion to be properly drawn","conclusion to be properly drawn","properly drawn","if assumed"], simple:"Find the missing fact that would fully prove the conclusion.", lsat:"Sufficient assumption question: choose the premise that, if added, guarantees the conclusion.", think:"Add each answer. Does the conclusion now follow 100%? Pick that one.", effect:"A guarantee standard. Strong answers are welcome here.", easy:"\"She'll get the job\" is properly drawn if everyone who interviews gets hired.", lsatEx:"Lily joined the club, so she must attend meetings. The conclusion is properly drawn if all club members must attend meetings.", mistake:"Choosing a merely helpful answer. It must make the conclusion airtight.", trick:"ENABLES = fills the gap completely.", confusers:["sufficient-assumption","most-helps-justify","assumption-required"] },
  { id:"most-helps-justify", term:"most helps justify", cat:"stem", aliases:["most helps to justify","most helps justify","helps to justify","justify the reasoning"], simple:"Find the rule that makes the argument fully work.", lsat:"Principle-justify question: choose the principle that, if valid, most helps make the conclusion follow; usually it guarantees it.", think:"Find the rule linking the premises to the conclusion. Match its 'if' part to the facts.", effect:"Close to sufficient: the right principle should lock in the conclusion.", easy:"\"Don't text while driving\" is justified by 'never do anything that puts others in danger.'", lsatEx:"The editor rejected the essay because it contained errors. Most helps justify: editors should reject any essay containing errors.", mistake:"Picking a principle whose 'if' part doesn't match the facts given.", trick:"JUSTIFY = the rule that closes the deal.", confusers:["most-strengthens","enables-the-conclusion-to-be-properly-drawn","conforms-to-the-principle"] },
  { id:"most-strengthens", term:"most strengthens", cat:"stem", aliases:["most strengthens","strengthens the argument","most strengthen"], simple:"Find the fact that makes the argument most convincing.", lsat:"Choose the answer that, if true, most increases support for the conclusion; it need not prove it.", think:"Find the gap. Pick the answer that helps close it the most.", effect:"Treat answers as true. The right one makes the conclusion more likely.", easy:"\"This diner is good\" is strengthened by 'it's always full of locals.'", lsatEx:"A tutor says her method raised students' scores. Most strengthens: similar students using other methods saw no gain.", mistake:"Picking answers that repeat the premises or support a different conclusion.", trick:"MOST STRENGTHENS = biggest boost.", confusers:["most-weakens","most-helps-justify","most-strongly-supported"] },
  { id:"most-weakens", term:"most weakens", cat:"stem", aliases:["most weakens","most seriously weakens","weakens the argument","most weaken"], simple:"Find the fact that hurts the argument the most.", lsat:"Choose the answer that, if true, most reduces support for the conclusion; it need not disprove it.", think:"Attack the gap: another cause, a missing group, or a reversed cause.", effect:"Treat answers as true. The right one makes the conclusion less likely.", easy:"\"This plan will save money\" is weakened by 'it has huge hidden fees.'", lsatEx:"Store owners say new lights cut theft. Most weakens: theft dropped just as much at stores without the lights.", mistake:"Requiring the answer to prove the conclusion false. It only has to hurt it.", trick:"MOST WEAKENS = biggest hit.", confusers:["most-strengthens","vulnerable-to-criticism","undermine"] },
  { id:"most-helps-resolve", term:"most helps resolve", cat:"stem", aliases:["most helps to resolve","most helps resolve","helps to resolve","most helps to explain","resolve the apparent","explain the apparent"], simple:"Find the fact that makes a confusing situation make sense.", lsat:"Paradox question: choose the answer that, if true, explains how two seemingly conflicting facts are both true.", think:"Both facts stay true. Which answer explains both at once?", effect:"No argument to attack. The right answer removes the conflict.", easy:"He's always broke but drives a new car. Resolve: his parents gave it to him.", lsatEx:"Fewer people visited the library, yet more books were checked out. Most helps resolve: the library launched online checkouts.", mistake:"Choosing an answer that explains only one fact or makes the puzzle worse.", trick:"RESOLVE = make both facts fit.", confusers:["resolve","explain","most-strengthens"] },
  { id:"most-analogous", term:"most analogous", cat:"stem", aliases:["most analogous","most similar","most closely parallels","most parallel"], simple:"Find the answer that follows the same pattern.", lsat:"Choose the answer whose structure, reasoning, or principle matches the stimulus, regardless of topic.", think:"Strip out the topic. Describe the pattern in plain words, then match it.", effect:"A matching task. Topic is irrelevant; structure is everything.", easy:"Feeding a stray cat once so it keeps coming back is analogous to answering a spammer once.", lsatEx:"A city raises parking fees to reduce downtown driving. Most analogous: a cafe raises soda prices to cut soda sales.", mistake:"Choosing the answer with the same topic but different reasoning.", trick:"ANALOGOUS = same pattern, new topic.", confusers:["analogous","parallel","conforms-to-the-principle"] },
  { id:"conforms-to-the-principle", term:"conforms to the principle", cat:"stem", aliases:["conforms to the principle","conforms most closely","illustrates the principle","conforms to"], simple:"Find the situation that follows the given rule.", lsat:"Principle-application question: choose the answer whose case correctly applies the stated principle.", think:"Write the rule as if-then. Find the case that meets the 'if' and shows the 'then.'", effect:"Tests rule application. The answer must meet the principle's conditions.", easy:"Rule: whoever cooks doesn't wash dishes. Conforms: Dad cooked, so Mom washed.", lsatEx:"Principle: companies should disclose risks they know about. Conforms: a drug maker publishes the side effects it found.", mistake:"Picking an answer that reverses the rule or applies it to the wrong condition.", trick:"CONFORMS = follows the rule.", confusers:["principle","most-helps-justify","most-analogous"] },
  { id:"role-played-in-the-argument", term:"role played in the argument", cat:"stem", aliases:["role played in the argument","role played","role in the argument","figures in the argument"], simple:"Asks what job a statement does in the argument.", lsat:"Argument-part question: identify the function of a claim, such as premise, main conclusion, or intermediate conclusion.", think:"Find the main conclusion first. Then ask: does this claim support it, or is it supported?", effect:"Tests structure, not truth. The claim's job matters more than its content.", easy:"In 'We're late, so let's skip coffee,' 'we're late' plays the role of a reason.", lsatEx:"The claim that the dam is aging plays the role of a premise supporting the conclusion that it should be inspected.", mistake:"Not finding the main conclusion first, then mislabeling a premise as the conclusion.", trick:"ROLE = what job does it do?", confusers:["intermediate-conclusion","premise","conclusion"] },
  { id:"except", term:"except", cat:"stem", aliases:["except"], simple:"Flips the question: four answers work, find the one that doesn't.", lsat:"Reverses the task: the four wrong answers do what the stem describes, and the correct answer is the one that doesn't.", think:"Rewrite the stem: find the one that does NOT do this. Mark each answer yes or no.", effect:"Flips the goal. The correct answer is the odd one out.", easy:"All my friends like pizza except Jo. Find Jo.", lsatEx:"Each of the following, if true, strengthens the argument EXCEPT: so four answers strengthen it and the right one does not.", mistake:"Forgetting the EXCEPT halfway through and picking an answer that does the task.", trick:"EXCEPT = find the odd one out.", confusers:["most-weakens","most-strengthens","not-all"] },

  { id:"because", term:"because", cat:"signal", aliases:["because","because of"], simple:"Here comes a reason.", lsat:"Premise indicator; introduces evidence supporting a claim.", think:"The part after 'because' is a premise. What is it supporting?", effect:"Marks evidence. The claim it is attached to is often the conclusion.", easy:"I'm staying in because I'm tired.", lsatEx:"The bridge should be repaired because its supports are cracking.", mistake:"Treating the 'because' part as the conclusion.", trick:"BECAUSE = reason ahead.", confusers:["since","therefore","for-example"] },
  { id:"since", term:"since", cat:"signal", aliases:["since"], simple:"Because; here's the reason.", lsat:"Premise indicator when it means 'because.' It can also mean 'from a point in time,' which is not a logic signal.", think:"Is it 'because' or 'from then on'? If because, it's a premise.", effect:"Usually marks evidence supporting the conclusion.", easy:"Since it's raining, let's take the car.", lsatEx:"Since the trial showed no benefit, the drug should not be approved.", mistake:"Missing that 'since' can just mean time, as in 'since 2010.'", trick:"SINCE = because (usually).", confusers:["because","so","thus"] },
  { id:"therefore", term:"therefore", cat:"signal", aliases:["therefore"], simple:"Here comes the main point.", lsat:"Conclusion indicator; introduces a claim supported by what came before.", think:"What follows is a conclusion. Check: do the earlier reasons really prove it?", effect:"Marks a conclusion, either main or intermediate.", easy:"She paid for dinner; therefore, I'll pay next time.", lsatEx:"The engine overheated twice this week. Therefore, it needs an inspection.", mistake:"Assuming 'therefore' always marks the MAIN conclusion. It may mark an intermediate one.", trick:"THEREFORE = here's the point.", confusers:["thus","because","consequently"] },
  { id:"thus", term:"thus", cat:"signal", aliases:["thus"], simple:"So; as a result.", lsat:"Conclusion indicator; same function as therefore.", think:"Conclusion coming. What reasons came before it?", effect:"Marks a conclusion drawn from earlier statements.", easy:"The bill was wrong; thus, we asked for a new one.", lsatEx:"All the tests came back negative. Thus, the patient does not have the virus.", mistake:"Not checking whether the 'thus' claim is the main conclusion or just a step.", trick:"THUS = so.", confusers:["therefore","hence","since"] },
  { id:"hence", term:"hence", cat:"signal", aliases:["hence"], simple:"So; for that reason.", lsat:"Conclusion indicator; introduces a claim supported by the preceding premises.", think:"Conclusion ahead. Treat the earlier sentences as its support.", effect:"Marks a conclusion.", easy:"He missed the bus, hence he was late.", lsatEx:"Crop yields fell after the drought. Hence, food prices rose.", mistake:"Skipping over it because it sounds old-fashioned. It's a key conclusion signal.", trick:"HENCE = so, conclusion next.", confusers:["thus","therefore","since"] },
  { id:"consequently", term:"consequently", cat:"signal", aliases:["consequently","as a result","as a consequence"], simple:"As a result.", lsat:"Conclusion indicator; signals a result or claim that follows from what came before.", think:"A result or conclusion follows. Is it really caused or proven by the earlier facts?", effect:"Marks a conclusion or an effect.", easy:"She overspent; consequently, she skipped the trip.", lsatEx:"The firm lost its biggest client. Consequently, it will have to cut staff.", mistake:"Assuming the stated result really follows. Check the link.", trick:"CONSEQUENTLY = result follows.", confusers:["therefore","because","hence"] },
  { id:"so", term:"so", cat:"signal", aliases:["so"], simple:"Because of that.", lsat:"Conclusion indicator; can mark the main conclusion or an intermediate one.", think:"Conclusion coming. Is it the final point, or a step toward another one?", effect:"Marks a conclusion; in the middle of an argument it often marks an intermediate conclusion.", easy:"I'm hungry, so let's eat.", lsatEx:"The roads are icy, so driving is dangerous. So the school should close today.", mistake:"Missing that a 'so' in the middle may mark an intermediate conclusion, not the main one.", trick:"SO = conclusion, maybe a step.", confusers:["therefore","because","since"] },
  { id:"although", term:"although", cat:"signal", aliases:["although","though","even though"], simple:"Even though; admits something before making the main point.", lsat:"Contrast indicator; concedes a point, then shifts to the author's main claim.", think:"The part after the comma is usually what the author really believes.", effect:"Introduces a concession; the main point comes next.", easy:"Although the shoes are pricey, I'm buying them.", lsatEx:"Although the policy is costly, it will save lives. So it should be adopted.", mistake:"Treating the conceded part as the author's main view.", trick:"ALTHOUGH = yes, but...", confusers:["however","despite","nevertheless"] },
  { id:"however", term:"however", cat:"signal", aliases:["however"], simple:"But; here's another side.", lsat:"Contrast indicator; often signals the author's turn to their own view or to a conflicting fact.", think:"The author is shifting. What comes next often matters most.", effect:"Changes direction. Often introduces the conclusion or one side of a discrepancy.", easy:"The job pays well. However, the hours are awful.", lsatEx:"Many believe the comet will be visible tonight. However, clouds will likely block it.", mistake:"Skimming past it. Contrast words often mark the conclusion.", trick:"HOWEVER = turn signal.", confusers:["but","although","therefore"] },
  { id:"but", term:"but", cat:"signal", aliases:["but"], simple:"On the other hand.", lsat:"Contrast indicator; introduces a point that pushes against what came before.", think:"Shift! What comes after 'but' is usually what the author cares about.", effect:"Changes direction; often marks the author's view or a key fact.", easy:"I like him, but he's always late.", lsatEx:"The plan is popular. But it ignores the cost of upkeep.", mistake:"Not noticing the shift and treating both sides as equally important.", trick:"BUT = what really matters is next.", confusers:["however","yet","so"] },
  { id:"yet", term:"yet", cat:"signal", aliases:["yet"], simple:"But; even so.", lsat:"Contrast indicator; often introduces a surprising fact or one half of a discrepancy.", think:"Surprise contrast. Is there a puzzle to explain?", effect:"Signals contrast, often the two halves of a paradox.", easy:"He studied hard, yet he failed.", lsatEx:"Crime fell last year. Yet more residents say they feel unsafe.", mistake:"Confusing 'yet' meaning 'but' with 'yet' meaning 'so far.'", trick:"YET = but, surprise.", confusers:["but","however","since"] },
  { id:"nevertheless", term:"nevertheless", cat:"signal", aliases:["nevertheless","nonetheless","even so"], simple:"Even so; in spite of that.", lsat:"Contrast indicator; affirms a point despite what was just said.", think:"The author grants something, then holds their ground. What follows is their view.", effect:"Overrides the previous point; often marks the conclusion.", easy:"It was raining. Nevertheless, we went hiking.", lsatEx:"The new law has flaws. Nevertheless, it is better than the old one.", mistake:"Thinking it agrees with the previous sentence. It pushes back against it.", trick:"NEVERTHELESS = even so.", confusers:["although","however","therefore"] },
  { id:"despite", term:"despite", cat:"signal", aliases:["despite","in spite of"], simple:"Even with this thing happening.", lsat:"Contrast indicator; introduces a fact that might seem to block the main claim.", think:"The 'despite' part is a counterpoint. The main claim survives it.", effect:"Admits an obstacle while keeping the claim.", easy:"Despite the price, she bought the bag.", lsatEx:"Despite rising costs, the clinic stayed open. Donors covered the gap.", mistake:"Treating the 'despite' fact as the author's main point.", trick:"DESPITE = even with.", confusers:["although","nevertheless","because"] },
  { id:"for-example", term:"for example", cat:"signal", aliases:["for example","for instance","such as"], simple:"Here's a specific case to show the point.", lsat:"Evidence indicator; introduces a case that supports a general claim.", think:"This is support, not the main point. What claim does the example back up?", effect:"Marks evidence. The claim right before it is often the conclusion.", easy:"He's thoughtful. For example, he remembered my mom's birthday.", lsatEx:"Local farms are thriving. For example, two new farmers markets opened this year.", mistake:"Mistaking the example for the conclusion, or thinking one example proves 'all.'", trick:"FOR EXAMPLE = proof sample.", confusers:["because","moreover","evidence"] },
  { id:"moreover", term:"moreover", cat:"signal", aliases:["moreover","furthermore","in addition","additionally"], simple:"Also; here's another point.", lsat:"Continuation indicator; adds another premise or point in the same direction.", think:"Another reason is coming, same direction. Probably not the conclusion.", effect:"Adds support; doesn't change direction.", easy:"The apartment is cheap. Moreover, it's close to work.", lsatEx:"The plan saves money. Moreover, it reduces pollution.", mistake:"Treating the 'moreover' point as the conclusion. It's usually another premise.", trick:"MOREOVER = plus another reason.", confusers:["however","because","for-example"] },
  { id:"unless", term:"unless", cat:"signal", aliases:["unless"], simple:"If not.", lsat:"Conditional indicator meaning 'if not': 'A unless B' means if not B, then A.", think:"Replace 'unless' with 'if not.' A unless B becomes: if not B, then A.", effect:"Creates a conditional. The part after 'unless' is what's needed to avoid the other outcome.", easy:"I'll walk unless it rains. If it doesn't rain, I walk.", lsatEx:"The store will close unless sales rise. So if sales don't rise, the store will close.", mistake:"Assuming it works backward too: if sales rise, the store stays open. That's not guaranteed.", trick:"UNLESS = if not.", confusers:["only-if","if","without"] },
  { id:"only", term:"only", cat:"signal", aliases:["only"], simple:"Marks something that's required.", lsat:"Introduces a necessary condition: 'Only A are B' means if something is B, then it is A.", think:"The group after 'only' is the requirement. If B, then A. Not the reverse.", effect:"Marks a necessary condition. Being A doesn't guarantee B.", easy:"Only members get the discount. Got the discount? You're a member.", lsatEx:"Only students with permission can use the lab. Kim used the lab, so Kim had permission.", mistake:"Reversing it: thinking every member automatically gets the discount.", trick:"ONLY = the requirement follows.", confusers:["only-if","if","all"] },
  { id:"only-if", term:"only if", cat:"signal", aliases:["only if"], simple:"Introduces something that is required.", lsat:"Introduces a necessary condition: 'A only if B' means if A, then B.", think:"Whatever follows 'only if' is required. A only if B becomes: if A, then B.", effect:"Marks a necessary condition. It doesn't guarantee the other side.", easy:"You can rent a car only if you have a license. A license alone doesn't get you a car.", lsatEx:"The bill passes only if the senator votes yes. The bill passed, so the senator voted yes.", mistake:"Treating 'only if' like 'if.' They point in opposite directions.", trick:"ONLY IF = then (the requirement).", confusers:["if","only","unless"] },
  { id:"if", term:"if", cat:"signal", aliases:["if"], simple:"Introduces something that guarantees the result.", lsat:"Introduces a sufficient condition: 'If A, then B' means A guarantees B.", think:"What follows 'if' is the trigger. If it happens, the result must follow.", effect:"Marks a sufficient condition. It doesn't mean it's the only way.", easy:"If you buy two, you get one free.", lsatEx:"If the river floods, the road will close. The road closed, but that alone doesn't prove a flood.", mistake:"Reversing it: assuming the result means the 'if' part happened.", trick:"IF = trigger.", confusers:["only-if","unless","sufficient"] },
  { id:"without", term:"without", cat:"signal", aliases:["without"], simple:"If not; lacking.", lsat:"Conditional indicator meaning 'if not': 'Without A, no B' means if not A, then not B, so B requires A.", think:"Translate to 'if not.' Without A, no B means B needs A.", effect:"Marks a necessary condition, like 'unless' or 'only if.'", easy:"Without a ticket, you can't get in.", lsatEx:"Without funding, the project cannot continue. The project continued, so it had funding.", mistake:"Thinking that having A guarantees B. It only makes B possible.", trick:"WITHOUT = if not.", confusers:["unless","only-if","necessary"] },
  { id:"either", term:"either", cat:"signal", aliases:["either"], simple:"At least one of two, maybe both.", lsat:"'Either A or B' means at least one is true; both may be true unless it says 'but not both.'", think:"At least one. Both is allowed unless told otherwise.", effect:"If one option is false, the other must be true.", easy:"Either Mom or Dad will pick you up. Maybe both come.", lsatEx:"The leak is either in the roof or in the pipes. It's not in the roof, so it's in the pipes.", mistake:"Assuming 'either...or' rules out both.", trick:"EITHER = at least one.", confusers:["neither","both","unless"] },
  { id:"neither", term:"neither", cat:"signal", aliases:["neither","nor"], simple:"Not this one and not that one.", lsat:"'Neither A nor B' means A is false and B is false.", think:"Both are out. Not A and not B.", effect:"Rules out both options.", easy:"Neither my sister nor I like olives.", lsatEx:"Neither the manager nor the owner approved the sale. So the owner did not approve it.", mistake:"Reading it as 'only one of them is false.' Both are false.", trick:"NEITHER = not either one.", confusers:["either","none","both"] },
  { id:"both", term:"both", cat:"signal", aliases:["both"], simple:"This one and that one too.", lsat:"'Both A and B' means A is true and B is true.", think:"Two claims to check. If either one fails, the whole claim fails.", effect:"A joint claim; it is false if even one part is false.", easy:"Both kids want ice cream.", lsatEx:"The proposal is both cheap and effective. Showing it is expensive defeats that claim.", mistake:"Accepting an answer when only one half is supported.", trick:"BOTH = A and B, no skipping.", confusers:["either","all","neither"] },

  { id:"assert", term:"assert", cat:"rc", aliases:["assert","asserts","asserted","asserting","assertion"], simple:"To say firmly that something is true.", lsat:"To state a claim confidently, as fact.", think:"The author is stating this as true, not just mentioning it.", effect:"Marks a confident claim; often the author's own view or a view the author reports.", easy:"She asserted that she paid the bill on time.", lsatEx:"The author asserts that the painting is a forgery. Several critics disagree.", mistake:"Thinking 'assert' means the claim is proven. It just means stated firmly.", trick:"ASSERT = say it firmly.", confusers:["contend","maintain","imply"] },
  { id:"contend", term:"contend", cat:"rc", aliases:["contend","contends","contended","contending","contention"], simple:"To argue that something is true.", lsat:"To claim or argue for a position, often in a debate.", think:"Someone is taking a side. Is this the author's view or someone else's?", effect:"Introduces a position being argued, which may or may not be the author's.", easy:"He contends that he wasn't late.", lsatEx:"Some historians contend the treaty failed. The author, however, argues it succeeded.", mistake:"Assuming the author agrees with every view introduced by 'contend.'", trick:"CONTEND = argue for a side.", confusers:["assert","maintain","challenge"] },
  { id:"maintain", term:"maintain", cat:"rc", aliases:["maintain","maintains","maintained","maintaining"], simple:"To keep saying something is true.", lsat:"In arguments, to hold or claim a position (not to keep up or repair).", think:"This person holds this view. Who is it? Track it.", effect:"Signals a held position, often of a person or group the author is describing.", easy:"She maintains that her ex still has her sweater.", lsatEx:"Critics maintain that the novel is too long. The author maintains its length is necessary.", mistake:"Reading it as 'keep in good shape.' In arguments it means 'claim.'", trick:"MAINTAIN = hold a view.", confusers:["assert","contend","acknowledge"] },
  { id:"advocate", term:"advocate", cat:"rc", aliases:["advocate","advocates","advocated","advocating"], simple:"To publicly support an idea or plan.", lsat:"To argue in favor of a policy, idea, or course of action.", think:"This person wants this to happen. Is it the author's stance?", effect:"Signals a positive attitude toward a proposal.", easy:"My aunt advocates for longer school recess.", lsatEx:"The author advocates stricter limits on fishing. She cites shrinking fish populations.", mistake:"Reading an advocated position as neutral description. It's a stance in favor.", trick:"ADVOCATE = push for it.", confusers:["challenge","contend","critique"] },

{ id:"m011", kind:"tap", level:2, speaker:null, sents:[ {t:"We should get our cat a second litter box.", role:"conclusion"}, {t:"She needs a place to go where the dog won't bother her.", role:"middle"}, {t:"The dog now sleeps right beside her old box, and she hisses whenever she gets close to it.", role:"premise"} ], why:"The dog sleeping by the box supports the claim that the cat needs a dog-free spot, and that need supports getting a second box. The main conclusion comes first here.", signals:[] },
{ id:"m012", kind:"tap", level:2, speaker:null, sents:[ {t:"The forecast calls for heavy rain all day Saturday.", role:"premise"}, {t:"The outdoor market will almost certainly be half empty.", role:"middle"}, {t:"Saturday is a bad day to open our new lemonade stand there.", role:"conclusion"} ], why:"The rain forecast supports the prediction of an empty market, and an empty market supports the judgment that Saturday is a bad opening day. No signpost words, so ask what each sentence is used for.", signals:[] },
{ id:"m013", kind:"tap", level:2, speaker:null, sents:[ {t:"You should bring a jacket to the concert tonight.", role:"conclusion"}, {t:"The concert is outdoors and runs until midnight, and it drops to about 40 degrees here after dark.", role:"premise"}, {t:"So you'll be sitting in the cold for hours.", role:"middle"} ], why:"The outdoor show and cold nights support \"you'll be sitting in the cold,\" and that supports bringing a jacket. \"So\" marks a middle step here, not the main conclusion.", signals:["so"] },
{ id:"m014", kind:"tap", level:2, speaker:null, sents:[ {t:"Our team should hire a second support person before the holidays.", role:"conclusion"}, {t:"Our one support person won't be able to keep up in December.", role:"middle"}, {t:"Last December, customer emails tripled, and she is already working late most nights.", role:"premise"} ], why:"Last year's tripled emails support the claim that she won't keep up, and that claim supports hiring someone. Hiring is the point everything ends up supporting.", signals:[] },
{ id:"m015", kind:"tap", level:2, speaker:null, sents:[ {t:"My car mostly just sits in the driveway these days.", role:"middle"}, {t:"I take the train to work every day and walk to the grocery store.", role:"premise"}, {t:"I should sell the car.", role:"conclusion"} ], why:"Taking the train and walking supports the claim that the car just sits there, and an unused car supports selling it. The middle step comes first here.", signals:[] },
{ id:"m016", kind:"tap", level:2, speaker:null, sents:[ {t:"Grandma's birthday dinner is on the same night as Leo's basketball final.", role:"premise"}, {t:"Leo won't be able to make it to Grandma's dinner.", role:"middle"}, {t:"We ought to move Grandma's dinner to Sunday.", role:"conclusion"} ], why:"The scheduling clash supports the claim that Leo will miss the dinner, and that supports moving the dinner. \"Ought to\" is a sight word for the main conclusion.", signals:[] },
{ id:"m017", kind:"tap", level:2, speaker:null, sents:[ {t:"It's worth paying more for the bigger apartment.", role:"conclusion"}, {t:"The bigger one is a five-minute walk from my office.", role:"premise"}, {t:"With it, I could cancel my $120 monthly bus pass.", role:"middle"} ], why:"Being a short walk from work supports cancelling the bus pass, and those savings support the claim that the apartment is worth the extra rent. The conclusion comes first.", signals:[] },
{ id:"m018", kind:"tap", level:2, speaker:null, sents:[ {t:"The cheap dog food at the pet store lists corn as its first ingredient, and our vet says Rufus is allergic to corn.", role:"premise"}, {t:"That food would make Rufus sick.", role:"middle"}, {t:"We need to keep buying the more expensive brand.", role:"conclusion"} ], why:"The corn and the allergy support the claim that the cheap food would make Rufus sick, and that supports sticking with the expensive brand. \"Need to\" signals the main conclusion.", signals:[] },
{ id:"m019", kind:"tap", level:2, speaker:null, sents:[ {t:"The new taco place is probably going to be a hit.", role:"conclusion"}, {t:"People clearly love the food already.", role:"middle"}, {t:"Its first week of reviews averages 4.8 stars, and the line was out the door on Friday.", role:"premise"} ], why:"The reviews and long line support the claim that people love the food, and that claim supports the prediction that the place will be a hit. The prediction comes first.", signals:[] },
{ id:"m020", kind:"tap", level:2, speaker:null, sents:[ {t:"My gym membership costs $50 a month.", role:"premise"}, {t:"I've gone twice this year, and it's already June.", role:"premise"}, {t:"That works out to about $150 per visit.", role:"middle"}, {t:"I should cancel the membership.", role:"conclusion"} ], why:"The monthly cost and the two visits together support the $150-per-visit figure, and that figure supports cancelling. Two premises can hold up one middle step.", signals:[] },
{ id:"m021", kind:"mc", level:2, q:"How can you tell a middle step from the main conclusion?", opts:["The middle step is always the first sentence","The main conclusion is the claim everything ends up supporting; a middle step is used to support something else","The middle step never has a signpost word","The main conclusion is always the longest sentence"], answer:1, why:"Ask what each claim is used FOR. A middle step is used to back up another claim. The main conclusion is not used for anything further.", vocab:["intermediate-conclusion","conclusion","support"] },
{ id:"m022", kind:"mc", level:2, q:"True or false: a sentence that starts with \"so\" or \"therefore\" must be the main conclusion.", opts:["True","False"], answer:1, why:"False. These words show that a claim is supported, but a middle step is supported too. Check whether the claim is then used to support something else.", vocab:["so","therefore","intermediate-conclusion","conclusion"] },
{ id:"m023", kind:"mc", level:2, q:"Which question best helps you decide whether a supported claim is a middle step or the main conclusion?", opts:["Is this sentence a fact or an opinion?","What is this sentence being used FOR?","Does this sentence come last?"], answer:1, why:"If the claim is being used to support another claim, it is a middle step. If nothing else rests on it, it is the main conclusion.", vocab:["intermediate-conclusion","conclusion","support"] },
{ id:"m024", kind:"tap", level:3, speaker:null, sents:[ {t:"Zebra mussels filter enormous amounts of plankton from the water.", role:"premise"}, {t:"Their population in Lake Corran has grown tenfold over the past eight years.", role:"premise"}, {t:"Thus, the plankton supply in Lake Corran has almost certainly dropped sharply.", role:"middle"}, {t:"The lake's plankton-eating fish are therefore likely to decline in the coming years.", role:"conclusion"} ], why:"The mussels' filtering and their growth support the claim that plankton has dropped, and less plankton supports the prediction that the fish will decline. The fish prediction is where it all ends up.", signals:["thus","therefore"] },
{ id:"m025", kind:"tap", level:3, speaker:"Economist", sents:[ {t:"The city's plan to cut bus fares in half will likely reduce downtown traffic.", role:"conclusion"}, {t:"Many current drivers will switch to the bus.", role:"middle"}, {t:"In surveys, most downtown drivers say the cost of the fare is the main reason they do not take the bus.", role:"premise"} ], why:"The survey supports the claim that many drivers will switch, and drivers switching supports the prediction of less traffic. The main conclusion is stated first.", signals:[] },
{ id:"m026", kind:"tap", level:3, speaker:null, sents:[ {t:"The oldest surviving copies of the poem all come from monasteries in northern Ireland.", role:"premise"}, {t:"So the poem was most likely preserved there for centuries.", role:"middle"}, {t:"Historians searching for lost early versions should begin with northern Irish monastery archives.", role:"conclusion"} ], why:"Where the oldest copies were found supports the claim that the poem was kept there, and that claim supports where historians should search. \"So\" marks the middle step.", signals:["so"] },
{ id:"m027", kind:"tap", level:3, speaker:"Nutritionist", sents:[ {t:"In a two-year study, adults who ate breakfast regularly snacked far less in the afternoon than adults who skipped it.", role:"premise"}, {t:"Eating breakfast appears to reduce afternoon hunger.", role:"middle"}, {t:"People trying to cut down on snacking would be wise to eat breakfast.", role:"conclusion"} ], why:"The study supports the claim that breakfast reduces afternoon hunger, and that claim supports the advice to eat breakfast. The advice is the main conclusion.", signals:[] },
{ id:"m028", kind:"tap", level:3, speaker:null, sents:[ {t:"The town should require all new buildings to include bike parking.", role:"conclusion"}, {t:"After bike parking became required downtown in 2019, the number of residents biking to work there doubled.", role:"premise"}, {t:"Hence, requiring bike parking encourages people to bike.", role:"middle"} ], why:"The doubling downtown supports the claim that the rule encourages biking, and that claim supports requiring bike parking everywhere. \"Hence\" marks a middle step here, because the main conclusion already came first.", signals:["hence"] },
{ id:"m029", kind:"tap", level:3, speaker:"Analyst", sents:[ {t:"Arvo Furniture's online sales grew 40 percent last year, while its in-store sales fell.", role:"premise"}, {t:"Arvo's customers increasingly prefer to shop online.", role:"middle"}, {t:"Arvo should shift money from opening new stores into improving its website.", role:"conclusion"} ], why:"The sales numbers support the claim that customers prefer online shopping, and that preference supports moving money to the website. The spending advice is the final point.", signals:[] },
{ id:"m030", kind:"tap", level:3, speaker:null, sents:[ {t:"X-ray scans show a different painting hidden beneath the visible surface of the portrait.", role:"premise"}, {t:"The hidden painting uses a blue pigment that was not invented until 1820.", role:"premise"}, {t:"Therefore, the hidden painting was made after 1820.", role:"middle"}, {t:"So the portrait, long dated to 1790, must have been painted later than experts believed.", role:"conclusion"} ], why:"The pigment date supports the claim that the hidden painting is from after 1820, and since the portrait was painted on top of it, that supports a later date for the portrait. The new date for the portrait is the main conclusion.", signals:["therefore","so"] },
{ id:"m031", kind:"tap", level:3, speaker:"Biologist", sents:[ {t:"The decline of the region's bats is probably harming local farms.", role:"conclusion"}, {t:"Insect pests on those farms have very likely increased.", role:"middle"}, {t:"Each bat eats thousands of crop-damaging insects per night, and bat numbers in the region have fallen by half.", role:"premise"} ], why:"Fewer insect-eating bats supports the claim that pests have increased, and more pests supports the claim that farms are being harmed. The harm to farms is what everything ends up supporting.", signals:[] },
{ id:"m032", kind:"tap", level:3, speaker:null, sents:[ {t:"According to a district study, students at Halden High, which starts at 8:45 instead of 7:30, sleep about 40 minutes more per night than students at other district schools.", role:"premise"}, {t:"Consequently, the later start makes students better rested.", role:"middle"}, {t:"Other schools in the district should adopt the later start time.", role:"conclusion"} ], why:"The sleep study supports the claim that the later start helps students rest, and that claim supports other schools adopting it. The recommendation is the main conclusion.", signals:["consequently"] },
{ id:"m033", kind:"mc", level:3, q:"Argument: \"The factory closed last month. So hundreds of workers lost their jobs. Therefore, local restaurants will see fewer customers.\" What role does \"So hundreds of workers lost their jobs\" play?", opts:["The main conclusion","A middle step: supported by the factory closing and used to support the prediction about restaurants","Background that supports nothing","An opposing view"], answer:1, why:"The closing supports the job losses, and the job losses support the restaurant prediction. A claim in that position is a middle step.", vocab:["intermediate-conclusion","so","therefore"] },
{ id:"m034", kind:"mc", level:3, q:"Argument: \"Libraries should extend their evening hours. Many students have nowhere quiet to study at night. Therefore, longer hours would help students study.\" Which sentence is the main conclusion?", opts:["\"Many students have nowhere quiet to study at night.\"","\"Therefore, longer hours would help students study.\"","\"Libraries should extend their evening hours.\""], answer:2, why:"The \"therefore\" sentence is a middle step: it rests on the students' need and is used to support extending hours. Extending hours is what everything ends up supporting.", vocab:["conclusion","intermediate-conclusion","therefore"] },
{ id:"m035", kind:"tap", level:4, speaker:null, sents:[ {t:"For decades, Merrow County has relied on a single reservoir for its drinking water.", role:"background"}, {t:"Some officials argue that building a second reservoir is unnecessary.", role:"opposing"}, {t:"This view is shortsighted.", role:"conclusion"}, {t:"Over the last twenty years, rainfall in the county has fallen by a third while the population has grown steadily.", role:"premise"}, {t:"So the existing reservoir will soon be unable to meet demand.", role:"middle"} ], why:"Less rain and more people support the claim that the reservoir will soon fall short, and that claim supports calling the officials' view shortsighted. \"So\" marks the middle step, not the main conclusion.", signals:["so"] },
{ id:"m036", kind:"tap", level:4, speaker:"Critic", sents:[ {t:"The museum's director claims that lending paintings abroad puts them at too much risk.", role:"opposing"}, {t:"That worry is unfounded.", role:"conclusion"}, {t:"Over the past thirty years, the museum has lent more than 400 works overseas, and not a single one was damaged.", role:"premise"}, {t:"Careful lending has proven to be safe.", role:"middle"} ], why:"The 400 undamaged loans support the claim that careful lending is safe, and that safety supports the conclusion that the director's worry is unfounded. The middle step has no signpost word.", signals:[] },
{ id:"m037", kind:"tap", level:4, speaker:"Economist", sents:[ {t:"Brindle Corporation was founded in Ohio in 1952.", role:"background"}, {t:"Brindle earns most of its revenue from printed maps, and sales of printed maps have fallen every year for a decade.", role:"premise"}, {t:"Thus, Brindle's core business is shrinking.", role:"middle"}, {t:"It would be unwise for investors to expect Brindle's profits to recover without a major change in strategy.", role:"conclusion"} ], why:"Falling map sales support the claim that Brindle's core business is shrinking, and that claim supports warning investors. The founding date is background that supports nothing.", signals:["thus"] },
{ id:"m038", kind:"tap", level:4, speaker:null, sents:[ {t:"The town of Ashby has held a weekly farmers' market downtown since 1985.", role:"background"}, {t:"Some council members want to move the market to the edge of town to free up downtown parking.", role:"opposing"}, {t:"It would be a mistake to move it.", role:"conclusion"}, {t:"Downtown shops report that their sales are about 30 percent higher on market days.", role:"premise"}, {t:"Therefore, the market brings shoppers into downtown businesses.", role:"middle"} ], why:"Higher sales on market days support the claim that the market brings in shoppers, and that claim supports keeping the market downtown. \"Therefore\" introduces a middle step, because the main conclusion came earlier.", signals:["therefore"] },
{ id:"m039", kind:"tap", level:4, speaker:"Historian", sents:[ {t:"Many people believe that the medieval town of Varel was abandoned because of a plague.", role:"opposing"}, {t:"Historians would do better to look for another cause.", role:"conclusion"}, {t:"Burial records show that deaths in Varel stayed at normal levels throughout the plague years, and the town kept growing for another fifty years.", role:"premise"}, {t:"So the plague cannot be what emptied the town.", role:"middle"} ], why:"The burial records and growth support the claim that the plague did not empty Varel, and that claim supports looking for another cause. \"So\" marks the middle step here.", signals:["because","so"] },
{ id:"m040", kind:"tap", level:4, speaker:null, sents:[ {t:"Lowell installed its current coin parking meters in 2005.", role:"background"}, {t:"The planning office now wants to replace every one of them with a phone app.", role:"opposing"}, {t:"When the app was tested on two streets last year, so many drivers called the help line saying they could not figure out how to pay that the test ended early.", role:"premise"}, {t:"Evidently, the app confuses a large number of drivers.", role:"middle"}, {t:"Replacing every meter with it would be unwise.", role:"conclusion"} ], why:"The flood of help-line calls supports the claim that the app confuses many drivers, and that confusion supports calling the plan unwise. The \"so\" sits inside a premise and does not mark a conclusion.", signals:["so"] },
{ id:"m041", kind:"tap", level:4, speaker:"Ecologist", sents:[ {t:"Ranchers have claimed that the returning wolves will damage the valley's ecosystem.", role:"opposing"}, {t:"In fact, the wolves are likely to make the valley's streams healthier.", role:"conclusion"}, {t:"Now that wolves are back, elk no longer linger along the stream banks, where they used to graze young willows down to the ground.", role:"premise"}, {t:"The willows along the streams can now grow back.", role:"middle"}, {t:"Willow roots hold stream banks in place, and their shade keeps the water cool for fish.", role:"premise"} ], why:"The elk leaving the banks supports the claim that willows can regrow, and regrowing willows, which protect banks and cool the water, support the conclusion that the streams will get healthier.", signals:[] },
{ id:"m042", kind:"mc", level:4, q:"Argument: \"Some say the four-day workweek hurt the company. They are mistaken. Output rose 10 percent after the switch. Therefore, the shorter week made workers more productive.\" What role does the last sentence play?", opts:["Main conclusion, because it starts with \"therefore\"","Middle step: it is supported by the output data and used to show the critics are mistaken","Opposing view","Background"], answer:1, why:"The output data supports the productivity claim, and that claim supports \"They are mistaken,\" which is the main conclusion. \"Therefore\" can mark a middle step.", vocab:["intermediate-conclusion","therefore","conclusion","evidence"] }
];

const VOCAB_LEVELS = {

"inference": { kid:"Something you can figure out for sure from what you heard.", does:"Pulls out a new fact that has to be true from what was said.", whyThere:"Because facts often prove more than they say out loud.", connects:"The facts it is drawn from.", human:"Your sister says every store at the mall closes at nine, and Target is at the mall. What do you know about Target without asking?" },

"flaw": { kid:"A mistake in how someone thinks something through.", does:"Points to the spot where the thinking breaks down.", whyThere:"Many arguments sound good but take an unfair leap.", connects:"The step between the reasons and the conclusion.", human:"A neighbor says, 'I got sick after eating sushi once, so all sushi makes people sick.' What is wrong with how your neighbor thought that through?" },
"reasoning": { kid:"How someone gets from their reasons to their answer.", does:"Shows the path from the reasons to the point.", whyThere:"Every point needs a path; the path can be strong or weak.", connects:"Both the reasons and the conclusion, as a whole.", human:"Your friend says, 'It rained every day this week, so it will rain tomorrow.' How did your friend get to that guess?" },
"argument": { kid:"A point plus at least one reason for it. Not a fight.", does:"Tries to get you to accept a point by giving reasons.", whyThere:"Someone wants you to believe or do something, so they give reasons.", connects:"A conclusion and the premises that back it up.", human:"Your dad says, 'Take a jacket. It's going to drop to forty tonight.' Is he just yelling, or giving you a point plus a reason?" },
"evidence": { kid:"Facts that show something is true.", does:"Offers real information to back up a point.", whyThere:"Claims are easier to believe when facts stand behind them.", connects:"The claim or conclusion it is offered for.", human:"Your friend insists the dog ate the cake, and points to frosting on the dog's nose. What is the frosting being used to show?" },
"support": { kid:"Helping an idea seem more true.", does:"Makes another idea easier to believe.", whyThere:"Because the speaker wants to convince you.", connects:"A claim or conclusion.", human:"Your friend says the new cafe is good, and adds that it was packed every day this week. What does the packed cafe do for her point?" },

"strengthen": { kid:"Making someone's reason look better.", does:"Makes a point easier to believe, without fully proving it.", whyThere:"To close a gap and make the point more convincing.", connects:"The link between the reasons and the conclusion.", human:"Your coworker says the new hire is reliable because she was on time all week. You add she was on time all month. What happens to the point?" },
"justify": { kid:"Giving enough reason so the answer totally works.", does:"Supplies what is needed so the point is fully backed up.", whyThere:"Some points need more than a nudge; they need a full backing.", connects:"The conclusion and the gap it fully closes.", human:"A parent says, 'You can't go out tonight.' The teen asks, 'Why?' What does the parent need to give to make that decision fair?" },

"intermediate-conclusion": { kid:"A middle answer that helps reach the big answer.", does:"Is proven by some reasons, then used as a reason for the main point.", whyThere:"Bigger points are often built step by step.", connects:"The reasons below it and the main conclusion above it.", human:"'The roads are icy, so driving is dangerous, so we should stay home.' Which part is both backed up and used to back something else?" },

"counterexample": { kid:"One case that shows a rule is wrong.", does:"Breaks a rule that claims to be true every time.", whyThere:"One clear exception is enough to knock down an 'every time' claim.", connects:"A general rule or 'all' claim.", human:"Your friend says, 'Nobody likes black licorice.' You say, 'My grandma loves it.' What did your grandma just do to his claim?" },

"probably": { kid:"More likely yes than no.", does:"Says something is more likely than not, but not certain.", whyThere:"To make a claim stronger than 'maybe' but weaker than 'must.'", connects:"The claim it makes likely.", human:"Your friend says, 'The store is probably closed by now.' Is she certain, or making a good guess?" },
"likely": { kid:"Probably going to happen.", does:"Says something has a better than even chance.", whyThere:"To make a careful prediction without promising.", connects:"The claim it makes probable.", human:"The forecast says rain is likely tomorrow. Would you bring an umbrella? Would you bet your rent that it rains?" },
"unlikely": { kid:"Probably won't happen, but it could.", does:"Says something has less than an even chance.", whyThere:"To lean against something without ruling it out.", connects:"The claim it makes doubtful.", human:"Your friend says it's unlikely the bus is on time. If the bus shows up on time, was she wrong?" },
"generally": { kid:"Most of the time, but not every time.", does:"Says something is the usual pattern, with room for exceptions.", whyThere:"To make a broad claim that one exception cannot break.", connects:"The pattern it describes.", human:"Your friend says, 'Generally, I eat lunch at noon.' If you see her eating at two, did she lie?" },
"typically": { kid:"What normally happens.", does:"Describes the normal case, leaving room for exceptions.", whyThere:"To describe a pattern without claiming every case fits.", connects:"The normal pattern it describes.", human:"Your coworker says the boss typically arrives at eight. One day he comes at ten. Was your coworker wrong?" },
"usually": { kid:"Most of the time.", does:"Says something happens more often than not.", whyThere:"To describe a strong habit without saying 'always.'", connects:"The pattern or habit it describes.", human:"Your neighbor usually walks her dog at seven. Tonight she didn't. Does that break what you said about her?" },
"sometimes": { kid:"At least once in a while.", does:"Says something happens at least once, maybe often.", whyThere:"To make a weak, safe claim that is hard to disprove.", connects:"The event it says happens at least once.", human:"Your friend says, 'Sometimes I forget my keys.' How many times does she need to forget them for that to be true?" },
"rarely": { kid:"Not often, but it does happen.", does:"Says something happens only a little, but more than zero.", whyThere:"To admit something happens while saying it is uncommon.", connects:"The event it says happens seldom.", human:"Your uncle says he rarely gets sick. If he caught a cold last year, was he wrong?" },
"always": { kid:"Every single time. No exceptions.", does:"Says something happens in every case.", whyThere:"To make the strongest claim, which one exception can break.", connects:"The rule it makes total.", human:"Your roommate says, 'You always leave dishes in the sink.' You washed them yesterday. What does that do to her claim?" },
"never": { kid:"Not even once.", does:"Says something happens in zero cases.", whyThere:"To make an absolute claim, which one case can break.", connects:"The event it rules out completely.", human:"Your friend says, 'I never eat fast food.' You saw her at a drive-thru last week. What happened to her claim?" },
"necessarily": { kid:"It has to be true, guaranteed.", does:"Says something is guaranteed, with no way around it.", whyThere:"To mark certainty; 'not necessarily' means it might not be.", connects:"The claim it makes certain.", human:"Your friend says, 'Expensive doesn't necessarily mean better.' Is she saying expensive things are always worse?" },
"possibly": { kid:"Maybe. It isn't impossible.", does:"Says something has some chance of being true.", whyThere:"To make the weakest kind of claim: just not ruled out.", connects:"The claim it marks as possible.", human:"The doctor says the pain is possibly a pulled muscle. Did she say that's what it is?" },
"certainly": { kid:"Definitely true. No doubt.", does:"Says something is sure, with no room for doubt.", whyThere:"To show full confidence in a claim.", connects:"The claim it makes sure.", human:"Your friend says, 'I'll certainly be there.' How much room did she leave for not showing up?" },
"virtually": { kid:"Almost all the way.", does:"Says something is nearly total, but not quite.", whyThere:"To make a strong claim while leaving a tiny exception.", connects:"The claim it makes almost total.", human:"Your coworker says the office is virtually empty on Fridays. If two people are there, was she wrong?" },
"primarily": { kid:"Mainly. Mostly.", does:"Names the biggest part or main reason, not the only one.", whyThere:"To rank one thing as the main one among others.", connects:"The main item among several.", human:"Your friend says she moved primarily for the job. Could the weather have been a smaller reason too?" },
"predominantly": { kid:"Mostly. The biggest part.", does:"Says one kind makes up most of a group.", whyThere:"To describe the main makeup of a group without saying 'all.'", connects:"The group and its main part.", human:"Your neighbor says the crowd at the game was predominantly home fans. Were there any away fans there?" },
"all": { kid:"Every single one.", does:"Says something is true of every member of a group.", whyThere:"To make the strongest group claim, which one exception breaks.", connects:"The whole group it covers.", human:"Your boss says all employees get a bonus. You didn't get one. What does that tell you about her statement?" },
"most": { kid:"More than half. Could even be all.", does:"Says more than half of a group, possibly every one.", whyThere:"To make a strong claim without promising every case.", connects:"The group it describes.", human:"Your friend says most of the guests liked the cake. If every guest liked it, was she still right?" },
"many": { kid:"A lot, but maybe not most.", does:"Says a good number, without saying more than half.", whyThere:"To sound big without committing to a majority.", connects:"The group it describes.", human:"A news report says many people skipped the vote. Does that mean most people skipped it?" },
"some": { kid:"At least one. Could be all.", does:"Says at least one member fits, maybe more, maybe every one.", whyThere:"To make a small, safe claim that is easy to prove.", connects:"The group it describes.", human:"Your friend says some of her cousins live in Texas. If all of them do, was she lying?" },
"few": { kid:"A small number. Not many.", does:"Says only a small number fit, usually at least one.", whyThere:"To stress how small a number is.", connects:"The group it describes.", human:"Your friend says few people came to his show. Did anyone come?" },
"none": { kid:"Zero. Not even one.", does:"Says not a single member of the group fits.", whyThere:"To make an absolute claim that one case can break.", connects:"The whole group it rules out.", human:"Your roommate says none of the milk is left. You find a full carton. What happened to her claim?" },
"not-all": { kid:"At least one is left out. Maybe all are.", does:"Says at least one member does not fit, possibly none fit.", whyThere:"To deny an 'every' claim with the smallest proof needed.", connects:"An 'all' claim it denies.", human:"Your friend says, 'Not all the cookies are chocolate chip.' Could it be that none of them are?" },
"must-be-true": { kid:"Find the answer the story proves for sure.", does:"Asks for the answer that has to be true from the passage.", whyThere:"To test whether you can stick to what the facts guarantee.", connects:"The facts in the passage, taken as true.", human:"Your friend says the party is Saturday and she never works weekends. What can you say for sure about her and work on party day?" },
"could-be-true": { kid:"Find the answer that is possible.", does:"Asks for the answer the passage does not rule out.", whyThere:"To test whether you can tell 'possible' from 'proven' and 'impossible.'", connects:"The facts in the passage and what they rule out.", human:"You know your friend was at work until five. Could she have gone to the gym at six? Could she have been at the gym at three?" },
"cannot-be-true": { kid:"Find the answer the story proves wrong.", does:"Asks for the answer that clashes with the passage.", whyThere:"To test whether you can spot what the facts rule out.", connects:"The facts in the passage and what they rule out.", human:"Your coworker was in a meeting from two to four. Someone says he was at the dentist at three. Can that be true?" },
"most-strongly-supported": { kid:"Find the answer the story backs up the best.", does:"Asks for the answer the passage gives the most reason to believe.", whyThere:"To test whether you can pick the safest answer, not the boldest.", connects:"The facts in the passage.", human:"The office fridge is empty every Monday and the cleaners come Sunday night. What is the best guess about why it's empty?" },
"properly-inferred": { kid:"Find what you can figure out for sure.", does:"Asks for the answer that has to follow from the passage.", whyThere:"To test whether you can draw only safe, certain conclusions.", connects:"The facts in the passage.", human:"Every train today is delayed, and you are taking a train today. What can you figure out for sure about your trip?" },
"logically-follows": { kid:"The answer comes out of the facts for sure.", does:"Says the answer is guaranteed by what came before.", whyThere:"To test whether a conclusion is fully backed by the facts.", connects:"The facts before it and the result after it.", human:"All the doors are locked, and the back door is a door. What comes out of that for sure about the back door?" },
"reasoning-is-flawed-because": { kid:"Find the mistake in how they thought it through.", does:"Asks you to name the error in how the argument reasons.", whyThere:"To test whether you can spot a bad leap, not just bad facts.", connects:"The step from the reasons to the conclusion.", human:"'My cousin smoked and lived to ninety, so smoking is safe.' Where does that thinking go wrong?" },
"vulnerable-to-criticism": { kid:"What's wrong with how they argued?", does:"Asks you to find the weak spot in the argument's thinking.", whyThere:"It is a polite way of asking you to name the mistake.", connects:"The step from the reasons to the conclusion.", human:"'Lots of people bought this phone, so it must be the best.' If you wanted to poke a hole in that, where would you poke?" },
"depends-on-assuming": { kid:"Find the hidden belief they need.", does:"Asks for an unstated idea the argument must rely on.", whyThere:"To test whether you can find what the argument quietly needs.", connects:"The gap between the reasons and the conclusion.", human:"'The restaurant has great reviews, so we'll have a great meal.' What does that plan quietly count on?" },
"assumption-required": { kid:"Find what has to be true for the argument to work.", does:"Asks for the hidden idea the argument cannot do without.", whyThere:"To test whether you can find the argument's hidden need.", connects:"The gap between the reasons and the conclusion.", human:"'I'll get the job because I have the most experience.' What has to be true about how they pick people?" },
"enables-the-conclusion-to-be-properly-drawn": { kid:"Find the missing piece that makes the answer proven.", does:"Asks for a fact that, added in, fully proves the conclusion.", whyThere:"To test whether you can close the argument's gap completely.", connects:"The gap between the reasons and the conclusion.", human:"'Maya is in the band, so Maya can read music.' What one rule would make that totally certain?" },
"most-helps-justify": { kid:"Find the rule that makes the decision fair.", does:"Asks for a rule that, if accepted, backs up the conclusion.", whyThere:"To test whether you can match a rule to a decision.", connects:"The conclusion or decision being backed up.", human:"A coach benched a star who skipped practice. What rule would make that decision clearly fair?" },
"most-strengthens": { kid:"Find the fact that helps their reason the most.", does:"Asks for the new fact that makes the argument most convincing.", whyThere:"To test whether you can find and close the argument's gap.", connects:"The link between the reasons and the conclusion.", human:"'Our sales rose after the new ad, so the ad worked.' What new fact would make you believe that even more?" },
"most-weakens": { kid:"Find the fact that hurts their reason the most.", does:"Asks for the new fact that makes the argument least convincing.", whyThere:"To test whether you can find the argument's weak spot.", connects:"The link between the reasons and the conclusion.", human:"'Our sales rose after the new ad, so the ad worked.' What new fact would make you doubt that?" },
"most-helps-resolve": { kid:"Find the fact that fixes the puzzle.", does:"Asks for the fact that lets two clashing facts both make sense.", whyThere:"To test whether you can explain a surprising situation.", connects:"The two facts that seem to clash.", human:"A gym got more members but made less money. What fact would make that make sense?" },
"most-analogous": { kid:"Find the one with the same pattern.", does:"Asks for the answer that matches the passage in the way that matters.", whyThere:"To test whether you can see structure, not just topic.", connects:"The passage and a matching situation.", human:"A chef who tastes every dish before serving it. Which is more like that: a writer who proofreads, or a writer who buys a pen?" },
"conforms-to-the-principle": { kid:"Find the case that follows the rule.", does:"Asks for the situation that fits a given rule.", whyThere:"To test whether you can apply a rule exactly as written.", connects:"A general rule and a specific case.", human:"House rule: 'If you borrow the car, fill the tank.' Your sister borrowed it and filled it. Did she follow the rule?" },
"role-played-in-the-argument": { kid:"What job does this sentence do?", does:"Asks what part a statement plays: reason, main point, or something else.", whyThere:"To test whether you understand how the argument is built.", connects:"One statement and the argument around it.", human:"'Stay inside. It's freezing, so you could get sick.' Is 'it's freezing' the point, or a reason for the point?" },
"except": { kid:"Find the one that does NOT fit.", does:"Flips the question so four answers fit and one does not.", whyThere:"To check that you read carefully and look for the odd one out.", connects:"The rest of the question it flips.", human:"'Everyone can come to the party except Jake.' Who is the one person who doesn't fit?" },
"because": { kid:"Here comes the reason.", does:"Introduces a reason for something just said or about to be said.", whyThere:"The speaker is showing you why they believe something.", connects:"After it: a reason. It backs the point near it.", human:"Your friend says, 'I'm not going, because I'm exhausted.' Which part is her reason?" },
"since": { kid:"Here comes the reason, like 'because.'", does:"Introduces a reason that backs up the point.", whyThere:"To give a reason, often at the start of the sentence.", connects:"After it: a reason. The point comes in the other half.", human:"'Since you cooked, I'll do the dishes.' Which part is the reason for washing the dishes?" },

"so": { kid:"Because of that.", does:"Introduces a point or result that comes from the reason before it.", whyThere:"It is the most everyday way to state a conclusion.", connects:"Before it: a reason. After it: the conclusion.", human:"'It's raining, so bring a jacket.' Which part is the point your friend wants you to act on?" },
"although": { kid:"Even though. Admits something first.", does:"Admits a point on the other side before giving the main point.", whyThere:"To seem fair by admitting a problem, then pushing past it.", connects:"After it: an admission. The main point comes in the other half.", human:"'Although the apartment is small, it's in a great spot, so let's take it.' Which part is the downside she admits?" },
"however": { kid:"But. Here's the other side.", does:"Turns the direction, often toward the speaker's real point.", whyThere:"To push back on what came before.", connects:"Before it: one side. After it: a contrast, often the main point.", human:"'Many say the movie is slow. However, I loved it.' Which side is the speaker really on?" },

"despite": { kid:"Even with this happening.", does:"Names something that might have stopped a result, but didn't.", whyThere:"To show a result happened against the odds.", connects:"Right after it: an obstacle. The rest: what happened anyway.", human:"'Despite the rain, the game went on.' Did the rain stop the game?" },
"for-example": { kid:"Here's one case to show what I mean.", does:"Gives a specific case to back up a general point.", whyThere:"Examples make a broad point easier to believe.", connects:"After it: a specific case. It backs a broader point.", human:"'My boss is generous. For example, she bought us all lunch Friday.' What is the lunch being used to show?" },
"moreover": { kid:"Also. Here's one more thing.", does:"Adds another point or reason in the same direction.", whyThere:"To pile on more support.", connects:"Before it: one reason. After it: another reason pointing the same way.", human:"'This apartment is cheap. Moreover, it's close to work.' Is the second part for or against the apartment?" },
"unless": { kid:"If not.", does:"Sets a rule: if this thing does not happen, the other result follows.", whyThere:"To name the one thing that can stop a result.", connects:"After it: the escape. The other half: what happens without it.", human:"'We'll eat outside unless it rains.' If it doesn't rain, where do you eat? If it rains, is eating outside ruled out?" },

"if": { kid:"If this happens, that will happen.", does:"Introduces something that guarantees the result.", whyThere:"To set up a rule about what leads to what.", connects:"After it: the trigger. The other half: the guaranteed result.", human:"'If you finish your work, you can leave early.' You finished. What can you do? If you left early, did you have to finish?" },

"either": { kid:"At least one of the two, maybe both.", does:"Says at least one of two options holds, possibly both.", whyThere:"To limit the possibilities down to two choices.", connects:"Two options joined by 'or.'", human:"'Either Sam or Lee will pick you up.' If Sam doesn't come, who will? Could both show up?" },
"neither": { kid:"Not this one and not that one.", does:"Rules out both of two options.", whyThere:"To deny two things at once.", connects:"Two options joined by 'nor.'", human:"'Neither the bank nor the post office is open today.' Can you go to the bank today?" },
"both": { kid:"This one and that one too.", does:"Says two things are each true.", whyThere:"To join two claims that must each hold.", connects:"Two things joined by 'and.'", human:"'Both my brothers are coming.' If only one shows up, was the statement right?" },
"assert": { kid:"To say firmly that something is true.", does:"States a claim with confidence.", whyThere:"Authors use it to show who believes what.", connects:"The person speaking and the claim they make.", human:"At dinner your uncle says flatly, 'This is the best pie in the state.' What is he doing with that sentence?" },
"contend": { kid:"To argue that something is true.", does:"Puts forward a claim, often one others disagree with.", whyThere:"To show a person is taking a side in a debate.", connects:"The person and the position they argue for.", human:"Your coworker keeps saying the four-day week would boost output, even though others doubt it. What is she doing?" },
"maintain": { kid:"To keep saying something is true.", does:"Holds onto a claim, often despite pushback.", whyThere:"To show someone sticks to their view.", connects:"The person and the view they hold onto.", human:"Even after the evidence came out, the suspect kept saying he was home all night. What is he doing with his story?" },
"advocate": { kid:"To speak up for an idea or plan.", does:"Publicly pushes for a plan or idea.", whyThere:"To show someone is on the side of a plan, not just describing it.", connects:"The person and the plan they push for.", human:"A parent goes to every school meeting to push for later start times. What is the parent doing for that idea?" },
"challenge": { kid:"To ask if something is really true or right.", does:"Questions or pushes back on a claim or view.", whyThere:"To show someone doubts or opposes another view.", connects:"The challenger and the view being questioned.", human:"Your friend says the new diet works, and you ask, 'Where's the proof?' What are you doing to her claim?" },
"undermine": { kid:"To make something weaker, little by little.", does:"Weakens a claim or position, often from underneath.", whyThere:"To show one idea or fact damages another.", connects:"The thing doing damage and the claim it weakens.", human:"Your coworker says he's reliable, but he's missed three deadlines. What do the missed deadlines do to his claim?" },
"concede": { kid:"To admit the other side has a point.", does:"Admits something that helps the other side.", whyThere:"To seem fair before pushing the main point.", connects:"The speaker and the point they give up.", human:"In a debate about pets, your friend says, 'Okay, dogs are more work than cats, but I still want one.' What did she just admit?" },
"acknowledge": { kid:"To admit or say that something is true.", does:"Recognizes a fact or point, often one that is inconvenient.", whyThere:"To show the author sees another side or a limit.", connects:"The speaker and the fact they accept.", human:"Your manager says, 'Yes, the project ran late,' then explains why. What did she do about the late project?" },
"critique": { kid:"A careful look that points out problems.", does:"Examines something and points out its weak spots.", whyThere:"To judge how good or bad an idea or work is.", connects:"The critic and the work or idea being judged.", human:"A friend reads your resume and says, 'The layout is good, but your job titles are unclear.' What did your friend just give you?" },
"skeptical": { kid:"Not ready to believe it yet.", does:"Describes doubt about a claim until more proof comes.", whyThere:"To show an attitude of doubt, not full rejection.", connects:"The doubter and the claim they doubt.", human:"An ad says a cream erases wrinkles in one day. You raise an eyebrow and want proof. How are you feeling about the ad?" },
"ambiguous": { kid:"Could mean more than one thing.", does:"Marks words that can be read in two or more ways.", whyThere:"Unclear words can make an argument seem stronger than it is.", connects:"A word or phrase and its possible meanings.", human:"Your friend texts, 'I saw her duck.' Did she see a bird, or see someone bend down?" },
"explicit": { kid:"Said clearly and out loud.", does:"Marks something stated directly in the text.", whyThere:"To separate what was actually said from what was only hinted.", connects:"The exact words in the text.", human:"Your landlord's note says, 'Rent is due on the first.' Did you have to guess what he meant?" },
"implicit": { kid:"Hinted at, but not said out loud.", does:"Marks something suggested but never stated.", whyThere:"Authors often hint at views without spelling them out.", connects:"The words in the text and what they hint at.", human:"Your friend looks at your outfit and says, 'Wow, bold choice.' She didn't say she hates it. What is she hinting?" },
"phenomenon": { kid:"Something that happens that people notice.", does:"Names an event or pattern that people observe and study.", whyThere:"Passages often start with something odd that needs explaining.", connects:"The explanation or theory offered for it.", human:"Every spring, birds fly back north at almost the same time. What do you call something like that people notice and study?" },
"conventional": { kid:"The usual way most people do it.", does:"Describes the normal, widely accepted way or view.", whyThere:"Authors often set up the usual view so they can challenge it.", connects:"The common view and the new view that pushes against it.", human:"Most people think breakfast is the most important meal. A new book says that's wrong. Which is the usual view?" },
"orthodox": { kid:"What most experts agree on.", does:"Describes the accepted, traditional view in a field.", whyThere:"To set up the standard view, often before a challenge.", connects:"The standard view and any challenger to it.", human:"For years, doctors agreed ulcers came from stress. Then one doctor said germs caused them. Which was the accepted view?" },
"novel": { kid:"New and different.", does:"Describes an idea or approach that is new.", whyThere:"To mark a fresh idea that breaks from the usual one.", connects:"The new idea and the older views it differs from.", human:"Your friend suggests paying rent with work hours instead of money. Is that a familiar idea or a new one?" },
"plausible": { kid:"Believable. Could really be true.", does:"Describes a claim that is reasonable, though not proven.", whyThere:"To say an idea makes sense without claiming it is certain.", connects:"The claim and how believable it is.", human:"Your friend says she's late because of traffic. You know traffic is bad today. Is her excuse believable?" },
