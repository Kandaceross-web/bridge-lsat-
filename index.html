async function bdNext(key, note, forced){
  const b = U.bd[key]; if(!b) return;
  b.state = "loading"; render();
  const depth = b.levels.length + 1;
  const sample = await getSample();
  if(sample){
    let [mid, how] = AI_METHODS[Math.min(depth-1, AI_METHODS.length-1)];
    if(forced && BD_MODES[forced]){ mid = forced; how = BD_MODES[forced][1]; }
    const isQ = key.startsWith("q:");
    let reveal = "yes";
    if(key.startsWith("s1:")){ const set = s1().set; const uid = key.slice(3); const answered = !(set && set.items[set.i]===uid && !set.answered); reveal = (answered || depth>=3 || forced==="right") ? "yes" : "no: help her find it herself; don't say which sentence or option is the answer"; }
    if(isQ){ const s = qs(key.slice(2)); reveal = (s.done || S.settings.justTell || depth>=4) ? "yes" : "no: help her see the structure but don't name the correct letter or say which choice is right"; }
    const tried = b.levels.map((l,i)=>[l,i]).slice(-5).map(([l,i])=>"Attempt " + (i+1) + " (" + (METHOD_NAMES[l.m]||l.m) + "):\n" + (l.text || "[a visual/sentence-by-sentence breakdown was shown]")).join("\n\n");
    const prompt = RULES + "\n\nCONTEXT (live from the app):\n" + tutorContext() +
      "\n\nBREAKDOWN MODE. She pressed I DON'T UNDERSTAND. The app shows your explanation, then asks her \"Do you understand now? Yes / No\" itself, so do NOT end with a question." +
      "\nThis is attempt " + depth + "." + (tried ? " She did NOT understand these earlier attempts, so do not reuse their approach or examples:\n\n" + tried : "") +
      (note ? "\n\nWhat she says is confusing: \"" + note + "\". Aim squarely at that." : "") +
      "\n\nMethod for this attempt: " + how + "\nReveal the correct answer: " + reveal + ".\nUnder 170 words. Start directly with the explanation, no preamble.";
    const lv = {m:mid, title:(depth>1?"Another way: ":"") + METHOD_NAMES[mid], text:""}; b.levels.push(lv); b.state = "streaming"; render();
    try{
      const r = await sample(prompt, {cache:false, onText:({text})=>{ lv.text = text; const el = document.getElementById(bdId(key)+"-live"); if(el) el.innerHTML = md(text); }});
      lv.text = r.text; b.state = "ask";
    }catch(e){
      if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)) T.sample = null;
      b.levels.pop(); return bdStatic(key, forced);
    }
    render(); return;
  }
  bdStatic(key, forced);
}
function bdStatic(key, forced){
  const b = U.bd[key]; const L = ladderFor(key).concat(bdExtras(key));
  const used = new Set(b.levels.map(l=>l.m));
  let next = forced ? (L.find(l=>l.m===forced && !used.has(l.m)) || L.find(l=>!used.has(l.m))) : L.find(l=>!used.has(l.m) && !["mywrong","right","example"].includes(l.m));
  if(!next && !forced) next = L.find(l=>!used.has(l.m));
  if(!next){
    b.state = "out";
    if(key.startsWith("q:")){ const qid = key.slice(2).replace(/^r:/,""); scheduleReview(qid, false); }
    save(); render(); return;
  }
  b.levels.push({m:next.m, title:(b.levels.length?"Another way: ":"") + (METHOD_NAMES[next.m]||"Explanation"), text:next.text, html:next.html});
  b.state = "ask"; render();
}

   ========================================================= */
async function lookup(word, sentence, x, y){
  const w = word.replace(/[^a-z\-]/gi,"").toLowerCase(); if(!w) return;
  if(V_ALIAS_MAP[w]){ openCard(V_ALIAS_MAP[w]); return; }
  const pop = document.createElement("div"); pop.className="pop"; pop.setAttribute("role","dialog");
  const place = () => { const r = pop.getBoundingClientRect(); pop.style.left = Math.max(16, Math.min(x, innerWidth - r.width - 16))+"px"; pop.style.top = Math.max(16, Math.min(y+14, innerHeight - r.height - 16))+"px"; };
  const v = VOCAB[w];
  const show = d => { pop.innerHTML = '<h4>'+esc(w)+'</h4>'+(d.simple?'<div><span class="mono">Simple meaning</span><br>'+esc(d.simple)+'</div>':"")+(d.here?'<div><span class="mono">In this sentence</span><br>'+esc(d.here)+'</div>':"")+(d.life?'<div><span class="mono">In normal life</span><br>'+esc(d.life)+'</div>':"")+(d.syn?'<div><span class="mono">Synonym</span> '+esc(d.syn)+'</div>':"")+'<button class="btn ghost" data-act="pop-close" style="align-self:flex-end;padding:4px 10px">Close</button>'; place(); };
  $("#popwrap").innerHTML=""; $("#popwrap").append(pop);
  if(v) show({...v, here: v.here}); else { pop.innerHTML = '<h4>'+esc(w)+'</h4><p class="muted">Looking it up\u2026</p>'; place(); }
  const sample = await getSample();
  if(!sample){ if(!v){ pop.innerHTML = '<h4>'+esc(w)+'</h4><p class="muted">Word lookups need the live tutor (open this page inside Claude). Underlined words have built-in definitions.</p><button class="btn ghost" data-act="pop-close" style="align-self:flex-end">Close</button>'; place(); } return; }
  try{
    const d = await sample.json('Define a word for a beginner LSAT student. Word: "'+w+'". Sentence it appears in: "'+sentence+'". Reply with only JSON: {"simple": "plain definition, under 12 words", "here": "what it means in THIS sentence, under 20 words", "life": "one everyday example sentence", "syn": "one synonym"}', {modelTier:"quick", cache:{gcTime:864e5}});
    if(pop.isConnected) show(d);
  }catch(e){ if(!v && pop.isConnected){ pop.innerHTML = '<h4>'+esc(w)+'</h4><p class="muted">Couldn\u2019t look that up right now.</p><button class="btn ghost" data-act="pop-close" style="align-self:flex-end">Close</button>'; place(); } }
}

function completeStep(id){ if(!S.steps[id]){ S.steps[id]=true; addXP(10, "Finished: " + STEPS.find(s=>s.id===id).t); save(); } }

function submit(id, kind){
  const isReview = id.startsWith("r:"); const q = Q(id.replace(/^r:/,"")); const s = qs(id);
  if(!s.sel) return;
  const indep = kind!=="guided";
  const correct = s.sel===q.answer; const chosen = q.choices.find(c=>c.l===s.sel);
  if(!indep && !correct){
    s.tries.push(s.sel); record({qid:q.id, kind:"guided", correct:false, firstTry:s.tries.length===1, choice:s.sel, trap:chosen.trap, timeMs:Date.now()-s.start, changed:s.changed});
    s.sel = null; render(); return;
  }
  s.done = true; s.end = Date.now(); s.correct = correct; s.firstTry = s.tries.length===0;
  record({qid:q.id, kind: isReview?"review":(indep?"independent":"guided"), correct: correct && (indep || s.firstTry) ? true : correct, firstTry:s.firstTry, choice:s.sel, conf:s.conf, trap: correct?null:chosen.trap, timeMs:s.end-s.start, changed:s.changed});
  if(correct) addXP(s.firstTry?15:8, s.firstTry?"Correct":"Got there"); else touchDay();
  if(indep){
    const lowConf = s.conf==="guess"||s.conf==="maybe";
    scheduleReview(q.id, correct && !lowConf);
    if(!correct) S.journal.push({qid:q.id, mine:s.sel, trap:chosen.trap, conf:s.conf, confWrong: s.conf==="sure"||s.conf==="pretty", at:Date.now(), reason:null, review:isReview});
  } else if(!s.firstTry){ scheduleReview(q.id, false); S.journal.push({qid:q.id, mine:s.tries[0], trap:q.choices.find(c=>c.l===s.tries[0]).trap, at:Date.now(), reason:null}); }
  // finish step when all done
  const list = QUESTIONS.filter(x=>x.mode===(kind==="guided"?"guided":"independent"));
  if(!isReview && list.every(x=>U.q[x.id]&&U.q[x.id].done)) completeStep(kind==="guided"?"guided":"solo");
  save(); render(); renderTutorHead();
}

async function teachCheck(){
  const text = (U.teachDraft||"").trim();
  if(text.split(/\s+/).length < 15){ toast("Write a few sentences first, with your own example."); return; }
  const sample = await getSample();
  if(!sample){ U.teachSelf = true; render(); return; }
  U.teachBusy = true; render();
  try{
    const r = await sample.json("You are grading a beginner LSAT student's 'teach it back' explanation of premise vs conclusion. Be warm, specific and honest; never shaming. A passing explanation must: (1) say the conclusion is the claim/point the arguer wants you to believe, (2) say a premise is a reason/evidence supporting it, (3) give a way to tell them apart (e.g. asking 'why should I believe that?', 'therefore' test, or indicator words, ideally noting order can vary), (4) include her own example with the parts correctly identified. Watch for confusion such as calling the conclusion 'the last sentence' or 'a summary', or mixing up which supports which.\n\nLearner memory:\n"+learnerSummary()+"\n\nHer explanation:\n\"\"\""+text.slice(0,4000)+"\"\"\"\n\nReply with only JSON: {\"verdict\":\"got_it\"|\"almost\"|\"not_yet\", \"strengths\":[\"1-2 short sentences\"], \"gaps\":[\"0-3 short sentences naming what's missing or confused\"], \"reteach\":\"if not got_it: re-explain the confused part in a NEW way (an everyday analogy), under 60 words; else empty\", \"followup\":\"one short question or mini-task to check understanding\"}", {modelTier:"default", cache:false});
    const passed = r.verdict==="got_it";
    S.teach = {passed, verdict:r.verdict, strengths:[].concat(r.strengths||[]), gaps:[].concat(r.gaps||[]), reteach:r.reteach||"", followup:r.followup||"", at:Date.now(), text};
    if(passed){ completeStep("teach"); addXP(25,"You taught it back"); }
    save();
  }catch(e){
    if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){ T.sample=null; U.teachSelf = true; }
    else toast(e.code==="rate_limited"?"Usage limit reached. Try again in a bit.":"Couldn\u2019t check that just now. Try again.");

  U.teachBusy = false; render();
}

function mergeState(o){
  const uniq = (a,b,key) => { const m = new Map(); [...a,...b].forEach(x=>m.set(key(x),x)); return [...m.values()].sort((x,y)=>(x.at||0)-(y.at||0)); };
  S.attempts = uniq(S.attempts, o.attempts||[], x=>x.at+":"+x.qid);
  S.journal = uniq(S.journal, o.journal||[], x=>x.at+":"+x.qid);
  S.xp = Math.max(S.xp, o.xp||0);
  for(const k in (o.steps||{})) if(o.steps[k]) S.steps[k] = true;
  for(const [k,r] of Object.entries(o.reviews||{})){ const mine = S.reviews[k]; if(!mine || (r.due||0) > (mine.due||0)) S.reviews[k] = r; }
  for(const g of ["traps","reasons","idk"]) for(const [k,v] of Object.entries((o.profile||{})[g]||{})) S.profile[g][k] = Math.max(S.profile[g][k]||0, v);
  if(o.teach && (!S.teach || (o.teach.passed && !S.teach.passed) || (o.teach.at||0) > (S.teach.at||0) && !S.teach.passed)) S.teach = o.teach;
  if(o.streak && o.streak.last && (!S.streak.last || o.streak.last > S.streak.last || (o.streak.last===S.streak.last && o.streak.count>S.streak.count))) S.streak = o.streak;
  S.welcomed = S.welcomed || o.welcomed;
  if(o.s1){ const a = s1(), b = o.s1; const key = l=>l.at+"|"+l.uid; const seenK = new Set(a.log.map(key)); a.log = a.log.concat((b.log||[]).filter(l=>!seenK.has(key(l)))).sort((x,y)=>x.at-y.at).slice(-1500);
    for(const k in (b.lessons||{})) if(b.lessons[k]) a.lessons[k] = true; for(const k in (b.seen||{})) if(!a.seen[k] || (b.seen[k].at||0)>(a.seen[k].at||0)) a.seen[k] = b.seen[k];
    if(b.teach && (!a.teach || (b.teach.passed && !a.teach.passed))) a.teach = b.teach; a.exams = (a.exams||[]).concat((b.exams||[]).filter(e=>!(a.exams||[]).some(x=>x.at===e.at)));
    a.examUsed = [...new Set((a.examUsed||[]).concat(b.examUsed||[]))]; if(b.mastered){ a.mastered = true; a.masteredAt = a.masteredAt||b.masteredAt; }
    if(b.retention && (!a.retention || (b.retention.passed && !a.retention.passed))) a.retention = b.retention; }
  if(o.vocab){ S.vocab = S.vocab||{}; for(const id in o.vocab){ const x = o.vocab[id], y = S.vocab[id]; if(!y || (x.n||0)>(y.n||0)) S.vocab[id] = x; } }
  if(o.badges) S.badges = [...new Set((S.badges||[]).concat(o.badges))];
  if(o.plan){ S.plan = S.plan||{tests:[]}; const P = S.plan;
    if(!P.start || (o.plan.start && o.plan.start < P.start)) P.start = o.plan.start || P.start;
    P.target = P.target || o.plan.target; P.hours = P.hours || o.plan.hours; P.essays = Math.max(P.essays||0, o.plan.essays||0);
    const ids = new Set((P.tests||[]).map(t=>t.date+"|"+t.name+"|"+t.score)); P.tests = (P.tests||[]).concat((o.plan.tests||[]).filter(t=>!ids.has(t.date+"|"+t.name+"|"+t.score))); }
}

/* timer tick */
setInterval(()=>{ const t=$("#timer"); if(!t) return; const st=+t.dataset.start, sp=+t.dataset.stop||Date.now(); t.textContent = fmtTime(sp-st); }, 1000);

/* =========================================================
   VOCABULARY ENGINE (permanent module)
   ========================================================= */
const VBANK = (typeof VOCAB_BANK!=="undefined" ? VOCAB_BANK : []).filter(v=>!VB_EXTRA.some(e=>e.id===v.id)).concat(VB_EXTRA);
const VB = {}; VBANK.forEach(v=>VB[v.id]=v);
const VCATS = [["lr","Logic terms"],["signal","Signal words"],["strength","Strength and certainty"],["stem","Question language"],["rc","Reading words"]];
const V_INT = [2*60e3, 20*60e3, 18*3600e3, 3*864e5, 7*864e5, 14*864e5, 30*864e5];
const SIGNAL_ROLE = {};
["therefore","thus","hence","consequently","so","accordingly","clearly","it-follows-that","this-shows-that","we-can-conclude-that","for-this-reason","as-a-result","which-means-that","we-should-conclude","it-can-be-inferred-that"].forEach(k=>SIGNAL_ROLE[k]="conclusion");
["because","since","moreover"].forEach(k=>SIGNAL_ROLE[k]="evidence");
SIGNAL_ROLE["for-example"]="example";
["although","however","but","yet","nevertheless","despite"].forEach(k=>SIGNAL_ROLE[k]="contrast");
["unless","only","only-if","if","without","either","neither","both"].forEach(k=>SIGNAL_ROLE[k]="logic");
const ROLE_LABEL = {conclusion:"Possible conclusion coming", evidence:"Evidence (a reason) coming", example:"An example coming", contrast:"Contrast: a change in direction", logic:"A condition or logic rule: slow down"};
const V_PRIORITY = STEP1_WORDS.concat(["premise","because","since","for-example","moreover","however","but","although","yet","must","could","some","most","all","none","not-all","likely","probably"]).concat(VBANK.filter(v=>v.cat==="lr").map(v=>v.id)).concat(VBANK.filter(v=>v.cat==="signal").map(v=>v.id)).concat(VBANK.filter(v=>v.cat==="strength").map(v=>v.id)).concat(VBANK.filter(v=>v.cat==="stem").map(v=>v.id)).concat(VBANK.filter(v=>v.cat==="rc").map(v=>v.id)).filter((x,i,a)=>VB[x] && a.indexOf(x)===i);

const shuffle = a => { const b=a.slice(); for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
function vrec(id){ S.vocab = S.vocab||{}; return S.vocab[id] || (S.vocab[id] = {st:0,due:0,n:0,ok:0,bad:0,streak:0,types:{},days:[],ms:[],weak:false,taught:0}); }
function vstatus(id){ const r=(S.vocab||{})[id]; if(!r || !r.n) return "new"; if(r.weak) return "weak"; if(r.st>=4 && r.days.length>=3 && Object.keys(r.types).length>=2 && r.ms.length>=2 && r.ms.slice(-2).every(m=>m<=8000)) return "mastered"; return "learning"; }
const VSTAT_LABEL = {new:"New", learning:"Learning", weak:"Needs review", mastered:"Mastered"};
function vMissToday(id){ if(!S.vmiss || S.vmiss.day!==today()) S.vmiss = {day:today(), ids:[]}; if(!S.vmiss.ids.includes(id)) S.vmiss.ids.push(id); }
function vRecord(id, ok, type, ms){
  if(!VB[id]) return; const r = vrec(id); r.n++; r.last = Date.now(); touchDay();
  if(ok){ r.ok++; r.streak++; r.types[type]=1; if(!r.days.includes(today())) r.days.push(today()); r.ms.push(ms||0); r.ms = r.ms.slice(-5);
    if(!(ms>15000)) r.st = Math.min(r.st+1, V_INT.length-1); if(r.streak>=2) r.weak=false; r.due = Date.now()+V_INT[r.st]; }
  else { r.bad++; r.streak=0; r.weak=true; r.st=0; r.due=Date.now()+V_INT[0]; vMissToday(id); }
}
function vUnsure(id){ const r = vrec(id); r.streak=0; r.weak=true; r.st=0; r.due=Date.now()+V_INT[0]; vMissToday(id); save(); }
function vCounts(ids){ const c={new:0,learning:0,weak:0,mastered:0}; (ids||VBANK.map(v=>v.id)).forEach(id=>c[vstatus(id)]++); return c; }
function vDue(){ return VBANK.filter(v=>{ const r=(S.vocab||{})[v.id]; return r && r.n && r.due<=Date.now(); }).map(v=>v.id); }

/* text detection + links */
const V_ALIAS = []; VBANK.forEach(v=>(v.aliases||[v.term]).forEach(a=>{ if(a && !/['’]/.test(a)) V_ALIAS.push([a.toLowerCase(), v.id]); }));
V_ALIAS.sort((a,b)=>b[0].length-a[0].length);
const V_LINKCATS = new Set(["lr","rc","stem"]);
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
const V_LINK_RE = new RegExp("\\b(" + V_ALIAS.filter(([a,id])=>V_LINKCATS.has(VB[id].cat) && a.length>=4).map(([a])=>reEsc(a)).join("|") + ")\\b", "gi");
const V_ALIAS_MAP = {}; V_ALIAS.forEach(([a,id])=>{ if(!V_ALIAS_MAP[a]) V_ALIAS_MAP[a]=id; });
function linkify(escaped){ return escaped.replace(V_LINK_RE, m=>{ const id = V_ALIAS_MAP[m.toLowerCase()]; return id ? '<button type="button" class="vw" data-act="vcard" data-id="'+id+'">'+m+'</button>' : m; }); }
function mdl(t){ return String(t).split("```").map((part,i)=> i%2 ? "<pre>"+esc(part.trim())+"</pre>" : linkify(md(part))).join(""); }
function wordsIn(text, cats){ const found=[]; const low = " "+String(text).toLowerCase().replace(/[^a-z’' -]/g," ")+" ";
  V_ALIAS.forEach(([a,id])=>{ if((!cats || cats.includes(VB[id].cat)) && !found.includes(id) && low.includes(" "+a+" ")) found.push(id); }); return found; }

function vCardHTML(id, opts={}){
  const v = VB[id]; if(!v) return "";
  const st = vstatus(id);
  const row = (label, text) => text ? '<div class="vrow"><span class="mono">'+label+'</span><div>'+mdl(text)+'</div></div>' : "";
  return '<div class="vcard"><div class="row" style="justify-content:space-between;gap:8px"><h4>'+esc(v.term)+'</h4><span class="row" style="gap:6px"><span class="vpill v-'+st+'">'+VSTAT_LABEL[st]+'</span><button class="btn ghost" style="padding:2px 10px;font-size:.8rem" data-act="say" data-t="'+esc(v.term)+'">Hear it</button></span></div>'+
    (v.human && !opts.short ? '<div class="note accent" style="padding:10px 12px"><span class="mono">Start in real life</span><div>'+esc(v.human)+'</div></div>' : "")+
    row("Level 1 \u00b7 Kid-simple", v.kid||v.simple)+row("Level 2 \u00b7 Everyday", v.simple)+row(v.cat==="rc"?"Level 3 \u00b7 Dictionary":"Level 3 \u00b7 LSAT", v.lsat)+row(v.cat==="rc"?"Level 4 \u00b7 In an LSAT passage":"Level 4 \u00b7 On the exam", v.think)+
    (opts.short ? "" : (v.does?'<dl class="purpose"><dt>What does it do?</dt><dd>'+esc(v.does)+'</dd><dt>Why is it there?</dt><dd>'+esc(v.whyThere||"")+'</dd><dt>What does it connect to?</dt><dd>'+esc(v.connects||"")+'</dd></dl>':"")+row("Everyday example", v.easy)+row("LSAT-style example", v.lsatEx)+row("Common mistake", v.mistake))+row("Memory trick", v.trick)+'</div>';
}
function say(t){ try{ const u = new SpeechSynthesisUtterance(t); u.rate = .9; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){ toast("Your browser can’t read words aloud here."); } }
function openCard(id){ const w = $("#popwrap"); U.cardStack = (U.cardStack||[]).concat(id).slice(-6);
  w.innerHTML = '<div class="scrim" style="display:block" data-act="pop-close"></div><div class="pop vpop" role="dialog" aria-label="Word card">'+(U.cardStack.length>1?'<button class="btn ghost" data-act="card-back" style="align-self:flex-start;padding:2px 10px;font-size:.85rem">← Back</button>':"")+vCardHTML(id)+'<button class="btn" data-act="pop-close" style="align-self:flex-end">Close</button></div>';
  const r = vrec(id); r.seen = (r.seen||0)+1; }

/* ---------- drill question builders ---------- */
function distract(id, field, n){ const v=VB[id]; let ids = (v.confusers||[]).filter(c=>VB[c] && c!==id);
  const same = shuffle(VBANK.filter(x=>x.cat===v.cat && x.id!==id && !ids.includes(x.id)).map(x=>x.id)); ids = ids.concat(same);
  const out=[]; for(const c of ids){ const t = VB[c][field]; if(t && t!==v[field] && !out.some(o=>o.t===t)) out.push({t, from:c}); if(out.length>=n) break; } return out; }
function qDef(id){ const v=VB[id]; const opts = shuffle([{t:v.simple, from:id}].concat(distract(id,"simple",3)));
  return {type:"def", vid:id, prompt:"What does “"+v.term+"” mean?", opts:opts.map(o=>o.t), from:opts.map(o=>o.from), answer:opts.findIndex(o=>o.from===id)}; }
function qReverse(id){ const v=VB[id]; const o = shuffle([id].concat(distract(id,"term",3).map(x=>x.from)));
  return {type:"reverse", vid:id, prompt:"Which word means: “"+v.simple+"”", opts:o.map(x=>VB[x].term), from:o, answer:o.indexOf(id)}; }
function qContext(id){ const v=VB[id]; const opts = shuffle([{t:v.think, from:id}].concat(distract(id,"think",3)));
  const re = new RegExp("\\b("+(v.aliases||[v.term]).map(reEsc).join("|")+")\\b","i");
  return {type:"context", vid:id, focus: esc(v.lsatEx).replace(re, m=>"<mark>"+m+"</mark>"), prompt:"You see “"+v.term+"” in this sentence. What should you think?", opts:opts.map(o=>o.t), from:opts.map(o=>o.from), answer:opts.findIndex(o=>o.from===id)}; }
function qFlash(id){ const role = SIGNAL_ROLE[id]; if(!role) return qDef(id);
  const roles = shuffle([role].concat(shuffle(Object.keys(ROLE_LABEL).filter(r=>r!==role)).slice(0,3)));
  return {type:"flash", vid:id, big:VB[id].term.toUpperCase()+" = ?", prompt:"What should your brain think?", opts:roles.map(r=>ROLE_LABEL[r]), from:roles.map(()=>null), answer:roles.indexOf(role), speed:true}; }
function qAny(id, avoid){ const v=VB[id]; const types = [v.cat==="signal" && SIGNAL_ROLE[id] ? "flash" : "def", "context", "reverse"].filter(t=>t!==avoid);
  const t = types[Math.floor(Math.random()*types.length)]; return t==="flash"?qFlash(id):t==="context"?qContext(id):t==="reverse"?qReverse(id):qDef(id); }
function qStem(s){ return {type:"stemtap", stem:s, prompt:"Tap the word that tells you what to do.", vids:(s.vocab||[]).filter(x=>VB[x])}; }
function qTrans(t){ return {type:"trans", tr:t, focus:esc(t.lsat), prompt:"What is this saying in normal English?", opts:t.opts, answer:t.answer, vids:(t.words||[]).filter(x=>VB[x])}; }
function qPairTeach(p){ return {type:"pairteach", pair:p}; }
function qPairQ(p, q){ return {type:"pairq", pair:p, prompt:q.q, opts:q.opts, answer:q.answer, why:q.why, vids:(p.aIds||[]).concat(p.bIds||[]).filter(x=>VB[x])}; }

/* ---------- drill sessions ---------- */
function learnedIds(){ return VBANK.filter(v=>{ const s=vstatus(v.id); return s!=="new"; }).map(v=>v.id); }
function startDrill(kind){
  let items = [], title = "";
  if(kind==="warmup"){
    title = "Vocabulary warm-up";
    const due = vDue(); const learned = learnedIds();
    const pickW = shuffle(due.filter(id=>!["signal","stem"].includes(VB[id].cat))).concat(shuffle(learned.filter(id=>!["signal","stem"].includes(VB[id].cat))));
    let five = [...new Set(pickW)].slice(0,5);
    if(five.length<5){ const fresh = V_PRIORITY.filter(id=>vstatus(id)==="new" && !["signal","stem"].includes(VB[id].cat)).slice(0, 5-five.length); fresh.forEach(id=>items.push({type:"teach", vid:id})); five = five.concat(fresh); }
    five.forEach(id=>items.push(qAny(id)));
    const stems = (typeof VOCAB_STEMS!=="undefined"?VOCAB_STEMS:[]); shuffle(stems).slice(0,3).forEach(s=>items.push(qStem(s)));
    const sig = shuffle(Object.keys(SIGNAL_ROLE).filter(id=>VB[id])); const sigPick = sig.filter(id=>vstatus(id)!=="new").concat(sig).filter((x,i,a)=>a.indexOf(x)===i).slice(0,2); sigPick.forEach(id=>items.push(qFlash(id)));
    S.vwarm = today();
  } else if(kind==="learn"){
    title = "Learn new words";
    const fresh = V_PRIORITY.filter(id=>vstatus(id)==="new").slice(0,5);
    if(!fresh.length){ toast("You’ve seen every word in the bank. Use the warm-up and reviews."); return; }
    fresh.forEach((id,i)=>{ items.push({type:"teach", vid:id}); if(i>=1) items.push(qDef(fresh[i-1])); });
    items.push(qDef(fresh[fresh.length-1])); shuffle(fresh).forEach(id=>items.push(qAny(id,"def")));
  } else if(kind==="retest"){
    title = "Retest today’s tough words";
    const ids = (S.vmiss && S.vmiss.day===today()) ? S.vmiss.ids : []; if(!ids.length){ toast("No tough words today."); return; }
    ids.forEach(id=>items.push(qAny(id))); items = shuffle(items);
  } else if(kind==="speed"){
    title = "Speed round"; const pool = learnedIds(); if(pool.length<8){ toast("Learn at least 8 words first. Speed comes after understanding."); return; }
    shuffle(pool).slice(0,12).forEach(id=>{ const q = SIGNAL_ROLE[id] ? qFlash(id) : qDef(id); q.speed = true; items.push(q); });
  } else if(kind==="pairs"){
    title = "Confusing pairs"; const P = (typeof VOCAB_PAIRS!=="undefined"?VOCAB_PAIRS:[]); S.vpairs = S.vpairs||{};
    const p = P.slice().sort((a,b)=>(S.vpairs[a.id]||0)-(S.vpairs[b.id]||0))[0]; if(!p) return; S.vpairs[p.id]=(S.vpairs[p.id]||0)+1;
    items.push(qPairTeach(p)); p.questions.forEach(q=>items.push(qPairQ(p,q))); title += ": " + p.a + " vs. " + p.b;
  } else if(kind==="translate"){
    title = "Translate LSAT language"; const T2 = (typeof VOCAB_TRANSLATE!=="undefined"?VOCAB_TRANSLATE:[]); S.vtrans = S.vtrans||{};
    T2.map((t,i)=>[t,i]).sort((a,b)=>(S.vtrans[a[1]]||0)-(S.vtrans[b[1]]||0)).slice(0,6).forEach(([t,i])=>{ S.vtrans[i]=(S.vtrans[i]||0)+1; items.push(qTrans(t)); });
  } else if(kind==="stems"){
    title = "Word of the question"; shuffle(typeof VOCAB_STEMS!=="undefined"?VOCAB_STEMS:[]).slice(0,6).forEach(s=>items.push(qStem(s)));
  } else if(kind==="n2l"){ title = "Normal \u2194 LSAT"; items = n2lItems();
  } else if(kind==="harder"){ title = "Same logic, harder words"; items = harderItems();
  } else if(kind==="sight"){
    title = "Sight-word drill: conclusion signposts";
    const ids = shuffle(SIGNPOSTS_C.map(s=>s.id).filter(id=>VB[id])).slice(0,8).concat(["because","since","however","for-example"].filter(id=>VB[id]));
    shuffle(ids).forEach(id=>{ const q = qFlash(id); q.speed = true; items.push(q); });
  }
  U.vd = {kind, title, items, i:0, chosen:null, answered:false, t0:Date.now(), res:[]};
  U.view = "drill"; render(); window.scrollTo({top:0});
}
function drillCur(){ return U.vd && U.vd.items[U.vd.i]; }
function drillAnswer(choice){
  const d = U.vd, q = drillCur(); if(!q || d.answered) return;
  const ms = Date.now()-d.t0; d.answered = true; d.chosen = choice; d.ms = ms;
  let ok;

    const score = xs.length ? xs.filter(l=>l.ok).length/xs.length : 0;
    out[sk.id] = {n:xs.length, score, solid: xs.length>=4 && score>=.8, total: st.log.filter(l=>l.skill===sk.id && !l.exam).length};
  });
  const prac = st.log.filter(l=>!l.exam);
  const last20 = prac.filter(l=>!l.assisted).slice(-20);
  out._exposures = prac.length;

  out._last20n = last20.length;

/* ---------- adaptive sets of 5 ---------- */
function pickItem(skill, exclude){
  const st = s1(); const cands = S1_ITEMS.filter(it=>it.skill===skill && !exclude.includes(it.uid));
  if(!cands.length) return null;
  const unseen = cands.filter(it=>!st.seen[it.uid]).sort((a,b)=>a.level-b.level);
  if(unseen.length){ const lvl = unseen[0].level; const same = unseen.filter(it=>it.level===lvl); return same[Math.floor(Math.random()*same.length)].uid; }
  const missed = cands.filter(it=>st.seen[it.uid] && st.seen[it.uid].lastOk===false);
  if(missed.length) return missed[0].uid;
  return cands.sort((a,b)=>(st.seen[a.uid].at||0)-(st.seen[b.uid].at||0))[0].uid;
}
function makeSet(focus){
  const st = s1(); const avail = availSkills(); if(!avail.length) return null;
  const ss = s1Stats(); const lastLesson = S1_LESSONS.filter(l=>st.lessons[l.id] && l.skills.some(s=>s!=="define")).pop();
  const frontier = focus ? [focus] : (lastLesson ? lastLesson.skills.filter(s=>s!=="define") : [avail[avail.length-1]]);
  const weak = avail.filter(sk=>ss[sk].n>=2 && ss[sk].score<.8).sort((a,b)=>ss[a].score-ss[b].score);
  let plan = [];
  if(focus) plan = [focus,focus,focus,focus].concat(shuffle(avail.filter(s=>s!==focus)).slice(0,1));
  else if(weak.length) plan = [weak[0], weak[0], weak[1]||weak[0], frontier[0], shuffle(avail)[0]];
  else { const fr = frontier.filter(s=>!ss[s].solid); plan = fr.length ? [fr[0], fr[0], fr[fr.length-1], shuffle(avail)[0], shuffle(avail)[0]] : shuffle(avail.concat(avail)).slice(0,5); }
  if(!focus && frontier.length>1) plan[2] = frontier[1];
  const items = []; plan.forEach(sk=>{ const u = pickItem(sk, items) || pickItem(shuffle(avail)[0], items); if(u) items.push(u); });
  st.set = {items, i:0, res:[], sel:null, answered:false, t0:Date.now(), plan, focus:focus||null, assisted:{}}; st.sets = (st.sets||0)+1;
  save(); return st.set;
}

  let items = take([1],10).concat(take([2],15)).concat(take([3],15)).concat(take([4],10));
  if(items.length<50){ const extra = shuffle(EXAM_POOL.filter(it=>!items.includes(it.uid))).slice(0,50-items.length).map(it=>it.uid); items = items.concat(extra); }
  st.exam = {items, i:0, ans:{}, t:{}, started:Date.now(), done:false, sel:null}; st.examUsed = [...used];
  save();
}
function gradeExam(){
  const st = s1(); const ex = st.exam; let ok=0, diff=0, diffOk=0; const byLevel={}; const traps={};
  ex.items.forEach(u=>{ const it = S1_BY[u]; const a = ex.ans[u]; const right = a!==undefined && it.sents[a] && it.sents[a].role==="conclusion"; if(right) ok++;
    byLevel[it.level] = byLevel[it.level]||{n:0,ok:0}; byLevel[it.level].n++; if(right) byLevel[it.level].ok++;
    if(it.level>=4){ diff++; if(right) diffOk++; }
    if(!right && a!==undefined){ const tk = trapFor(it, a); traps[tk]=(traps[tk]||0)+1; } });
  const pct = ok/ex.items.length; const passed = pct>=.9 && (diff? diffOk/diff>=.8 : true);
  ex.done = true; ex.score = ok; ex.pct = pct; ex.diff = diff; ex.diffOk = diffOk; ex.byLevel = byLevel; ex.traps = traps; ex.passed = passed; ex.finished = Date.now();
  st.exams.push({at:Date.now(), score:ok, n:ex.items.length, passed, diffOk, diff});
  if(passed){ st.retention = {due: Date.now()+12*3600e3, passed:false}; addXP(100, "Mastery exam passed"); }
  else { st.remedSets = 0; }
  touchDay(); save();
}
function makeRetention(){
  const st = s1(); const used = new Set(st.examUsed||[]);
  const pool = shuffle(EXAM_POOL.filter(it=>!used.has(it.uid))); let items = [1,2,3,4].flatMap(l=>pool.filter(it=>it.level===l).slice(0, l>=3?3:2)).map(it=>it.uid).slice(0,10);
  if(items.length<10) items = items.concat(shuffle(S1_ITEMS.filter(it=>it.kind==="tap")).slice(0,10-items.length).map(it=>it.uid));

/* ---------- mistakes ---------- */
function trapFor(it, chosen){
  if(it.kind!=="tap") return "concept";
  if(it.task==="reason") return it.sents[chosen] && it.sents[chosen].role==="conclusion" ? "reasonpoint" : "concept";
  const s = it.sents[chosen]; const ci = it.sents.findIndex(x=>x.role==="conclusion");
  if(s.role==="background") return "background"; if(s.role==="opposing") return "opposing"; if(s.role==="middle") return "middle";
  if(chosen===it.sents.length-1 && ci!==chosen) return "last";
  if(wordsIn(s.t,["signal"]).some(w=>["because","since","for-example","moreover"].includes(w))) return "signal";
  if(/\d|study|survey|record|percent|research|data|found/i.test(s.t)) return "fact";
  return "important";
}
const ERR_CAT = {last:"Failure to identify the conclusion", fact:"Attractive wrong answer", signal:"Vocabulary misunderstanding", important:"Attractive wrong answer", background:"Failure to identify the conclusion", opposing:"Misreading the question", middle:"Failure to identify the conclusion", concept:"Vocabulary misunderstanding"};
function mistakePanel(it, chosen){
  if(it.vid && VB[it.vid]){ const v = VB[it.vid]; const o = U.s1opts && U.s1opts.uid===it.uid ? U.s1opts : null; const pickedTxt = o ? o.opts[chosen] : ""; const fromId = o && o.from ? o.from[chosen] : null; const cf = fromId && VB[fromId] && fromId!==it.vid ? VB[fromId] : null;
    const rows = [["1 \u00b7 What you thought","You picked: \u201c"+pickedTxt+"\u201d"+(cf?" That\u2019s the meaning of \u201c"+cf.term+"\u201d.":"")],["2 \u00b7 Why that made sense", cf?"\u201c"+v.term+"\u201d and \u201c"+cf.term+"\u201d show up in similar places, so they\u2019re easy to mix up.":"It sounds close to the right idea."],["3 \u00b7 Where it went wrong", v.mistake],["4 \u00b7 The word","\u201c"+v.term+"\u201d"],["5 \u00b7 The correct meaning","**Simple:** "+v.simple+"\n**LSAT:** "+v.lsat+"\n**Think:** "+(SIGNAL_ROLE[it.vid]?ROLE_LABEL[SIGNAL_ROLE[it.vid]]+". "+v.think:v.think)],["6 \u00b7 Very easy example", v.easy],["7 \u00b7 LSAT example", v.lsatEx],["8 \u00b7 Memory trick", v.trick],["9 \u00b7 Mini question","Another question on this idea is coming up next."]];
    return {tk:"concept", vids:[it.vid], html:'<div class="note bad"><h4>Before we continue, let\u2019s fix this word.</h4><span class="muted">Vocabulary misunderstanding</span></div><div class="breakdown9">'+rows.map(([l,t])=>'<div class="vrow"><span class="mono">'+l+'</span><div>'+mdl(t)+'</div></div>').join("")+'</div>'}; }
  let tk = trapFor(it, chosen); const T = TRAPS_C[tk];
  let thought, correct, vids = [];
  if(it.kind==="tap" && it.task==="reason"){ thought = "You picked \u201c"+it.sents[chosen].t+"\u201d as the reason."; correct = "The reason is \u201c"+it.sents.find(s=>s.role==="premise").t+"\u201d. "+(it.why||""); vids = []; }
  else if(it.kind==="tap"){ thought = "You picked \u201c"+it.sents[chosen].t+"\u201d as the point."; correct = "The "+(it.task==="main"?"main ":"")+"conclusion is \u201c"+it.sents.find(s=>s.role==="conclusion").t+"\u201d. "+itemWhy(it);
    vids = wordsIn(it.sents.map(s=>s.t).join(" "), ["signal"]); }
  else if(it.kind==="mcq"){ const q = Q(it.qid); const c = q.choices.find(x=>x.l===q.answer), m = q.choices.find(x=>x.l===chosen); thought = "You picked "+m.l+": “"+m.t+"”"; correct = q.answer+": "+c.why; tk = "concept"; vids = wordsIn(q.stem+" "+m.t,["strength","lr"]); }
  else { const opts = it.opts || (U.s1opts && U.s1opts.opts) || []; thought = "You picked “"+(opts[chosen]||"")+"”"; correct = it.why || (it.vid ? VB[it.vid].simple : ""); vids = it.vid?[it.vid]:(it.vids||[]); }
  const rows = [
    ["1 · What you thought", thought],
    ["2 · Why that made sense", T.made],
    ["3 · Where it went wrong", T.wrong],
    ["4 · Words that mattered", vids.length ? vids.map(id=>"**"+VB[id].term+"**: "+(SIGNAL_ROLE[id]?ROLE_LABEL[SIGNAL_ROLE[id]]:VB[id].simple)).join("\n") : "No tricky words in this one. The issue was the logic, not the vocabulary."],
    ["5 · The right answer", correct],
    ["6 · Very easy example", T.easy], ["7 · LSAT example", T.lsat], ["8 · Memory trick", T.trick],
    ["9 · Mini question", "Another question testing this same idea is coming up next."]
  ];
  return {tk, html:'<div class="note bad"><h4>'+esc(T.name)+'</h4><span class="muted">'+esc(ERR_CAT[tk]||"")+'</span></div><div class="breakdown9">'+rows.map(([l,t])=>'<div class="vrow"><span class="mono">'+l+'</span><div>'+mdl(t)+'</div></div>').join("")+'</div>', vids};
}

/* ---------- answering ---------- */
function s1Answer(choice){
  const st = s1(); const set = st.set; if(!set || set.answered) return;
  const it = S1_BY[set.items[set.i]]; const ms = Date.now()-set.t0;
  let ok;
  if(it.kind==="tap") ok = it.sents[choice] && it.sents[choice].role===(it.task==="reason"?"premise":"conclusion");
  else if(it.kind==="mcq") ok = choice===Q(it.qid).answer;
  else if(it.kind==="flash"||it.kind==="vdef"||it.kind==="vctx") ok = choice===U.s1opts.answer;
  else ok = choice===it.answer;
  set.answered = true; set.sel = choice; set.ok = ok; set.ms = ms;
  const assisted = !!set.assisted[it.uid];
  st.log.push({uid:it.uid, skill:it.skill, ok, ms, assisted, at:Date.now(), day:today()}); if(st.log.length>1500) st.log = st.log.slice(-1500);
  st.seen[it.uid] = {n:((st.seen[it.uid]||{}).n||0)+1, lastOk:ok, at:Date.now()};
  set.res.push({uid:it.uid, skill:it.skill, ok, assisted});
  if(it.vid) vRecord(it.vid, ok, it.kind==="flash"?"flash":it.kind==="vctx"?"context":"def", ms);
  (it.vids||[]).forEach(v=>vRecord(v, ok, "context", ms));
  const prevAttempts = (st.seen[it.uid].n||1)-1;
  record({qid:it.uid, kind:"stone", correct:ok, firstTry:true, choice:String(choice), trap: ok?null:(TRAPS_C[trapFor(it,choice)]||{}).name, timeMs:ms, changed:0});
  if(ok) addXP(assisted?3:8);
  else {
    const mp = mistakePanel(it, choice);
    if(it.kind==="tap"){ const chosenWords = wordsIn(it.sents[choice].t,["signal"]).filter(w=>["because","since","for-example","moreover"].includes(w)); chosenWords.forEach(w=>vRecord(w,false,"context",ms)); }
    S.journal.push({kind:"s1", uid:it.uid, at:Date.now(), mine:choice, trap:TRAPS_C[mp.tk].name, cat:ERR_CAT[mp.tk], skill:it.skill, level:it.level, ms, assisted, attempts:prevAttempts});
    const mini = pickItem(it.skill, set.items); if(mini) set.items.splice(set.i+1, 0, mini);
  }
  save(); render();
}

    return '<details class="exmiss"><summary>'+esc(LVL_NAME[it.level])+' · '+esc(TRAPS_C[mp.tk].name)+'</summary><div class="stack" style="gap:10px;padding-top:10px">'+itemBody(it, a, true, "review")+mp.html.replace("Another question testing this same idea is coming up next.","Targeted practice will cover this idea.")+'</div></details>'; }).join("")+'</section>';
  return h + '</div>';
}
function vRetention(){
  const st = s1(); const r = st.retention; if(!r || !r.run){ U.view="lesson"; return vStairs(); }
  const run = r.run;
  if(run.done){ const ok = run.items.filter(u=>{ const it=S1_BY[u]; return it.sents[run.ans[u]] && it.sents[run.ans[u]].role==="conclusion"; }).length;
    return '<div class="stack"><section class="panel stack"><span class="mono">Retention check</span><h1>'+ok+' of '+run.items.length+'</h1><p class="lead">'+(r.passed?"It stuck. Step 1 is mastered.":"Close, but it hasn’t fully stuck yet. Do two targeted sets, and a fresh retention check unlocks 12 hours later.")+'</p><div class="row"><button class="btn primary" data-act="s1-home">Back to Step 1</button></div></section></div>'; }
  const uid = run.items[run.i]; const it = S1_BY[uid];
  return '<div class="stack"><section class="panel stack" style="gap:6px"><span class="mono">Retention check · '+(run.i+1)+' of '+run.items.length+'</span><p class="muted">New questions you haven’t seen. No help until the end.</p></section><section class="panel stack">'+itemBody(it, run.sel, false, "ret")+'<div class="row"><button class="btn primary" data-act="ret-next"'+(run.sel===null||run.sel===undefined?" disabled":"")+'>'+(run.i===run.items.length-1?"Finish":"Next")+'</button></div></section></div>';
}

/* ---------- staircase + Step 1 home ---------- */

    const locked = !(s.n===1 || (s.n===2 && st.mastered));
    const status = done ? "Mastered" : s.n===1 ? ({learning:"Learning","exam-ready":"Ready for mastery exam",exam:"Mastery exam in progress","retention-wait":"Retention check pending","retention-due":"Retention check ready"}[phase]||"Learning") : (s.n===2 && st.mastered ? "Unlocked: being built" : "Locked");
    return '<div class="stair '+(done?"done":active?"active":"locked")+'" style="--n:'+s.n+'"><span class="mono">Step '+s.n+'</span><strong>'+esc(s.name)+'</strong>'+(s.note?'<span class="muted" style="font-size:.82rem">'+esc(s.note)+'</span>':"")+'<span class="stair-status">'+(locked?"🔒 ":"")+status+'</span></div>'; }).join("")+'</section>';
  // mastery panel
  h += '<section class="panel stack"><div class="row" style="justify-content:space-between"><h2>Conclusion mastery</h2><span class="verdict v-'+(st.mastered?"go":ss._overall>=70?"close":"build")+'">'+(st.mastered?"Mastered":"Overall "+ss._overall+"%")+'</span></div>'+
    '<div class="skilltable">'+S1_SKILLS.map(sk=>{ const v = ss[sk.id]; const pct = sk.id==="define" ? (v.solid?"✓":"—") : (v.n? Math.round(v.score*100)+"%":"—"); return '<div class="skrow'+(v.solid?" solid":"")+'"><span>'+esc(sk.label)+'</span><div class="skbar"><i style="width:'+(sk.id==="define"?(v.solid?100:0):Math.round(v.score*100))+'%"></i></div><span class="tnum">'+pct+'</span></div>'; }).join("")+'</div>'+
    '<p class="muted" style="font-size:.9rem">Each skill shows your last 6 unassisted answers. It counts as solid at 80%+ over at least 4. Practice so far: '+ss._exposures+' questions (40 minimum). Last 20: '+(ss._last20n?Math.round(ss._last20*100)+"%":"—")+' (85% needed).</p></section>';
  // next action

  // lessons
  h += '<section class="panel stack"><h3>Lessons</h3><div class="lessonlist">'+S1_LESSONS.map((l,i)=>{ const un = lessonUnlocked(i); const done = st.lessons[l.id]; const gate = !un && i>0 && st.lessons[S1_LESSONS[i-1].id] ? lessonGate(i) : null;
    return '<div class="lessonrow'+(done?" done":"")+(un?"":" locked")+'"><span class="mono">'+String(i+1).padStart(2,"0")+'</span><div><strong>'+esc(l.title)+'</strong><br><span class="muted" style="font-size:.85rem">'+(done?"Done":un?"About "+l.minutes+" min":gate&&gate.length?"Unlocks when you’re solid on: "+gate.join(", "):"🔒 Finish the lesson before it")+'</span></div>'+(un?'<button class="btn'+(done?"":" primary")+'" data-act="s1-lesson" data-id="'+l.id+'">'+(done?"Review":"Start")+'</button>':'<span></span>')+'</div>'; }).join("")+'</div></section>';
  // exam history
  if(st.exams.length) h += '<section class="panel stack"><h3>Exam history</h3><div class="tblwrap"><table class="cal"><tr><th>Date</th><th class="n">Score</th><th class="n">Difficult</th><th>Result</th></tr>'+st.exams.slice().reverse().map(e=>'<tr><td>'+new Date(e.at).toLocaleDateString()+'</td><td class="n">'+e.score+'/'+e.n+'</td><td class="n">'+e.diffOk+'/'+e.diff+'</td><td>'+(e.passed?"Passed":"Not yet")+'</td></tr>').join("")+'</table></div></section>';

function nextActionHTML(phase, ss){
  const st = s1();
  if(phase==="mastered") return '<h3>Step 1 mastered 🏆 Conclusion Master</h3><p>Conclusions will keep showing up in your reviews so you never lose this. Step 2 (Premise) is unlocked. Ask Claude in your chat to build it next.</p><div><button class="btn" data-act="s1-set">Keep a conclusion set going</button></div>';
  if(phase==="retention-due") return '<h3>Retention check ready</h3><p>10 new questions, no help. You need 9 to master Step 1.</p><div><button class="btn primary" data-act="s1-ret">Start retention check</button></div>';
  if(phase==="retention-wait"){ const r = st.retention; const left = r ? Math.max(0, r.due-Date.now()) : 0; return '<h3>Retention check '+(r&&r.run&&r.run.done&&!r.passed?"after more practice":"later")+'</h3><p>It unlocks in about '+Math.ceil(left/36e5)+' hour'+(Math.ceil(left/36e5)===1?"":"s")+'. That gap is the point: it checks you remember, not just that it’s fresh. Keep your vocabulary warm in the meantime.</p><div class="row"><button class="btn" data-act="s1-set">Practice set</button><button class="btn ghost" data-act="nav" data-v="words">Vocabulary</button></div>'; }
  if(phase==="exam") return '<h3>Mastery exam in progress</h3><p>Question '+(st.exam.i+1)+' of '+st.exam.items.length+'.</p><div><button class="btn primary" data-act="s1-exam-resume">Resume exam</button></div>';
  if(phase==="exam-ready"){ const last = st.exams[st.exams.length-1]; const blocked = last && !last.passed && (st.remedSets||0)<2;
    return blocked ? '<h3>Targeted practice first</h3><p>'+(2-(st.remedSets||0))+' more targeted set'+(2-(st.remedSets||0)===1?"":"s")+' before a new exam unlocks.</p><div><button class="btn primary" data-act="s1-remed">Targeted set</button></div>' :
      '<h3>You’re ready for the mastery exam</h3><p>50 new questions: 10 beginner, 15 intermediate, 15 advanced, 10 difficult. Pass with 90% overall and 80% on the difficult ones. No help during the exam.</p><div class="row"><button class="btn primary" data-act="s1-exam">Start the exam</button><button class="btn" data-act="s1-set">One more practice set first</button></div>'; }
  const nextL = S1_LESSONS.findIndex(l=>!st.lessons[l.id]);
  const avail = availSkills();
  if(nextL>=0 && lessonUnlocked(nextL)) return '<h3>Next: '+esc(S1_LESSONS[nextL].title)+'</h3><p>'+(nextL===0?"Start here. We begin with the word itself.":"You’re solid on what came before, so the next lesson is open.")+'</p><div class="row"><button class="btn primary" data-act="s1-lesson" data-id="'+S1_LESSONS[nextL].id+'">Start lesson</button>'+(avail.length?'<button class="btn" data-act="s1-set">Practice set</button>':"")+'</div>';
  if(nextL>=0) return '<h3>Practice to unlock the next lesson</h3><p>Next lesson needs: '+lessonGate(nextL).join(", ")+' (4+ answers at 75%+).</p><div><button class="btn primary" data-act="s1-set">Practice set of 5</button></div>';
  const missing = S1_SKILLS.filter(sk=>!ss[sk.id].solid).map(sk=>sk.label);
  return '<h3>Build to mastery</h3><p>'+(missing.length?"Still building: "+missing.join(", ")+".":"")+' '+(ss._exposures<40?"At least "+(40-ss._exposures)+" more practice questions before the exam.":"")+'</p><div class="row"><button class="btn primary" data-act="s1-set">Practice set of 5</button>'+(!ss.define.solid?'<button class="btn" data-act="s1-lesson" data-id="own">Say it in your own words</button>':"")+'</div>';
}

/* ---------- Step 1 mini-lessons ---------- */
const hl = (ev, sig, con) => '<div class="ebd"><div><span class="mono">Evidence</span>'+esc(ev)+'</div><div><span class="mono">Signal</span><strong>'+esc(sig)+'</strong></div><div class="con"><span class="mono">Conclusion</span>'+esc(con)+'</div></div>';
const argBox = (sents) => '<div class="stim">'+sents.map(([t,c])=>c?'<span class="s r-conclusion">'+esc(t)+'</span><span class="tag">Conclusion</span>':esc(t)).join(" ")+'</div>';
const sec = (title, body) => '<section class="panel stack"><h2>'+title+'</h2>'+body+'</section>';
const defRow = (label, text, sub) => '<div class="term"><dt>'+label+'</dt><dd>'+linkify(esc(text))+(sub?'<div class="muted" style="font-style:normal;font-family:var(--f-ui);font-size:.92rem;margin-top:4px">'+linkify(esc(sub))+'</div>':"")+'</dd></div>';

function vS1Lesson(id){

  h += (LESSON_BODY[id]||(()=>""))();
  const skills = L.skills.filter(s=>s!=="define");
  if(id!=="own") h += '<section class="panel stack"><div class="row" style="justify-content:space-between"><div><strong>'+(skills.length?"Ready to practice this?":"Got it?")+'</strong><br><span class="muted">'+(skills.length?"A set of 5 built around what you just learned. You need 4+ answers at 75%+ to unlock the next lesson.":"This one is about understanding. The next lesson opens right away.")+'</span></div><button class="btn primary" data-act="s1-lessondone" data-id="'+id+'">'+(skills.length?"Practice now":"Mark as done")+'</button></div></section>';

}

const LESSON_BODY = {
  word: ()=> sec("The word: CONCLUSION", '<div class="row"><span class="bigword">Conclusion</span><button class="btn ghost" data-act="say" data-t="conclusion">Hear it</button><span class="muted">con-CLOO-zhun</span></div><dl style="margin:0">'+
      defRow("Normal definition","The end of something. Or: a decision you reach after thinking it through.","“We came to the conclusion that the old car wasn’t worth fixing.”")+
      defRow("Layman’s definition","What the person wants you to believe.","Or: the point they’re trying to prove.")+
      defRow("LSAT definition","The claim that an argument’s evidence is intended to support.","Back into normal English: the thing all the reasons are there to back up.")+'</dl>')+
    sec("Every word in that definition", '<p>Never learn a hard word with other hard words. Here is each piece of the LSAT definition. Tap any underlined word anywhere in the app for its full card.</p><div class="minicards">'+["claim","argument","evidence","support","author"].map(id=>'<button class="minicard" data-act="vcard" data-id="'+id+'"><strong>'+esc(VB[id].term)+'</strong><span>'+esc(VB[id].simple)+'</span></button>').join("")+'<div class="minicard"><strong>intended</strong><span>Meant to. The evidence is meant to back up the conclusion. It might fail, but that’s its job.</span></div></div>')+
    sec("Method A · Everyday language", '<p class="explain">When people talk, sometimes they’re just telling you things. Other times they’re trying to change your mind. When they’re trying to change your mind, the conclusion is the thing they want you to end up thinking.</p>')+
    sec("Method B · LSAT terminology", '<p class="explain">An <strong>argument</strong> is a set of statements. One statement, the <strong>conclusion</strong>, is the claim the other statements (the <strong>evidence</strong>) are meant to support.</p>')+
    sec("Method C · Real-life examples", '<div class="stack" style="gap:10px"><span class="mono">At work</span>'+argBox([["Our biggest client has called twice about the late report.",0],["We should finish it today.",1]])+'<span class="mono">At home</span>'+argBox([["The milk smells sour and it expired Monday.",0],["We need to throw it out.",1]])+'<span class="mono">Shopping</span>'+argBox([["This jacket is half price and it’s exactly my size.",0],["I’m buying it.",1]])+'</div>')+
    sec("Method D · LSAT-style example", argBox([["Biologist: Coral reefs that lose more than half their algae rarely recover.",0],["The reef off Point Hara has lost seventy percent of its algae.",0],["Therefore, the Point Hara reef is unlikely to recover.",1]]))+
    sec("Method E · Visual breakdown", '<div class="diagram"><div class="drow"><div class="dbox ev"><span class="mono">Evidence</span>Reefs that lose half their algae rarely recover.</div><div class="dbox ev"><span class="mono">Evidence</span>Point Hara lost 70%.</div></div><div class="darrow">↓</div><div class="drow"><div class="dbox con"><span class="mono">Conclusion</span>Point Hara is unlikely to recover.</div></div></div><p class="muted">The evidence points down into the conclusion. The conclusion is where the arrows land.</p>'),

  job: ()=> sec("A conclusion’s job", '<p class="explain">Its job is to be the point. It’s whatever the speaker or author is trying to establish, nothing more.</p>')+
    sec("Three things a conclusion is NOT automatically", '<div class="stack" style="gap:12px"><div class="note"><h4>1. Not automatically the last sentence</h4>“We should leave now. Traffic doubles after five.” The point comes first.</div><div class="note"><h4>2. Not necessarily a fact</h4>Conclusions are usually judgments, recommendations or predictions: “We should…”, “It will…”, “This is the best…”</div><div class="note"><h4>3. Not necessarily correct</h4>“My cat knocked over my coffee, so all cats are evil.” Terrible argument. “All cats are evil” is still its conclusion. Finding the conclusion doesn’t mean agreeing with it.</div></div>')+
    sec("The three questions to ask", '<ol class="prose" style="padding-left:20px"><li>“What is this person trying to convince me of?”</li><li>“What is their point?”</li><li>“If I had to sum up what they want me to believe in one sentence, what would it be?”</li></ol><p class="muted">Ask these before you look at any answer choices, every time.</p>'),

  signposts: ()=> sec("Signpost words", '<p class="explain">Some words are road signs. When you see one, your brain should flash: <span class="alarm">POSSIBLE CONCLUSION</span>. Like sight words when you learned to read, the goal is to know them instantly, without thinking.</p><p>They’re clues, not guarantees. You’ll learn the exceptions two lessons from now. First, learn the signs.</p>')+
    '<section class="panel stack"><h2>The conclusion signposts</h2><div class="spgrid">'+SIGNPOSTS_C.map(s=>'<article class="spcard"><div class="row" style="justify-content:space-between"><h3>'+esc(s.w)+'</h3><button class="btn ghost" style="padding:2px 8px;font-size:.78rem" data-act="say" data-t="'+esc(s.w)+'">Hear it</button></div><dl class="sp"><dt>Normal meaning</dt><dd>'+esc(s.normal)+'</dd><dt>LSAT meaning</dt><dd>'+esc(s.lsat)+'</dd><dt>In plain words</dt><dd>“'+esc(s.layman)+'”</dd></dl>'+hl(s.ev, s.w, s.con.charAt(0).toUpperCase()+s.con.slice(1))+'</article>').join("")+'</div></section>'+
    sec("Sight-word drill", '<p>Flash cards: a word appears, you pick what it signals, as fast as you can. A few non-conclusion words are mixed in so you learn the difference.</p><div><button class="btn primary" data-act="drill" data-k="sight">Start sight-word drill</button></div>'),

  methods: ()=> { const i = U.s1m||0; const M = [
      ["The “What’s your point?” test","Ask: “What is this person trying to convince me of?”", "“The kids skipped lunch and they’re cranky. They need a snack.”", "What do they want you to believe? That the kids need a snack."],
      ["The Why test","Point at a sentence. Ask “Why should I believe this?” If another sentence answers, the one you pointed at is the conclusion.", "“The heater is broken. The house is freezing. We should call a repair service.”", "Why should we call a repair service? Because the heater is broken and the house is freezing. The others answer, so that’s the conclusion."],
      ["The Therefore test","Put “therefore” between two sentences: reason, therefore, conclusion. If it sounds right one way and wrong the other, you know which is the conclusion.", "“The store closes at nine.” / “We need to leave by eight-thirty.”", "“The store closes at nine, therefore we need to leave by eight-thirty” sounds right. Flipped, it sounds wrong. So “leave by eight-thirty” is the conclusion."],
      ["The Remove-it test","Cover a sentence. If the rest becomes reasons with nothing to prove, the sentence you covered was the conclusion.", "“This phone has a cracked screen. Its battery dies by noon. You shouldn’t buy it.”", "Cover “You shouldn’t buy it.” Now it’s just complaints about a phone, with no point. So that was the conclusion."],
      ["The Author’s position test","Ask: “What does the AUTHOR believe?” Not what others think, not scene-setting. The author’s own view.", "“My roommate says we need cable. We only ever watch streaming. We don’t need cable.”", "The roommate’s view isn’t the author’s. The author believes “We don’t need cable.”"]
    ];
    const m = M[i];
    return sec("Five ways to find a conclusion", '<p>One at a time. Read the method, try it on the example, then reveal.</p><div class="methodnav">'+M.map((x,k)=>'<button class="chip" data-act="s1-method" data-i="'+k+'" aria-pressed="'+(k===i)+'">'+(k+1)+'. '+esc(x[0].replace("The ",""))+'</button>').join("")+'</div>')+
      '<section class="panel stack"><span class="mono">Method '+(i+1)+' of 5</span><h2>'+esc(m[0])+'</h2><p class="explain">'+esc(m[1])+'</p><div class="stim">'+esc(m[2])+'</div>'+(U.s1mReveal===i?'<div class="note good">'+esc(m[3])+'</div><div class="row">'+(i<4?'<button class="btn primary" data-act="s1-method" data-i="'+(i+1)+'">Next method</button>':'<span class="muted">That’s all five. When there’s no signpost, use these.</span>')+'</div>':'<div><button class="btn" data-act="s1-mreveal" data-i="'+i+'">Try it, then reveal</button></div>')+'</section>'; },

  clues: ()=> sec("Signposts are clues, not guarantees", '<p class="explain">Now that you know the basics, here’s where the LSAT gets sneaky.</p>')+
    sec("The conclusion can be anywhere", '<span class="mono">First</span>'+argBox([["Don’t buy that couch.",1],["It’s too wide for our front door.",0]])+'<span class="mono">Middle</span>'+argBox([["The new phone has the same camera as my old one.",0],["Upgrading would be a waste of money.",1],["My old phone still works perfectly.",0]])+'<span class="mono">Last</span>'+argBox([["Concert tickets sell out by June.",0],["We should buy ours this week.",1]]))+
    sec("No signpost at all", '<p>Then look for <strong>judgment words</strong>. Conclusions are usually opinions, recommendations or predictions:</p><div class="chips">'+["should","must","need to","ought to","is best","is mistaken","is wrong","will","probably","likely","it would be unwise"].map(w=>'<span class="chip">'+w+'</span>').join("")+'</div>'+argBox([["The baby is crying and rubbing her eyes.",0],["She probably needs a nap.",1]]))+
    sec("When “so” doesn’t mark the MAIN point", '<div class="stim">The bridge is closed, <strong>so</strong> the bus will be late. We should leave early.</div><p>“So” introduces “the bus will be late,” which is a conclusion from the bridge closing. But it’s used to support “We should leave early.” That’s the main point. You’ll study this properly in the Main Conclusion lesson.</p>'),

  translate: ()=> sec("Translate the conclusion", '<p class="explain">LSAT conclusions are often written in stiff, formal language. If you can say it in normal English, you understand it.</p><ol class="prose" style="padding-left:20px"><li><strong>Drop the signpost.</strong> “Therefore,” “it follows that,” “we can conclude that.”</li><li><strong>Swap each big word</strong> for an everyday word.</li><li><strong>Say it like a text to a friend.</strong></li></ol>')+
    sec("Worked examples", ['“It follows that the renovation is unlikely to be completed on schedule.”|The remodel probably won’t finish on time.|“Unlikely” = probably not. “On schedule” = on time.','“Consequently, the board’s decision to raise fees was unwarranted.”|So the board shouldn’t have raised fees.|“Unwarranted” = not justified, no good reason.','“The evidence therefore suggests that the drug’s benefits have been overstated.”|So the medicine probably doesn’t help as much as people said.|“Overstated” = made bigger than it really is.'].map(x=>{ const [a,b,c]=x.split("|"); return '<div class="translate"><div class="from">'+esc(a)+'</div><div class="arrow">→</div><div class="to">'+esc(b)+'</div></div><p class="muted" style="font-size:.9rem">'+esc(c)+'</p>'; }).join("")+'<p>Watch the strength words. “Probably won’t” is not “won’t.” A translation that’s stronger or weaker than the original is wrong.</p>'),

  main: ()=> sec("The main conclusion", '<dl style="margin:0">'+defRow("Normal definition","The most important point.")+defRow("Layman’s definition","The big point everything else is building toward.")+defRow("LSAT definition","The claim that the rest of the argument, including any smaller conclusions, is ultimately meant to support.","Normal English: the final point. Everything else is there to help prove it.")+'</dl>')+
    sec("A supported statement vs. THE point", '<p class="explain">Some arguments prove a small thing on the way to a big thing. The small thing is supported (it’s a conclusion of sorts), but it’s used as a step. The main conclusion is the one that isn’t used to prove anything else.</p><div class="diagram"><div class="drow"><div class="dbox ev"><span class="mono">Reason</span>The wetland absorbs floodwater.</div></div><div class="darrow">↓</div><div class="drow"><div class="dbox mid"><span class="mono">Supported step</span>So draining it would cause more flooding.</div></div><div class="darrow">↓</div><div class="drow"><div class="dbox con"><span class="mono">Main conclusion</span>The town should protect the wetland.</div></div></div>')+
    sec("The test", '<p class="explain">For each candidate, ask: <strong>“Is this sentence being used to prove something else?”</strong> If yes, it’s a step. The main conclusion is where it all ends up.</p>'),

  traps: ()=> sec("Six conclusion traps", '<p class="explain">Wrong answers on the LSAT are built around predictable mistakes. Learn them and you can spot them coming.</p>')+
    ["last","important","fact","background","opposing","middle"].map((k,i)=>{ const T = TRAPS_C[k]; return '<section class="panel stack"><span class="mono">Mistake '+(i+1)+'</span><h3>'+esc(T.name)+'</h3><p><strong>Why it’s tempting:</strong> '+esc(T.made)+'</p><p><strong>Why it’s wrong:</strong> '+esc(T.wrong)+'</p><div class="note">'+esc(T.easy)+'</div><p class="muted"><strong>Remember:</strong> '+esc(T.trick)+'</p></section>'; }).join("")+
    sec("Also watch for", '<ul class="prose" style="padding-left:20px"><li><strong>Examples</strong> (“For example, …”) are support, never the point.</li><li><strong>Opinions with no support.</strong> A strong opinion that nothing else in the passage backs up isn’t functioning as the conclusion. The conclusion is the claim that gets support.</li></ul><p class="muted">Background and other people’s views each get their own full steps later. For now, just know they aren’t the author’s point.</p>'),

  own: ()=> { const t = s1().teach;

/* ---------- lesson + item ladders for the breakdown agent ---------- */
function s1ItemLadder(it){
  const L = [];
  if(it.kind==="tap"){
    const ws = wordsIn(it.sents.map(s=>s.t).join(" "),["signal"]);
    L.push({m:"breakdown", text:"**Your task:** "+taskText(it)+"\n\nAsk the first question: **what is this person trying to convince me of?** Then point at your best guess and ask **“Why should I believe this?”** If the other sentences answer, you found it."+(ws.length?"\n\n**Signal words here:** "+ws.map(id=>"**"+VB[id].term+"** ("+(ROLE_LABEL[SIGNAL_ROLE[id]]||VB[id].simple)+")").join(", "):"\n\nThere’s no signpost here, so look for the judgment: should, must, probably, is best, is mistaken.")});
    L.push({m:"sbs", html:()=> '<ol class="prose" style="padding-left:20px">'+it.sents.map((s,i)=>'<li><strong>Sentence '+(i+1)+'</strong> <span class="tag">'+R1[s.role]+'</span><br><span style="font-family:var(--f-display)">“'+esc(s.t)+'”</span></li>').join("")+'</ol><p class="explain">So in regular English, the whole thing is basically saying: '+esc(it.sents.find(s=>s.role==="conclusion").t)+'</p>'});
    L.push({m:"why", text:"**The Why test, done out loud:**\n\nWhy should I believe “"+it.sents.find(s=>s.role==="conclusion").t+"”?\nBecause: "+it.sents.filter(s=>s.role==="premise"||s.role==="middle").map(s=>"“"+s.t+"”").join(" and ")+".\n\nThe other sentences answer the why. That makes it the conclusion."});
    L.push({m:"draw", html:()=>diagramHTML(it.sents.map(s=>Object.assign({},s,{role:s.role==="premise"?"evidence":s.role})))});
    L.push({m:"analogy", text:S1_LADDERS.word[1].text});
    L.push({m:"kid", text:S1_LADDERS.word[2].text});
    L.push({m:"define", text: (()=>{ const ws = wordsIn(itemText(it)).slice(0,6); return ws.length ? ws.map(id=>"**"+VB[id].term+"**: "+VB[id].simple).join("\n") : "No hard vocabulary in this one. The challenge is the structure."; })()});
  } else if(it.kind==="mcq"){
    const q = Q(it.qid); qLadder(q, {done:false}).forEach(x=>L.push(x));
  } else {
    const ids = it.vid ? [it.vid] : (it.vids||[]);
    ids.slice(0,3).forEach(id=>{ const v = VB[id]; L.push({m:"define", text:"**"+v.term+"**\n**Simple:** "+v.simple+"\n**LSAT:** "+v.lsat+"\n**Think:** "+v.think}); });
    if(ids[0]){ L.push({m:"analogy", text:"**Everyday example:** "+VB[ids[0]].easy+"\n\n**LSAT example:** "+VB[ids[0]].lsatEx}); L.push({m:"kid", text:"Memory trick: **"+VB[ids[0]].trick+"**"}); }
    if(it.why) L.push({m:"breakdown", text:it.why});
    L.push({m:"restart", text:S1_LADDERS.word[0].text});
  }
  return L;
}
const S1_CHECKS = {

  job:{q:"“My cat knocked over my coffee, so all cats are evil.” Is “all cats are evil” the conclusion?", opts:["No, because it isn’t true.","Yes. It’s what the speaker is trying to prove, even though it’s a bad argument."], a:1},
  signposts:{q:"THEREFORE = ?", opts:["Evidence coming","Possible conclusion coming","Contrast","An example"], a:1},

  clues:{q:"True or false: if there is no signpost word, there is no conclusion.", opts:["True","False"], a:1},
  translate:{q:"“The plan is unlikely to succeed.” Best translation?", opts:["The plan will fail.","The plan probably won’t work.","The plan might work perfectly."], a:1},
  main:{q:"“The bridge is closed, so the bus will be late. We should leave early.” Main conclusion?", opts:["The bridge is closed.","The bus will be late.","We should leave early."], a:2},
  traps:{q:"An argument starts “Some people say coffee is unhealthy.” What is that sentence usually?", opts:["The author’s conclusion","Someone else’s view the author will argue with","Evidence for the author"], a:1},

};


/* =========================================================
   HUMAN LANGUAGE FIRST, LSAT TERM SECOND

/* merge the 4-level fields into every word, and set the core definitions in the student's own wording */
VBANK.forEach(v=>{ if(typeof VOCAB_LEVELS!=="undefined" && VOCAB_LEVELS[v.id]) Object.assign(v, VOCAB_LEVELS[v.id]); });
Object.assign(VB.conclusion||{}, {kid:"The thing they want you to believe.", simple:"The main point the person is trying to prove.", lsat:"The claim that the argument is trying to establish.", think:"Ask: what is this person trying to convince me of?"});
Object.assign(VB.claim||{}, {kid:"Something a person says is true.", simple:"A statement someone presents as true. It might be right or wrong.", lsat:"A statement presented as true.", think:"Someone is saying this is true. What job is it doing: the point, or a reason?"});
Object.assign(VB.support||{}, {kid:"A reason that helps make something more believable.", simple:"Information that makes another idea easier to believe.", lsat:"Information or reasoning offered in favor of a claim.", think:"Ask: why should I believe the other statement? This is the answer."});
Object.assign(VB.argument||{}, {kid:"Someone gives you reasons for believing something.", simple:"Here is what I believe, and here is why. Not a fight.", lsat:"A set of statements in which one or more are offered as support for another.", mistake:"Thinking it means a fight or a disagreement. On the LSAT, nobody has to be arguing.", think:"Find the point, then find the reasons offered for it."});

const JOB = {conclusion:"The point", premise:"A reason", background:"Scene-setting", opposing:"Someone else’s view", middle:"A step toward the point"};
function jobLabel(role){ const st = s1(); const lsat = role==="conclusion" && st.lessons.word ? " (conclusion)" : role==="premise" && st.lessons.reason ? " (support)" : ""; return JOB[role] + lsat; }

/* language progression: simple wording first, LSAT wording later */
function taskTextH(it){
  if(it.task==="reason") return "Why does the speaker think that? Tap the reason.";
  const lv = it.level||3;
  if(it.task==="main") return lv<=3 ? "Tap the MAIN point: the one everything else is building toward (the main conclusion)." : "Tap the MAIN conclusion.";
  if(it.task==="author") return lv<=2 ? "What does the AUTHOR want you to believe? Tap it (not someone else’s view, not scene-setting)." : lv<=3 ? "Tap the author’s point (the conclusion), not anyone else’s view." : "Tap the author’s conclusion.";
  return lv<=1 ? "What is this person trying to get you to believe? Tap it." : lv<=2 ? "Tap the point (the LSAT calls it the conclusion)." : "Tap the conclusion.";
}

/* WHAT ARE THEY DOING? (intention, in plain words) */
function intentionOf(it){
  const c = it.kind==="tap" ? it.sents.find(s=>s.role==="conclusion").t : it.kind==="mcq" ? Q(it.qid).sents.find(s=>s.role==="conclusion").t : "";
  const t = c.toLowerCase();
  let kind = "trying to convince you that something is true";
  if(/\b(should|ought|need to|needs to|must|have to|let's|it would be (unwise|wise)|time to|don.t|do not)\b/.test(t)) kind = "recommending something (telling you what should be done)";
  else if(/\b(mistaken|wrong|not true|misplaced|backwards|overstated|deserves to be reconsidered|unjustified|not worth|is not)\b/.test(t)) kind = "disagreeing: saying some idea is wrong";
  else if(/\b(will|likely|probably|unlikely|doubtful|expected|is going to)\b/.test(t)) kind = "making a prediction or showing that something is probably true";
  else if(/\b(caused|because of|due to|explained|adaptation|result of|must have)\b/.test(t)) kind = "explaining why something happened";
  else if(/\b(best|better|worse|worth|poor|strongest|great|good|bad|healthy|deal)\b/.test(t)) kind = "judging something (saying how good or bad it is)";
  const sents = it.kind==="tap" ? it.sents : it.kind==="mcq" ? Q(it.qid).sents : [];
  const pushback = sents.some(s=>s.role==="opposing");
  return {kind, pushback, sents};
}
function intentionHTML(it, answered){
  const o = intentionOf(it);
  let h = '<div class="note accent"><h4>What are they doing?</h4><p>They’re <strong>trying to convince you</strong>. More exactly, they’re <strong>'+esc(o.kind)+'</strong>.'+(o.pushback?' They’re also <strong>pushing back on someone else’s view</strong> along the way.':"")+'</p>';
  if(answered) h += '<p style="margin-top:8px"><strong>Why each sentence is there:</strong></p><ul class="prose" style="padding-left:20px;gap:4px">'+o.sents.map(s=>'<li>“'+esc(s.t)+'” → <strong>'+esc(jobLabel(s.role==="evidence"?"premise":s.role))+'</strong></li>').join("")+'</ul>';
  else h += '<p class="muted" style="margin-top:6px">Now ask: which sentence is the thing they want you to accept?</p>';
  return h + '</div>';
}

/* SAY IT LIKE A NORMAL PERSON */
function glossHTML(text){
  const ws = wordsIn(text).filter(id=>!["signal"].includes(VB[id].cat)).slice(0,8);
  return ws.length ? '<ul class="prose" style="padding-left:20px;gap:4px">'+ws.map(id=>'<li><strong>'+esc(VB[id].term)+'</strong> = '+esc(VB[id].kid||VB[id].simple)+'</li>').join("")+'</ul>' : '<p class="muted">No hard LSAT words here.</p>';
}
async function sayNormal(uid){
  const it = S1_BY[uid]; U.normal = U.normal||{};
  const text = it.kind==="tap" ? (it.speaker?it.speaker+": ":"")+it.sents.map(s=>s.t).join(" ") : it.kind==="mcq" ? Q(it.qid).sents.map(s=>s.t).join(" ")+" Question: "+Q(it.qid).stem : (it.focus || it.text || it.q || "");
  const set = s1().set; if(set && set.items[set.i]===uid && !set.answered && (it.level||1)>=4) set.assisted[uid] = true;
  const known = TRANS_C.find(t=>t.lsat===it.focus); const hard = (typeof HARDER!=="undefined") ? HARDER.find(h=>h.hard===it.focus) : null;
  const answered = !(set && set.items[set.i]===uid && !set.answered);
  if(answered && (known||hard)){ U.normal[uid] = {html:'<p><strong>In normal words:</strong> '+esc(known?known.opts[known.answer]:hard.simple)+'</p>'}; render(); return; }
  const sample = await getSample();

  U.normal[uid] = {html:'<p class="muted">Rewriting it in everyday English…</p>'}; render();
  try{
    const r = await sample.json("Rewrite this LSAT-style text in plain everyday English for a beginner, sentence by sentence. Keep the SAME meaning and the SAME strength (don't turn 'probably' into 'definitely'). Don't add opinions. Don't say which sentence is the conclusion or which answer is right. Text:\n\"\"\""+text.slice(0,3000)+"\"\"\"\nReply with only JSON: {\"lines\":[\"plain version of each sentence\"], \"gist\":\"one sentence: 'Basically, they're saying...'\"}", {modelTier:"quick", cache:{gcTime:864e5}});
    U.normal[uid] = {html:'<p><strong>Said like a normal person:</strong></p><ol class="prose" style="padding-left:20px;gap:4px">'+[].concat(r.lines||[]).map(l=>'<li>'+esc(l)+'</li>').join("")+'</ol>'+(r.gist?'<p style="margin-top:6px"><em>'+esc(r.gist)+'</em></p>':"")};
  }catch(e){ U.normal[uid] = {html:'<p><strong>Hard words, in plain English:</strong></p>'+glossHTML(text)}; }

/* four-level box + purpose questions */
function fourLevels(id){ const v = VB[id]; if(!v) return "";
  return '<div class="four"><div><span class="mono">Level 1 · Kid-simple</span><span>'+esc(v.kid||v.simple)+'</span></div><div><span class="mono">Level 2 · Everyday</span><span>'+esc(v.simple)+'</span></div><div><span class="mono">Level 3 · LSAT</span><span>'+linkify(esc(v.lsat))+'</span></div><div><span class="mono">Level 4 · On the exam</span><span>'+esc(v.think)+'</span></div></div>'; }
function purposeHTML(id){ const v = VB[id]; if(!v || !v.does) return "";
  return '<dl class="purpose"><dt>What is it?</dt><dd>'+esc(v.kid||v.simple)+'</dd><dt>What does it do?</dt><dd>'+esc(v.does)+'</dd><dt>Why is it there?</dt><dd>'+esc(v.whyThere)+'</dd><dt>What does it connect to?</dt><dd>'+esc(v.connects)+'</dd><dt>What should I think?</dt><dd>'+esc(v.think)+'</dd></dl>'; }
const reveal = (key, q, a) => '<div class="qa"><p><strong>'+esc(q)+'</strong></p>'+((U.rev||{})[key]?'<div class="note good">'+esc(a)+'</div>':'<button class="btn" data-act="reveal" data-k="'+key+'">Think first, then show me</button>')+'</div>';
const chainHTML = rows => '<div class="chain">'+rows.map((r,i)=>(i?'<div class="darrow">↓</div>':"")+'<div class="chainbox">'+r+'</div>').join("")+'</div>';

/* new human-first lessons (added in front of the conclusion lessons) */
Object.assign(LESSON_BODY, {
  doing: ()=> sec("1 · What is happening in real life?", '<p class="explain">People talk all day. Sometimes they’re just telling you things. Sometimes they’re trying to get you to <strong>believe</strong> something or <strong>do</strong> something. Before anything else, notice which one is happening.</p>'+reveal("d1","Your friend says: “I think we should leave early because traffic is always terrible at 5:00.” What is your friend trying to do?","Get you to agree that you should leave early. They’re trying to convince you."))+
    sec("2 · What is the person trying to DO?", '<p>Ask this before anything else. People are usually doing one of these:</p><div class="intents">'+[["Convince you","“You should try this place. The food is amazing.”"],["Recommend something","“The city should fix this road.”"],["Predict something","“It’s going to rain, so the game will be canceled.”"],["Explain why something happened","“The plant died because nobody watered it.”"],["Disagree with someone","“Mom says we need cable. We really don’t.”"],["Criticize something","“That movie was way too long.”"],["Compare two things","“The small box is a better deal than the big one.”"],["Give an example","“For example, my sister walks to work every day.”"],["Just report a fact","“The store opens at 7.” (Not trying to convince you.)"]].map(([a,b])=>'<div class="intent"><strong>'+a+'</strong><span>'+esc(b)+'</span></div>').join("")+'</div><p class="muted">Knowing what they’re trying to do tells you what each sentence is for.</p>')+
    sec("3 · What they SAY vs. WHY they say it", '<p class="explain">These are two different questions.</p>'+reveal("d2","“I am taking an umbrella because the forecast says it will rain.” What did they say? Why did they say it?","WHAT they said: “I am taking an umbrella.” WHY: to explain their decision. The forecast is their reason.")+reveal("d3","“The city should repair this road because there have been 12 accidents here this year.” What are they trying to make you believe? Why give you the accident number?","They want you to believe the city should repair the road. The accident number is there to make that idea more believable."))+
    sec("4 · The questions that work every time", '<ul class="prose" style="padding-left:20px"><li>What is this person trying to do?</li><li>Why did they tell me this?</li><li>Why is this sentence here?</li><li>Why should I believe that?</li><li>Which idea is this sentence helping?</li><li>What would happen if this sentence disappeared?</li><li>What does the author ultimately want from me?</li></ul>')+
    sec("5 · What does the LSAT call this?", '<p class="explain">What someone is trying to accomplish is their <strong>purpose</strong> (or intention). You already understand it. Now it has a name.</p>'),

  claim: ()=> sec("1 · In real life", '<p class="explain">People say things are true all the time. “The store closes at 8.” “The dog is tired.” “We should leave now.”</p>'+reveal("c1","Are those three statements all the same kind of thing?","Yes. In each one, someone is saying something is true. Even “We should leave now”: they’re saying it’s true that leaving now is the right move."))+
    sec("2 · That has a name: a CLAIM", '<p class="explain">A <strong>claim</strong> is simply <strong>something a person says is true</strong>.</p><div class="note warn"><h4>A claim is not automatically correct</h4>It just means they’re <em>saying</em> it’s true. “My cat is the smartest cat alive” is a claim. It might not be right.</div><div class="grid2"><div class="note"><h4>These are claims</h4>Facts: “The store closes at 8.”<br>Opinions: “That movie was boring.”<br>Predictions: “It will rain tomorrow.”<br>Recommendations: “You should rest.”</div><div class="note"><h4>These are not</h4>Questions: “Is it raining?”<br>Commands: “Close the door.”<br>Greetings: “Hi!”</div></div>')+
