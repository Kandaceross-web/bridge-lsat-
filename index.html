<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}img{max-width:100%}</style></head><body><title>Bridge LSAT</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: study desk. Top bar, one reading column, tutor docked on the right (bottom sheet on phones). */
:root{
  --paper:#F4F6F8; --surface:#FFFFFF; --sunk:#EBEEF2; --ink:#18202E; --muted:#5A6474; --line:#D9DEE6;
  --accent:#1F6B57; --accent-ink:#FFFFFF; --accent-soft:#DCEDE7;
  --good:#1F7A4D; --good-soft:#DDF1E6; --bad:#B23B2E; --bad-soft:#F8E1DD; --warn:#9A6400; --warn-soft:#FBEFD6;
  --hl-ev:#CFE2FF; --hl-con:#FFE6A1; --hl-bg:#E6E3EE; --hl-opp:#F7D4CF; --hl-mid:#D5EFDD;
  --f-display:"Newsreader", Georgia, "Times New Roman", serif;
  --f-ui:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0F141A; --surface:#161D25; --sunk:#1D2630; --ink:#E5EAF0; --muted:#98A3B1; --line:#2A3542;
  --accent:#5DBB9C; --accent-ink:#0B1612; --accent-soft:#183329;
  --good:#5CC48D; --good-soft:#15301F; --bad:#EE8577; --bad-soft:#3A1E1A; --warn:#E7B656; --warn-soft:#352A12;
  --hl-ev:#1E3657; --hl-con:#4A3B0E; --hl-bg:#2B2838; --hl-opp:#4A2420; --hl-mid:#1A3A26; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0F141A; --surface:#161D25; --sunk:#1D2630; --ink:#E5EAF0; --muted:#98A3B1; --line:#2A3542;
  --accent:#5DBB9C; --accent-ink:#0B1612; --accent-soft:#183329;
  --good:#5CC48D; --good-soft:#15301F; --bad:#EE8577; --bad-soft:#3A1E1A; --warn:#E7B656; --warn-soft:#352A12;
  --hl-ev:#1E3657; --hl-con:#4A3B0E; --hl-bg:#2B2838; --hl-opp:#4A2420; --hl-mid:#1A3A26; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--paper);color:var(--ink)}
html{scroll-padding-top:90px}
body{font-family:var(--f-ui);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);font-weight:500;text-wrap:balance;margin:0;line-height:1.2}
h1{font-size:2rem} h2{font-size:1.55rem} h3{font-size:1.2rem}
p{margin:0}
.mono{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{display:flex;align-items:center;gap:16px;padding-block:10px;padding-inline:16px;max-width:1320px;margin:0 auto;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:1.3rem;font-weight:600;display:flex;align-items:center;gap:8px}
.brand-mark{width:26px;height:26px}
.nav{display:flex;gap:4px;flex-wrap:wrap}
.nav button{background:none;border:0;padding:6px 12px;border-radius:999px;color:var(--muted);font-weight:500}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.stats{margin-left:auto;display:flex;gap:14px;align-items:center;font-size:.9rem}
.stat b{font-variant-numeric:tabular-nums}
.tutor-toggle{background:var(--accent);color:var(--accent-ink);border:0;border-radius:999px;padding:7px 14px;font-weight:600}

/* shell */
.shell{scroll-padding-top:90px;max-width:1320px;margin:0 auto;padding-inline:16px;padding-block:24px 80px;display:grid;grid-template-columns:minmax(0,1fr);gap:28px}
@media (min-width:1120px){.shell{grid-template-columns:minmax(0,1fr) 400px}.tutor-toggle{display:none}}
main{min-width:0;max-width:800px;width:100%;justify-self:center}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:22px}
.panel.flat{background:none;border:0;padding:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.lead{font-size:1.08rem;max-width:62ch}
.prose{display:flex;flex-direction:column;gap:12px;max-width:65ch}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:9px 16px;font-weight:600}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:none}
.btn:disabled{opacity:.45;cursor:not-allowed}
.idk{border:1.5px solid var(--warn);color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:8px 14px;font-weight:700;letter-spacing:.02em}
.idk:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}

/* term translations */
.term{display:grid;grid-template-columns:150px 1fr;gap:4px 16px;padding-block:10px;border-top:1px solid var(--line)}
.term:first-child{border-top:0}
.term dt{font-weight:700}
.term dd{margin:0;font-family:var(--f-display);font-size:1.08rem;font-style:italic}
@media (max-width:520px){.term{grid-template-columns:1fr}}
.translate{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;align-items:center;background:var(--sunk);border-radius:8px;padding:14px}
.translate .arrow{color:var(--muted)}
.translate .from{font-family:var(--f-display)}
.translate .to{font-weight:600}
@media (max-width:560px){.translate{grid-template-columns:1fr}.translate .arrow{transform:rotate(90deg);justify-self:start}}

/* lesson rail */
.rail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.rail button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.85rem;display:flex;gap:8px;align-items:center;color:var(--muted)}
.rail button .n{font-family:var(--f-mono);font-size:.72rem}
.rail button[aria-current="step"]{border-color:var(--accent);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.rail button.done .n::after{content:" ✓";color:var(--good)}

/* stimulus */
.stim{font-family:var(--f-display);font-size:1.16rem;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px}
.stim .speaker{font-weight:600}
.s{border-radius:3px;padding:1px 0;cursor:pointer;transition:background .15s}
.s:hover{background:var(--sunk)}
.s.hl{background:var(--hl-con)}
.s.r-evidence{background:var(--hl-ev)} .s.r-conclusion{background:var(--hl-con)} .s.r-background{background:var(--hl-bg)} .s.r-opposing{background:var(--hl-opp)} .s.r-middle{background:var(--hl-mid)}
.s.sel{outline:2px solid var(--accent);outline-offset:1px}
.tag{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;vertical-align:2px;margin-left:4px;padding:1px 5px;border-radius:3px;background:var(--surface);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.w.vocab{text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.vocab-mode .s{cursor:text}
.vocab-mode .w{cursor:help}
.vocab-mode .w:hover{background:var(--accent-soft)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:14px;border-radius:3px;display:inline-block}

/* question */
.qbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.qnav{display:flex;gap:6px;flex-wrap:wrap}
.qnav button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-family:var(--f-mono);font-size:.8rem;position:relative}
.qnav button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.qnav button.ok{background:var(--good-soft)} .qnav button.no{background:var(--bad-soft)}
.qnav button.flag::after{content:"";position:absolute;top:3px;right:3px;width:6px;height:6px;border-radius:50%;background:var(--warn)}
.stem{font-weight:600;font-size:1.04rem}
.choices{display:flex;flex-direction:column;gap:8px}
.choice{display:grid;grid-template-columns:1fr 34px;align-items:start;gap:8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:10px 8px 10px 12px}
.choice .pick{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:start;background:none;border:0;padding:0;text-align:left;color:inherit;font:inherit;min-width:0}
.choice .pick:disabled{cursor:default}
.choice .letter{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--muted);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.choice .ctext{padding-top:2px;cursor:pointer}
.choice.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.choice.on .letter{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.choice.x .ctext{text-decoration:line-through;color:var(--muted)}
.choice.right{border-color:var(--good);background:var(--good-soft)}
.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}
.elim{border:0;background:none;color:var(--muted);font-size:1rem;width:30px;height:30px;border-radius:6px}
.elim:hover{background:var(--sunk)}
.timer{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.conf{display:flex;flex-wrap:wrap;gap:6px}
.conf button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:.9rem}
.conf button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.note{border-radius:8px;padding:14px 16px;background:var(--sunk)}
.note.good{background:var(--good-soft)} .note.bad{background:var(--bad-soft)} .note.warn{background:var(--warn-soft)} .note.accent{background:var(--accent-soft)}
.note h4{margin:0 0 4px;font-size:.95rem}
.autopsy{display:flex;flex-direction:column;gap:10px}
.aut{border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:30px 1fr;gap:4px 10px}
.aut .letter{font-weight:700}
.aut.correct{border-color:var(--good)}
.aut .lbl{font-size:.82rem;font-weight:700;color:var(--muted)}
.trap{display:inline-block;font-family:var(--f-mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:2px 6px}
.trap.okay{background:var(--good-soft);color:var(--good)}

/* diagram */
.diagram{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px;background:var(--sunk);border-radius:var(--r)}
.drow{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%}
.dbox{border-radius:8px;padding:10px 12px;max-width:340px;flex:1 1 200px;font-size:.92rem;border:1px solid var(--line);background:var(--surface)}
.dbox .mono{display:block;margin-bottom:2px}
.dbox.ev{border-left:4px solid #5A8EDB} .dbox.con{border-left:4px solid #D6A21C;font-weight:600} .dbox.mid{border-left:4px solid #3E9E64}
.darrow{font-size:1.3rem;color:var(--muted);line-height:1}
.aside-box{width:100%;border-top:1px dashed var(--line);padding-top:10px;margin-top:4px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.aside-box .dbox{opacity:.85;font-size:.85rem}

/* levels */
.levels{display:flex;flex-wrap:wrap;gap:4px;background:var(--sunk);padding:4px;border-radius:999px;width:fit-content;max-width:100%}
.levels button{border:0;background:none;border-radius:999px;padding:5px 12px;font-size:.85rem;color:var(--muted)}
.levels button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.explain{font-family:var(--f-display);font-size:1.12rem;line-height:1.65;max-width:62ch}

/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.kpi .v{font-family:var(--f-display);font-size:1.8rem;font-variant-numeric:tabular-nums;line-height:1.1}
.mastery{display:flex;gap:3px}
.mastery i{flex:1;height:8px;border-radius:2px;background:var(--sunk)}
.mastery i.on{background:var(--accent)}
.skill{display:grid;grid-template-columns:1fr 150px auto;gap:12px;align-items:center;padding-block:10px;border-top:1px solid var(--line)}
.skill:first-of-type{border-top:0}
@media (max-width:520px){.skill{grid-template-columns:1fr auto}.skill .mastery{grid-column:1/-1;order:3}}
.pill{font-family:var(--f-mono);font-size:.64rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.live{background:var(--accent-soft);color:var(--accent)}
.plan{display:flex;flex-direction:column}
.plan-item{display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.plan-item:first-child{border-top:0}
.criteria{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:6px}
.criteria li{display:grid;grid-template-columns:22px 1fr;gap:8px}
.criteria .ck{color:var(--good);font-weight:700}
.criteria .no{color:var(--muted)}
table.cal{border-collapse:collapse;width:100%;font-size:.92rem}
table.cal th,table.cal td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
table.cal td.n{font-variant-numeric:tabular-nums;text-align:right} table.cal th.n{text-align:right}
.tblwrap{overflow-x:auto}

/* journal */
.jentry{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.jgrid{display:grid;grid-template-columns:170px 1fr;gap:6px 14px;font-size:.93rem}
.jgrid dt{color:var(--muted);font-weight:600}
.jgrid dd{margin:0;min-width:0}
@media (max-width:560px){.jgrid{grid-template-columns:1fr}.jgrid dd{margin-bottom:6px}}

/* tutor */
.tutor{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0}
@media (min-width:1120px){.tutor{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);height:calc(100vh - 100px)}}
@media (max-width:1119.98px){
  .tutor{position:fixed;left:0;right:0;bottom:0;z-index:40;height:min(78vh,680px);border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.18);transform:translateY(105%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom,0px)}
  .tutor.open{transform:none}
}
.t-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.t-head .row{justify-content:space-between}
.t-ctx{font-size:.82rem;color:var(--muted)}
.t-msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.msg{max-width:92%;padding:10px 13px;border-radius:12px;font-size:.95rem;line-height:1.5;white-space:normal;overflow-wrap:anywhere}
.msg.t{background:var(--sunk);align-self:flex-start;border-bottom-left-radius:4px}
.msg.u{background:var(--accent);color:var(--accent-ink);align-self:flex-end;border-bottom-right-radius:4px}
.msg.sys{background:none;border:1px dashed var(--line);color:var(--muted);font-size:.85rem;align-self:stretch;max-width:none}
.msg pre{font-family:var(--f-mono);font-size:.8rem;white-space:pre-wrap;margin:6px 0;background:var(--surface);padding:8px;border-radius:6px}
.msg ul{margin:6px 0;padding-left:18px}
.t-chips{padding:8px 16px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px;max-height:34%;overflow-y:auto}
.t-chips .chip{font-size:.8rem;padding:4px 10px}
.t-input{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line)}
.t-input textarea{flex:1;resize:none;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:.95rem;background:var(--paper);color:var(--ink);min-height:42px;max-height:120px}
.t-level select{font:inherit;font-size:.82rem;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);padding:3px 6px}
@media (min-width:1120px){.t-head [data-act=tutor-close]{display:none}}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:35}
@media (min-width:1120px){.scrim{display:none}}

/* popover + toast */
.pop{position:fixed;z-index:60;max-width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.18);padding:14px 16px;font-size:.92rem;display:flex;flex-direction:column;gap:6px}
.pop h4{margin:0;font-family:var(--f-display);font-size:1.2rem;font-weight:500}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:.92rem;max-width:calc(100vw - 32px);box-shadow:0 8px 24px rgba(0,0,0,.2)}
textarea.big{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;padding:12px;font:inherit;background:var(--surface);color:var(--ink)}
select.field{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);color:var(--ink)}
.switch{display:flex;gap:10px;align-items:flex-start}
.switch input{margin-top:5px;width:18px;height:18px;accent-color:var(--accent)}
.anat-pick{display:flex;flex-wrap:wrap;gap:6px}
.anat-pick button{border:1px solid var(--line);border-radius:6px;padding:5px 10px;font-size:.85rem;background:var(--surface)}
.anat-pick button i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}

/* step 1 + vocabulary */
.vw{all:unset;cursor:pointer;text-decoration:underline dotted var(--accent);text-underline-offset:3px;text-decoration-thickness:1.5px}
.vw:hover{background:var(--accent-soft)} .vw:focus-visible{outline:2px solid var(--accent)}
.vpop{max-height:min(80vh,640px);overflow-y:auto;left:50%!important;top:50%!important;transform:translate(-50%,-50%);width:min(440px,calc(100vw - 32px));max-width:none}
.vcard{display:flex;flex-direction:column;gap:10px}
.vcard h4{font-family:var(--f-display);font-size:1.5rem;font-weight:500;margin:0}
.vrow{display:grid;grid-template-columns:1fr;gap:2px}
.vrow > div{line-height:1.5}
.vpill{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.vpill.v-mastered,.wchip.v-mastered{background:var(--good-soft);color:var(--good);border-color:transparent}
.vpill.v-learning,.wchip.v-learning{background:var(--accent-soft);color:var(--ink);border-color:transparent}
.vpill.v-weak,.wchip.v-weak{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.wchip{border:1px dashed var(--line);background:var(--surface);border-radius:999px;padding:4px 11px;font-size:.86rem;color:var(--muted)}
.drillgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.drillbtn{display:flex;flex-direction:column;gap:4px;text-align:left;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;font-size:.9rem}
.drillbtn:hover{border-color:var(--accent)}
.drillbtn strong{font-size:1rem}
.flashword{font-family:var(--f-display);font-size:clamp(2rem,7vw,3.2rem);text-align:center;padding-block:18px;letter-spacing:.02em}
.speedbar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden}
.speedbar i{display:block;height:100%;background:var(--warn);width:100%;transform-origin:left;animation:shrink linear forwards}
@keyframes shrink{to{transform:scaleX(0)}}
.stemtap{font-family:var(--f-display);font-size:1.15rem;line-height:2}
.tw{border:1px solid transparent;background:none;border-radius:4px;padding:1px 3px;font:inherit}
.tw:hover{background:var(--sunk);border-color:var(--line)}
.tw.key{background:var(--hl-con);border-color:transparent} .tw.miss{background:var(--bad-soft)}
.breakdown9{display:flex;flex-direction:column;gap:10px;border:1px solid var(--line);border-radius:8px;padding:14px;background:var(--surface)}
mark{background:var(--hl-con);color:inherit;border-radius:2px;padding:0 2px}

.tapstim .s.tap:hover{background:var(--sunk)} .tapstim .s.tap:focus-visible{outline:2px solid var(--accent)}
.tapstim .s.tap.sel{outline:2px solid var(--accent);outline-offset:1px;background:var(--accent-soft)}
.tapstim .s.tap.r-conclusion{background:var(--hl-con)} .tapstim .s.tap.r-opposing{background:var(--hl-opp)}
.missbar{background:var(--bad)!important}
.stairs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;align-items:end;padding:18px}
.stair{display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--sunk);min-height:calc(60px + var(--n) * 14px);font-size:.85rem;min-width:0}
.stair strong{font-family:var(--f-display);font-size:1rem;font-weight:600;line-height:1.2}
.stair.active{background:var(--accent-soft);border-color:var(--accent)} .stair.done{background:var(--good-soft);border-color:var(--good)}

@media (max-width:720px){.stairs{grid-template-columns:1fr;align-items:stretch}.stair{min-height:0}}
.skilltable{display:flex;flex-direction:column;gap:8px}
.skrow{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) 48px;gap:12px;align-items:center;font-size:.93rem}
.skbar{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.skbar i{display:block;height:100%;background:var(--muted)}
.skrow.solid .skbar i{background:var(--good)}
.skrow .tnum{text-align:right}
.lessonlist{display:flex;flex-direction:column}
.lessonrow{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding-block:12px;border-top:1px solid var(--line)}
.lessonrow:first-child{border-top:0}
.lessonrow.done .mono::after{content:" \2713";color:var(--good)}
.lessonrow.locked{opacity:.65}
.bigword{font-family:var(--f-display);font-size:clamp(2rem,6vw,2.8rem);font-weight:500}
.minicards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.minicard{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:4px;border:1px solid var(--line);border-radius:8px;padding:12px;background:var(--surface);font-size:.9rem}
div.minicard{cursor:default}
.minicard:hover{border-color:var(--accent)}
.spgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.spcard{border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.spcard h3{font-size:1.25rem}
dl.sp{display:grid;grid-template-columns:110px 1fr;gap:4px 10px;margin:0;font-size:.88rem}

.ebd{display:grid;grid-template-columns:1fr;gap:4px;background:var(--sunk);border-radius:6px;padding:10px;font-size:.88rem}

.ebd .con{font-weight:600}
.alarm{display:inline-block;font-family:var(--f-mono);font-size:.78rem;letter-spacing:.08em;background:var(--warn-soft);color:var(--warn);border:1px solid var(--warn);border-radius:4px;padding:1px 8px}
.methodnav{display:flex;flex-wrap:wrap;gap:6px}
.bdmodes{display:flex;flex-direction:column;gap:6px}
.bdmodes .chip{font-size:.8rem;padding:4px 10px}
.exmiss{border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.exmiss summary{cursor:pointer;font-weight:600}
.badge{font-size:2rem}


/* human-first */
.helpers{gap:6px}
.helpers .chip{font-size:.82rem}
.four{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.four > div{background:var(--sunk);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;font-size:.93rem}
dl.purpose{display:grid;grid-template-columns:170px 1fr;gap:6px 12px;margin:0;font-size:.93rem}
dl.purpose dt{font-weight:700} dl.purpose dd{margin:0}
@media (max-width:520px){dl.purpose{grid-template-columns:1fr}}
.qa{display:flex;flex-direction:column;gap:8px;border-top:1px dashed var(--line);padding-top:12px}
.chain{display:flex;flex-direction:column;align-items:center;gap:4px}
.chainbox{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:8px 14px;text-align:center;max-width:460px;width:100%}
.intents{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px}
.intent{border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:2px;font-size:.92rem}
.intent span{color:var(--muted)}
table.n2l tr.later td{color:var(--muted)}
/* year plan */
.yearbar{display:flex;gap:3px;height:10px}
.yearbar span{border-radius:2px;background:var(--sunk)}
.yearbar span.past{background:var(--accent)} .yearbar span.now{background:linear-gradient(90deg,var(--accent),var(--accent-soft))}
.verdict{font-family:var(--f-display);font-size:1.15rem;font-weight:600;padding:6px 14px;border-radius:999px}
.verdict.v-go{background:var(--good-soft);color:var(--good)} .verdict.v-close{background:var(--warn-soft);color:var(--warn)} .verdict.v-build{background:var(--sunk);color:var(--muted)}
.phases{display:flex;flex-direction:column}
.phase{display:grid;grid-template-columns:150px 1fr;gap:16px;padding-block:16px;border-top:1px solid var(--line)}
.phase:first-child{border-top:0}
.phase-when{display:flex;flex-direction:column;gap:2px}
.phase.past h3{color:var(--muted)}
.phase.now{background:var(--accent-soft);margin-inline:-22px;padding-inline:22px;border-radius:8px}
@media (max-width:560px){.phase{grid-template-columns:1fr;gap:6px}.phase.now{margin-inline:-12px;padding-inline:12px}}
.modchip{font-size:.8rem;border:1px dashed var(--line);border-radius:999px;padding:3px 10px;color:var(--muted)}
.modchip.built{border-style:solid;border-color:var(--accent);color:var(--ink)}
.testform{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;align-items:end}
/* breakdown agent */
.bd{background:var(--sunk);border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;display:flex;flex-direction:column;gap:12px;scroll-margin-top:90px}
.bd-level h4,.bd-ask strong{font-family:var(--f-display);font-size:1.12rem;font-weight:600;margin:0 0 6px}
.bd-body{font-size:1rem;line-height:1.6;overflow-wrap:anywhere}
.bd-body pre{font-family:var(--f-mono);font-size:.8rem;white-space:pre;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:10px}
.bd-body ul{margin:6px 0;padding-left:20px}
.bd-old{border-bottom:1px solid var(--line);padding-bottom:8px}
.bd-old summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.bd-old .bd-body{padding-top:8px;opacity:.85}
.bd-ask{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.bd-x{padding:3px 10px;font-size:.85rem}
input.field{font:inherit;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--paper);color:var(--ink);width:100%}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

<script>
const VOCAB_BANK = [
  { id:"premise", term:"premise", cat:"lr", aliases:["premise","premises"], simple:"A fact or reason the arguer gives to back up their point.", lsat:"A statement offered as evidence for the conclusion. You accept it as true for the question.", think:"This is a reason. Accept it as true and ask: what is it trying to prove?", effect:"Supports the conclusion. Premises are the foundation the argument stands on.", easy:"Premise: the restaurant just got a health violation. Point: let's eat somewhere else.", lsatEx:"Every employee who finished the training was promoted. Dana finished the training, so Dana was promoted.", mistake:"Arguing with the premise. On the LSAT you accept premises as true unless the question says otherwise.", trick:"PREMISE = the reason, not the point.", confusers:["conclusion","assumption","evidence"] },
  { id:"conclusion", term:"conclusion", cat:"lr", aliases:["conclusion","conclusions","conclude","concludes","concluded"], simple:"The main point the arguer wants you to believe.", lsat:"The claim that the premises are offered to support; the final point being argued for.", think:"Ask: what is the author trying to convince me of? Find the point everything else backs up.", effect:"It is the target. Every other part of the argument exists to support it.", easy:"\"You should break up with him; he never texts back.\" Conclusion: you should break up with him.", lsatEx:"The city should expand its bus routes. Ridership rose 30 percent last year, and many neighborhoods still have no service.", mistake:"Assuming the last sentence is the conclusion. The conclusion can appear anywhere, often first.", trick:"CONCLUSION = the point everything points to.", confusers:["premise","intermediate-conclusion","inference"] },
  { id:"inference", term:"inference", cat:"lr", aliases:["inference","inferences"], simple:"Something you can figure out for sure from what you're told.", lsat:"A statement that must be true, or is strongly supported, based only on the given information, with no outside assumptions.", think:"Ask: what do these facts prove without me adding anything new?", effect:"Goes no further than the facts allow. A valid inference is backed by the stimulus itself.", easy:"Your receipt says you paid $20 and got $5 back. Inference: the bill was $15.", lsatEx:"All the museum's paintings are insured. The Monet hangs in the museum, so we can infer the Monet is insured.", mistake:"Choosing an answer that sounds reasonable but goes beyond the facts. LSAT inferences must be backed by the text.", trick:"INFERENCE = what the facts already prove.", confusers:["assumption","conclusion","imply"] },
  { id:"assumption", term:"assumption", cat:"lr", aliases:["assumption","assumptions","assumes","assume","assuming","assumed"], simple:"A belief the arguer needs but never says out loud.", lsat:"An unstated premise the argument relies on; it fills the gap between the stated premises and the conclusion.", think:"Ask: what is the author taking for granted that they never said?", effect:"Bridges premises and conclusion. If the assumption is false, the argument weakens or collapses.", easy:"\"I'll buy the bigger TV, it's on sale.\" Assumption: you can afford it even on sale.", lsatEx:"Mara scored highest on the exam, so she will be the best doctor in her class. This assumes exam scores predict doctoring skill.", mistake:"Picking something the argument already says. An assumption is never stated in the passage.", trick:"ASSUMPTION = hidden belief.", confusers:["inference","premise","necessary-assumption"] },
  { id:"flaw", term:"flaw", cat:"lr", aliases:["flaw","flaws","flawed"], simple:"A mistake in how the argument reasons, not in its facts.", lsat:"An error in reasoning that makes the premises fail to properly support the conclusion.", think:"Ask: why don't these reasons prove that point? Name the gap in my own words.", effect:"Signals the support is broken. The conclusion doesn't follow even if every premise is true.", easy:"\"My coworker was late twice, so she's lazy.\" Flaw: judging a whole person on two events.", lsatEx:"Most successful artists drink coffee, so coffee makes people successful artists. The flaw is treating a correlation as a cause.", mistake:"Picking an answer that attacks the facts. Flaw answers describe the bad logic, not false premises.", trick:"FLAW = broken bridge, not bad bricks.", confusers:["assumption","weaken","reasoning"] },
  { id:"reasoning", term:"reasoning", cat:"lr", aliases:["reasoning","reasons","reasoned"], simple:"The way someone gets from their reasons to their point.", lsat:"The logical process connecting premises to conclusion; the structure or method of the argument.", think:"Ask: how did they get from A to B? Focus on the method, not the topic.", effect:"Describes structure. Reasoning questions test how the argument works, not whether it is true.", easy:"\"It rained every day this week, so it'll rain tomorrow.\" The reasoning: past pattern predicts the future.", lsatEx:"The critic reasons that because the novel sold poorly, it must be badly written. That reasoning ignores marketing and timing.", mistake:"Focusing on the subject matter instead of the logical steps.", trick:"REASONING = the road, not the destination.", confusers:["argument","flaw","evidence"] },
  { id:"argument", term:"argument", cat:"lr", aliases:["argument","arguments","argues","argue","argued"], simple:"A point backed up by at least one reason.", lsat:"A set of statements in which premises are offered to support a conclusion. It does not mean a fight.", think:"Find the conclusion and its reasons. No conclusion means it's just a set of facts.", effect:"Has structure: premises lead to a conclusion. Most LR questions ask you to analyze or attack it.", easy:"\"Let's order pizza because everyone's hungry and it's cheap.\" That's an argument.", lsatEx:"The factory should stop night shifts. Night shifts cause more accidents, and demand has dropped.", mistake:"Thinking 'argument' means a disagreement. On the LSAT it just means reasons plus a point.", trick:"ARGUMENT = reasons + point, no yelling.", confusers:["reasoning","conclusion","premise"] },
  { id:"evidence", term:"evidence", cat:"lr", aliases:["evidence"], simple:"Facts or information offered to show something is true.", lsat:"Information presented as support for a claim; in LR, essentially the premises.", think:"Ask: what does this fact show, and is it enough to prove the conclusion?", effect:"Supports a claim. Its strength depends on how directly it connects to the conclusion.", easy:"Your bank app showing a $50 charge is evidence your roommate used your card.", lsatEx:"Patients who walked daily recovered faster. This evidence is used to support a hospital walking program.", mistake:"Treating evidence as proof. Evidence can support a claim without guaranteeing it.", trick:"EVIDENCE = exhibit A for the claim.", confusers:["premise","support","substantiate"] },
  { id:"support", term:"support", cat:"lr", aliases:["support","supports","supported","supporting"], simple:"To give reasons that make a claim more believable.", lsat:"To provide evidence that makes a conclusion more likely. Support can be partial and does not have to prove.", think:"Ask: does this make the claim more believable, even a little? It doesn't need to prove it.", effect:"Raises likelihood without guaranteeing. Weaker than 'prove' or 'must be true.'", easy:"Three friends saying the new cafe is great supports trying it.", lsatEx:"The rise in sales supports the claim that the ad campaign worked. It does not prove it.", mistake:"Thinking support means proof. Support only means 'more likely than before.'", trick:"SUPPORT = a boost, not a guarantee.", confusers:["strengthen","justify","evidence"] },
  { id:"weaken", term:"weaken", cat:"lr", aliases:["weaken","weakens","weakened","weakening"], simple:"To make an argument less convincing.", lsat:"To make the conclusion less likely to follow from the premises, usually by attacking an assumption. It need not disprove it.", think:"Find the gap. Pick the answer that makes the conclusion less likely, even slightly.", effect:"Lowers the argument's force. It doesn't have to destroy the conclusion, just hurt it.", easy:"You think a jacket is a bargain, then see it cheaper next door. That weakens 'buy it here.'", lsatEx:"The mayor says the new park reduced crime. If crime fell equally in towns with no new park, that weakens her claim.", mistake:"Looking for an answer that totally disproves the conclusion. A weakener only needs to make it less likely.", trick:"WEAKEN = poke a hole, not blow it up.", confusers:["strengthen","undermine","flaw"] },
  { id:"strengthen", term:"strengthen", cat:"lr", aliases:["strengthen","strengthens","strengthened","strengthening"], simple:"To make an argument more convincing.", lsat:"To make the conclusion more likely to follow from the premises, often by confirming an assumption. It need not prove it.", think:"Find the gap. Pick the answer that helps close it, even partly.", effect:"Raises the likelihood the conclusion is true. Does not need to make it certain.", easy:"You think a restaurant is good; hearing it won an award strengthens that.", lsatEx:"The scientist argues a diet caused weight loss. If the participants didn't change their exercise, that strengthens her argument.", mistake:"Choosing an answer that just repeats a premise or supports something off topic.", trick:"STRENGTHEN = patch the hole partway.", confusers:["weaken","justify","support"] },
  { id:"justify", term:"justify", cat:"lr", aliases:["justify","justifies","justified","justification"], simple:"To give enough reason that a conclusion fully works.", lsat:"To provide support sufficient to make the conclusion follow logically. In justify questions, the answer guarantees the conclusion.", think:"Find the answer that, added to the premises, makes the conclusion airtight.", effect:"The strongest kind of help. A justifying answer makes the conclusion follow 100%.", easy:"Your boss says anyone who hits the sales target gets a bonus. You hit it. That justifies expecting a bonus.", lsatEx:"Lena shouldn't be fined because she returned the book. This is justified if no one who returns a book should be fined.", mistake:"Settling for an answer that only helps a little. Justify needs to fully close the gap.", trick:"JUSTIFY = make it airtight.", confusers:["strengthen","sufficient-assumption","support"] },
  { id:"principle", term:"principle", cat:"lr", aliases:["principle","principles"], simple:"A general rule that applies to many situations.", lsat:"A broad rule or standard, often conditional, used to guide judgments across many cases.", think:"Turn it into an if-then rule. Then check which case matches the 'if' part.", effect:"Works like a rule: if the conditions are met, the result follows. Usually conditional logic.", easy:"\"Never lend money you can't afford to lose.\" That's a principle.", lsatEx:"A company should recall any product that poses a serious safety risk. The heater poses such a risk, so it should be recalled.", mistake:"Matching the topic instead of the rule. A principle can apply to a totally different subject.", trick:"PRINCIPLE = a rule that travels to other cases.", confusers:["conditional","conforms-to-the-principle","justify"] },
  { id:"discrepancy", term:"discrepancy", cat:"lr", aliases:["discrepancy","discrepancies"], simple:"Two facts that seem like they shouldn't both be true.", lsat:"An apparent conflict between two or more statements that are both accepted as true.", think:"Both facts are true. Ask: what extra fact would let them both make sense?", effect:"Creates a puzzle, not an argument. The answer explains, it doesn't pick a side.", easy:"The restaurant is always packed, yet it's going out of business. That's a discrepancy.", lsatEx:"Town residents bought more bikes last year. Yet bike-shop revenue in town fell.", mistake:"Trying to prove one of the facts false. Both facts are true; you need to explain how.", trick:"DISCREPANCY = two facts that don't seem to fit.", confusers:["paradox","inconsistent","resolve"] },
  { id:"paradox", term:"paradox", cat:"lr", aliases:["paradox","paradoxes","paradoxical","paradoxically"], simple:"Something that seems contradictory but can actually make sense.", lsat:"An apparent contradiction; on the LSAT, essentially the same as a discrepancy to be explained.", think:"Don't panic. Look for a hidden fact that makes both sides true at once.", effect:"Signals a resolve or explain task. There is no conclusion to attack.", easy:"He got a busier job but has more free time: the new job ended his two-hour commute.", lsatEx:"Hospitals with the best surgeons report higher death rates. The paradox disappears if those surgeons take the riskiest cases.", mistake:"Thinking a paradox means something is impossible. It only looks impossible until you find the missing piece.", trick:"PARADOX = looks impossible, isn't.", confusers:["discrepancy","inconsistent","explain"] },
  { id:"resolve", term:"resolve", cat:"lr", aliases:["resolve","resolves","resolved","resolving"], simple:"To clear up a confusing situation so it makes sense.", lsat:"To provide information that removes an apparent conflict, showing how both facts can be true together.", think:"Pick the answer that makes me say 'Oh, that's why both are true.'", effect:"Explains both sides of the conflict. Must address both facts, not just one.", easy:"Your friend says she's broke but bought new shoes. She used a gift card. Resolved.", lsatEx:"Umbrella sales rose during a dry year. This is resolved if most umbrellas were bought for shade from the sun.", mistake:"Picking an answer that explains only one side, or that makes the conflict worse.", trick:"RESOLVE = make both facts fit.", confusers:["explain","discrepancy","justify"] },
  { id:"explain", term:"explain", cat:"lr", aliases:["explain","explains","explained","explanation","explanations"], simple:"To give the reason why something happened.", lsat:"To offer a cause or account that makes an observed fact, or an apparent conflict, understandable.", think:"Ask: which answer gives a believable reason this happened?", effect:"Answers 'why.' The right answer accounts for the fact without needing to prove it.", easy:"Your package was late. The snowstorm explains it.", lsatEx:"Fewer birds nested on the island this year. The arrival of a new predator would explain the drop.", mistake:"Choosing an answer that's true but doesn't account for the specific fact.", trick:"EXPLAIN = answers 'why?'", confusers:["resolve","justify","support"] },
  { id:"analogous", term:"analogous", cat:"lr", aliases:["analogous","analogy","analogies"], simple:"Similar in an important way.", lsat:"Having a similar logical structure or relationship, even if the topic is completely different.", think:"Ignore the topic. Ask: is the relationship or reasoning the same?", effect:"Compares structure, not subject. Two analogous cases follow the same pattern.", easy:"Skipping the gym and expecting muscles is analogous to skipping class and expecting an A.", lsatEx:"Banning cars to stop accidents is analogous to banning food to stop choking. Both remove a whole activity to prevent a rare harm.", mistake:"Matching by topic. A case about dogs can be analogous to one about banks.", trick:"ANALOGOUS = same shape, different costume.", confusers:["parallel","most-analogous","consistent"] },
  { id:"parallel", term:"parallel", cat:"lr", aliases:["parallel","parallels","paralleled"], simple:"Following the exact same pattern.", lsat:"Having the same logical structure; parallel reasoning questions ask for the argument whose form matches the stimulus.", think:"Map the structure, like: all A are B, C is A, so C is B. Then find its twin.", effect:"Requires matching form, strength words, and type of conclusion, not content.", easy:"\"I ate, so I'm full\" parallels \"I slept, so I'm rested.\"", lsatEx:"All poets are dreamers, and Kim is a poet, so Kim is a dreamer. That parallels: all cats hunt, Max is a cat, so Max hunts.", mistake:"Picking the answer on the same topic. Match the logic and the certainty level, not the subject.", trick:"PARALLEL = logic twins.", confusers:["analogous","most-analogous","consistent"] },
  { id:"consistent", term:"consistent", cat:"lr", aliases:["consistent","consistency","consistently"], simple:"Able to be true at the same time without conflict.", lsat:"Compatible with the given information; does not contradict it. Says nothing about whether it is proven or likely.", think:"Ask: can this be true without breaking any fact? If yes, it's consistent.", effect:"A very weak standard. Consistent only means 'no contradiction,' not 'supported.'", easy:"\"She's at work\" is consistent with \"Her car is gone from the driveway.\"", lsatEx:"The data show most voters favored the plan. A claim that some voters opposed it is consistent with the data.", mistake:"Thinking consistent means proven or likely. It only means not contradicted.", trick:"CONSISTENT = no clash.", confusers:["compatible","could-be-true","inconsistent"] },
  { id:"inconsistent", term:"inconsistent", cat:"lr", aliases:["inconsistent","inconsistency","inconsistencies"], simple:"Can't both be true at once.", lsat:"Contradicting the given information; the two statements cannot be true together.", think:"Ask: if the passage is true, does this have to be false? Then it's inconsistent.", effect:"Signals contradiction. Inconsistent answers are what 'cannot be true' questions want.", easy:"\"I'm never late\" is inconsistent with \"I was late today.\"", lsatEx:"All the guests left by ten. A claim that one guest stayed until midnight is inconsistent with that.", mistake:"Treating 'unlikely' as inconsistent. Unlikely things can still be consistent with the facts.", trick:"INCONSISTENT = can't share a room.", confusers:["incompatible","cannot-be-true","consistent"] },
  { id:"compatible", term:"compatible", cat:"lr", aliases:["compatible","compatibility"], simple:"Able to exist or be true together without a problem.", lsat:"Able to be true together; not contradictory. Means the same as consistent.", think:"Ask: can both be true at the same time? Nothing more.", effect:"A weak link. It doesn't mean one supports the other, only that they don't clash.", easy:"Working full time is compatible with studying at night.", lsatEx:"The theory is compatible with the new data. That does not mean the data confirm it.", mistake:"Reading compatible as 'supports.' Compatible only rules out conflict.", trick:"COMPATIBLE = can coexist.", confusers:["consistent","incompatible","support"] },
  { id:"incompatible", term:"incompatible", cat:"lr", aliases:["incompatible","incompatibility"], simple:"Can't exist or be true together.", lsat:"Mutually exclusive: if one is true, the other must be false.", think:"If one is true, the other is out. Treat it as a contradiction.", effect:"Sets up a one-or-the-other situation. Never both.", easy:"On her budget, saving for a house is incompatible with buying a new car every year.", lsatEx:"The witness's two statements are incompatible: she says she was home all night and also that she was at the party.", mistake:"Thinking incompatible just means 'different.' Different things can still be compatible.", trick:"INCOMPATIBLE = one kicks the other out.", confusers:["inconsistent","compatible","cannot-be-true"] },
  { id:"relevant", term:"relevant", cat:"lr", aliases:["relevant","relevance"], simple:"Connected to the point and actually matters for it.", lsat:"Bearing on the argument; information that affects whether the conclusion is supported.", think:"Ask: does this actually affect the conclusion? If not, ignore it.", effect:"Relevant info can change the argument's strength; irrelevant info cannot.", easy:"When choosing a car, gas mileage is relevant. The salesperson's shirt color isn't.", lsatEx:"To judge whether the drug works, it is relevant whether patients also took other medicine.", mistake:"Thinking anything on the same topic is relevant. It must affect the reasoning.", trick:"RELEVANT = it changes something.", confusers:["irrelevant","scope","support"] },
  { id:"irrelevant", term:"irrelevant", cat:"lr", aliases:["irrelevant","irrelevance"], simple:"Doesn't matter to the point being made.", lsat:"Having no bearing on whether the conclusion follows; outside the argument's scope.", think:"Ask: if this were true or false, would the conclusion change? If not, it's irrelevant.", effect:"Has zero effect on the argument. A very common trap answer.", easy:"Your date's favorite color is irrelevant to whether they'll show up on time.", lsatEx:"The argument is about whether the bridge is safe. How much the bridge cost to build is irrelevant.", mistake:"Picking an answer because it's on the topic, even though it doesn't touch the logic.", trick:"IRRELEVANT = changes nothing.", confusers:["relevant","scope","inconsistent"] },
  { id:"necessary", term:"necessary", cat:"lr", aliases:["necessary","necessary condition","required","requires","require"], simple:"Required. Without it, the result can't happen.", lsat:"A necessary condition must be present for the outcome; if it's missing, the outcome fails. It alone does not guarantee the outcome.", think:"Ask: is this required? If it's missing, does the result fail?", effect:"Required but not enough. It doesn't guarantee the result; it only blocks the result when absent.", easy:"A ticket is necessary to board the plane. But a ticket alone won't get you on.", lsatEx:"A license is necessary to practice law. So anyone practicing law has a license.", mistake:"Thinking necessary means enough. A necessary condition can be met and the result still not happen.", trick:"NECESSARY = need it, but not enough alone.", confusers:["sufficient","only-if","necessary-assumption"] },
  { id:"sufficient", term:"sufficient", cat:"lr", aliases:["sufficient","sufficient condition","sufficiently","suffices"], simple:"Enough by itself to make something happen.", lsat:"A sufficient condition guarantees the outcome: if it occurs, the result must follow. It need not be required.", think:"Ask: if this happens, is the result guaranteed? Then it's sufficient.", effect:"Guarantees the result, but the result could also happen in other ways.", easy:"Winning the lottery is sufficient to pay your rent. It's not necessary, though.", lsatEx:"If a student scores 100, she passes. Scoring 100 is sufficient, but students with lower scores may pass too.", mistake:"Assuming a sufficient condition is the only way. Other things can also bring about the result.", trick:"SUFFICIENT = enough to guarantee.", confusers:["necessary","if","sufficient-assumption"] },
  { id:"necessary-assumption", term:"necessary assumption", cat:"lr", aliases:["necessary assumption","necessary assumptions"], simple:"Something the argument needs to be true, or it falls apart.", lsat:"An unstated premise that must be true for the argument to work; if you negate it, the argument collapses.", think:"Negate the answer. If the argument falls apart, it's the necessary assumption.", effect:"Required by the argument, but adding it doesn't have to prove the conclusion.", easy:"\"I'll drive to work today.\" Necessary assumption: the car will start.", lsatEx:"Jo will finish the report today since she has no meetings. This requires that nothing else will take up her day.", mistake:"Picking an answer that's too strong. A necessary assumption is usually modest, just what's required.", trick:"NECESSARY ASSUMPTION = negate it, argument dies.", confusers:["sufficient-assumption","assumption","assumption-required"] },
  { id:"sufficient-assumption", term:"sufficient assumption", cat:"lr", aliases:["sufficient assumption","sufficient assumptions"], simple:"A missing fact that, if added, makes the conclusion fully proven.", lsat:"A premise that, added to the stated premises, guarantees the conclusion follows logically.", think:"Ask: if I add this, is the conclusion 100% locked in?", effect:"Guarantees the conclusion. Often stronger than needed, and that's fine.", easy:"\"She'll love this gift.\" Sufficient assumption: she loves everything from this store.", lsatEx:"Every member voted for the motion, so it passed. This is guaranteed if any motion with every member's vote passes.", mistake:"Rejecting an answer for being too strong. Strong is fine here, as long as it guarantees the conclusion.", trick:"SUFFICIENT ASSUMPTION = add it, conclusion locks.", confusers:["necessary-assumption","justify","enables-the-conclusion-to-be-properly-drawn"] },
  { id:"intermediate-conclusion", term:"intermediate conclusion", cat:"lr", aliases:["intermediate conclusion","subsidiary conclusion","sub-conclusion"], simple:"A middle point that's proven first, then used to prove the main point.", lsat:"A claim supported by premises that in turn supports the main conclusion; also called a subsidiary conclusion.", think:"Ask: is this claim supported AND used to support something else? Then it's intermediate.", effect:"Plays two roles: the conclusion of one step and a premise for the next.", easy:"\"The store's closed, so we can't get milk, so no cereal tonight.\" 'We can't get milk' is intermediate.", lsatEx:"The bridge's supports are cracked, so the bridge is unsafe. Thus, the town must build a detour.", mistake:"Calling it the main conclusion. Check which claim everything ultimately points to.", trick:"INTERMEDIATE = a stepping stone.", confusers:["conclusion","premise","role-played-in-the-argument"] },
  { id:"scope", term:"scope", cat:"lr", aliases:["scope","out of scope","outside the scope"], simple:"The exact topic and limits of what the argument talks about.", lsat:"The boundaries of an argument's subject; answers outside the scope bring in matters the argument doesn't address.", think:"Ask: does this answer stay inside what the argument is about? If not, cut it.", effect:"Answers that drift to a new group, time, or topic are usually wrong.", easy:"If your friend asks about dinner tonight, talking about next year's vacation is out of scope.", lsatEx:"The study concerns adult smokers. An answer about teenage smokers is outside the argument's scope.", mistake:"Picking an answer that's related but quietly shifts the group, time, or claim.", trick:"SCOPE = stay inside the fence.", confusers:["relevant","irrelevant","qualified"] },
  { id:"conditional", term:"conditional", cat:"lr", aliases:["conditional","conditionals","contrapositive"], simple:"An if-then statement: if one thing happens, another must happen.", lsat:"A statement that a sufficient condition guarantees a necessary one (if A, then B). Valid contrapositive: if not B, then not A.", think:"Write it as 'if A, then B.' To flip it, also negate both sides. Never just reverse it.", effect:"Creates a one-way guarantee. Reversing it, or negating without flipping, is a classic flaw.", easy:"If it's raining, I bring an umbrella. No umbrella means it's not raining.", lsatEx:"If the shipment arrives, the store will open. The store did not open, so the shipment did not arrive.", mistake:"Reversing it: assuming 'if A then B' also means 'if B then A.'", trick:"CONDITIONAL = if-then, one-way street.", confusers:["sufficient","necessary","if"] },
  { id:"causal", term:"causal", cat:"lr", aliases:["causal","causally","causal claim"], simple:"About one thing making another thing happen.", lsat:"A causal claim says one factor produces another. It is open to other causes, reversed cause, and coincidence.", think:"Ask: could something else cause it, could it be backwards, or is it just coincidence?", effect:"Causal conclusions are easy to weaken: show another cause, or the effect without the cause.", easy:"\"The new manager made the team happier.\" That's a causal claim.", lsatEx:"Test scores rose after the school added recess. The principal concludes that recess caused the rise.", mistake:"Accepting a cause just because two things happened together or one after another.", trick:"CAUSAL = 'made it happen.'", confusers:["causation","correlation","conditional"] },
  { id:"counterexample", term:"counterexample", cat:"lr", aliases:["counterexample","counterexamples","exception","exceptions"], simple:"One case that proves a general rule wrong.", lsat:"A specific case that contradicts a general claim; one counterexample defeats an 'all,' 'always,' or 'never' claim.", think:"For 'all' or 'never' claims, ask: can I find one exception?", effect:"Destroys an absolute claim, but barely affects a 'most' or 'usually' claim.", easy:"\"Nobody likes this song.\" Your sister loves it. She's a counterexample.", lsatEx:"The critic says no mystery novel has ever won the prize. The 1990 award to a mystery novel is a counterexample.", mistake:"Thinking one exception disproves a 'most' or 'usually' claim. It doesn't.", trick:"COUNTEREXAMPLE = the one that breaks the rule.", confusers:["not-all","weaken","evidence"] },

  { id:"must", term:"must", cat:"strength", level:100, polarity:"positive", aliases:["must"], simple:"Has to be true. No exceptions.", lsat:"Indicates 100% certainty; the statement is guaranteed true in every case.", think:"Is this guaranteed, every single time? If any exception is possible, it's not a must.", effect:"Maximum certainty: 100%. Needs airtight support, and one exception breaks it.", easy:"You must have a passport to fly to another country.", lsatEx:"All the eggs in the carton are cracked. So the egg Sam took from the carton must be cracked.", mistake:"Treating 'must' answers as 'very likely.' Must means proven, not probable.", trick:"MUST = 100%, zero wiggle room.", confusers:["could","probably","necessarily"] },
  { id:"could", term:"could", cat:"strength", level:5, polarity:"positive", aliases:["could"], simple:"Possible. It isn't ruled out.", lsat:"Indicates mere possibility; true as long as the statement is not contradicted, even if very unlikely.", think:"Ask: is there any way this could be true? If nothing rules it out, yes.", effect:"A very weak claim. Needs only to be possible, even a 1% chance.", easy:"It could rain today, even though the sky looks clear.", lsatEx:"Some students failed the test. Maria could be one of them.", mistake:"Treating 'could' like 'probably.' Could just means not impossible.", trick:"COULD = possible, even 1%.", confusers:["must","probably","might"] },
  { id:"may", term:"may", cat:"strength", level:5, polarity:"positive", aliases:["may"], simple:"Possibly true, or allowed.", lsat:"Expresses possibility (it may be true) or permission (one may do it). Either way, not certainty or obligation.", think:"Read it as 'it's possible' or 'it's allowed.' Never as a guarantee.", effect:"Weak claim: possibility only. In rules, 'may' grants permission, not a requirement.", easy:"Kids may have dessert after dinner. Allowed, not required.", lsatEx:"Employees may work from home on Fridays. That doesn't show any employee actually does.", mistake:"Treating 'may' as 'must' or 'will.' Permission isn't obligation.", trick:"MAY = maybe, or allowed.", confusers:["might","must","could"] },
  { id:"might", term:"might", cat:"strength", level:5, polarity:"positive", aliases:["might"], simple:"Possibly true; there's a chance.", lsat:"Expresses possibility; a weak claim that the statement is not ruled out.", think:"Possible, nothing more. Don't upgrade it to likely.", effect:"Very weak. A 'might' conclusion is easy to support and hard to weaken.", easy:"She might come to the party, but don't count on it.", lsatEx:"The new drug might reduce headaches. Even one small study could support that modest claim.", mistake:"Thinking a 'might' claim needs strong proof. It needs very little support.", trick:"MIGHT = maybe, maybe not.", confusers:["may","probably","could"] },
  { id:"probably", term:"probably", cat:"strength", level:60, polarity:"positive", aliases:["probably","probable","probability"], simple:"More likely to be true than not.", lsat:"More likely than not: greater than 50% probability, but not certain.", think:"Is it better than a coin flip? That's all 'probably' needs.", effect:"Moderate claim: over 50%. Stronger than 'could,' weaker than 'must.'", easy:"With traffic like this, we'll probably be late.", lsatEx:"Most of the town's residents own boats. So a randomly chosen resident probably owns a boat.", mistake:"Treating 'probably' as certain, or as merely possible. It means over 50%.", trick:"PROBABLY = better than a coin flip.", confusers:["likely","must","could"] },
  { id:"likely", term:"likely", cat:"strength", level:60, polarity:"positive", aliases:["likely","more likely","most likely","likelihood"], simple:"Probably going to happen; more likely than not.", lsat:"More than 50% probability; the same strength as 'probably.'", think:"Over 50%, not guaranteed. Is the support enough for better-than-even odds?", effect:"Moderate certainty: over half. Easier to support than 'must.'", easy:"If you text him at midnight, he's likely asleep.", lsatEx:"Plants given more sunlight usually grow taller. So this plant is likely to grow taller in the sunny window.", mistake:"Confusing 'likely' with 'certainly.' Likely leaves room for being wrong.", trick:"LIKELY = more than half.", confusers:["probably","unlikely","possibly"] },
  { id:"unlikely", term:"unlikely", cat:"strength", level:60, polarity:"negative", aliases:["unlikely","improbable"], simple:"Probably won't happen, but it could.", lsat:"Less than 50% probability; not impossible.", think:"Probably not, but possible. Don't treat it as 'cannot.'", effect:"Moderate negative claim: under 50% chance, but still possible.", easy:"It's unlikely your ex will call, but it could happen.", lsatEx:"Few applicants met the requirements, so it is unlikely that Ray did. He still could have.", mistake:"Reading 'unlikely' as 'impossible.' Unlikely things are still consistent with the facts.", trick:"UNLIKELY = probably not, not never.", confusers:["likely","never","rarely"] },
  { id:"generally", term:"generally", cat:"strength", level:75, polarity:"positive", aliases:["generally","in general","as a rule"], simple:"Most of the time, but not always.", lsat:"True in most cases; allows exceptions.", think:"Most of the time. Expect exceptions and don't treat it as 'always.'", effect:"A majority claim with built-in exceptions. One counterexample doesn't disprove it.", easy:"I generally eat lunch at noon, but not on Fridays.", lsatEx:"Generally, larger stores charge lower prices. That doesn't mean this particular large store does.", mistake:"Treating 'generally' as 'always' and drawing a certain conclusion about one case.", trick:"GENERALLY = most of the time.", confusers:["usually","always","typically"] },
  { id:"typically", term:"typically", cat:"strength", level:75, polarity:"positive", aliases:["typically","typical"], simple:"In the normal case; most of the time.", lsat:"Describes the usual pattern; true in most cases but not all.", think:"That's the normal pattern, not a rule. Exceptions exist.", effect:"A majority claim. Can't support a 'must' about one specific case.", easy:"Our team typically meets on Mondays.", lsatEx:"Birds typically migrate south in the fall. The geese on this island do not.", mistake:"Concluding that a particular case must fit the typical pattern.", trick:"TYPICALLY = the normal pattern.", confusers:["usually","generally","always"] },
  { id:"usually", term:"usually", cat:"strength", level:75, polarity:"positive", aliases:["usually","usual"], simple:"Most of the time.", lsat:"In most cases; more often than not, but with exceptions.", think:"More often than not. Never treat it as 'every time.'", effect:"Majority strength. Supports 'probably,' not 'must.'", easy:"He usually pays for dinner, but tonight she did.", lsatEx:"The train usually arrives on time. So it will probably be on time today, though that isn't guaranteed.", mistake:"Turning 'usually' into 'always' when drawing a conclusion.", trick:"USUALLY = most times, not all.", confusers:["always","generally","sometimes"] },
  { id:"sometimes", term:"sometimes", cat:"strength", level:10, polarity:"positive", aliases:["sometimes","at times","occasionally"], simple:"At least once in a while.", lsat:"On at least one occasion; says nothing about how often, and does not guarantee it happens in any given case.", think:"At least once. Don't assume it means often.", effect:"A weak claim, like 'some.' Only proves it happens at least once.", easy:"I sometimes order takeout.", lsatEx:"Medicine sometimes causes rashes. So it is possible this patient's rash came from her medicine.", mistake:"Assuming 'sometimes' means 'often.' It only promises at least once.", trick:"SOMETIMES = at least once.", confusers:["some","usually","rarely"] },
  { id:"rarely", term:"rarely", cat:"strength", level:80, polarity:"negative", aliases:["rarely","rare","seldom"], simple:"Not often, but it does happen.", lsat:"Seldom; occurs infrequently, but not never.", think:"It happens, just not much. Don't treat it as never.", effect:"A fairly strong negative, but it still allows that it happens. Not the same as never.", easy:"My dad rarely cooks, but he makes pancakes on birthdays.", lsatEx:"Lightning rarely strikes this valley. So a strike here is unlikely, but possible.", mistake:"Treating 'rarely' as 'never.' Rarely means it does happen sometimes.", trick:"RARELY = seldom, not zero.", confusers:["never","few","unlikely"] },
  { id:"always", term:"always", cat:"strength", level:100, polarity:"positive", aliases:["always","invariably"], simple:"Every single time, no exceptions.", lsat:"In all cases without exception; a 100% claim.", think:"Every time? One exception kills it.", effect:"Absolute: 100%. Hard to prove and easy to weaken with a single counterexample.", easy:"She always replies within an hour.", lsatEx:"The critic claims the director always casts unknown actors. One famous lead actor disproves that.", mistake:"Accepting an 'always' answer when the passage only says 'usually.'", trick:"ALWAYS = every time, zero exceptions.", confusers:["usually","never","must"] },
  { id:"never", term:"never", cat:"strength", level:100, polarity:"negative", aliases:["never"], simple:"Not even once. Zero times.", lsat:"At no time; an absolute negative, a 100% claim that something does not happen.", think:"Not once, ever? One exception destroys it.", effect:"Absolute negative. As strong as 'always,' just in the opposite direction.", easy:"He never forgets her birthday.", lsatEx:"The critic says the bakery never sells out. One sold-out Saturday proves the claim false.", mistake:"Treating 'never' as 'rarely.' Never allows zero exceptions.", trick:"NEVER = zero, not even once.", confusers:["rarely","always","none"] },
  { id:"necessarily", term:"necessarily", cat:"strength", level:100, polarity:"positive", aliases:["necessarily","not necessarily"], simple:"Has to be true; guaranteed.", lsat:"Required by logic; 100% certain. 'Not necessarily' means it may or may not be true.", think:"Is it forced by the facts? 'Not necessarily' only means it isn't guaranteed.", effect:"Maximum certainty. 'Not necessarily' removes the guarantee but doesn't make it false.", easy:"Expensive doesn't necessarily mean good.", lsatEx:"Every winner trained daily. But training daily does not necessarily make someone a winner.", mistake:"Reading 'not necessarily true' as 'false.' It means it might be true or might be false.", trick:"NECESSARILY = forced. Not necessarily = maybe.", confusers:["must","certainly","possibly"] },
  { id:"possibly", term:"possibly", cat:"strength", level:5, polarity:"positive", aliases:["possibly","possible","possibility"], simple:"Maybe; it's not impossible.", lsat:"Expresses possibility; the statement is not ruled out.", think:"Can it happen at all? That's the only question.", effect:"The weakest positive claim. Needs only to be possible.", easy:"We could possibly afford a vacation this year.", lsatEx:"The fossil is possibly older than the others. Nothing in the data rules it out.", mistake:"Treating 'possibly' as 'probably.'", trick:"POSSIBLY = not impossible.", confusers:["probably","necessarily","could"] },
  { id:"certainly", term:"certainly", cat:"strength", level:100, polarity:"positive", aliases:["certainly","certain","certainty","definitely"], simple:"Definitely true; no doubt.", lsat:"100% certain, with no exceptions or doubt.", think:"No doubt at all? That needs proof, not just good evidence.", effect:"Absolute certainty, the same strength as 'must.'", easy:"If you don't pay the bill, the lights will certainly get shut off.", lsatEx:"Every document in the office was shredded. Certainly, then, the contract in the office was shredded too.", mistake:"Accepting 'certainly' when the passage only shows something is likely.", trick:"CERTAINLY = 100% sure.", confusers:["probably","must","likely"] },
  { id:"virtually", term:"virtually", cat:"strength", level:95, polarity:"positive", aliases:["virtually","almost all","nearly all","almost"], simple:"Almost completely; nearly.", lsat:"Almost entirely; very close to all, but not necessarily all.", think:"Almost all. There may be a few exceptions.", effect:"Very strong, about 95%, but leaves room for a few exceptions. Not the same as 'all.'", easy:"Virtually everyone at work uses the new app.", lsatEx:"Virtually all the town's wells are polluted. So most residents probably lack clean well water.", mistake:"Treating 'virtually all' as 'all.' A few exceptions are allowed.", trick:"VIRTUALLY = almost, not all.", confusers:["all","most","primarily"] },
  { id:"primarily", term:"primarily", cat:"strength", level:70, polarity:"positive", aliases:["primarily","primary","mainly","chiefly"], simple:"Mainly; mostly.", lsat:"Chiefly; the largest or main part, though not the only one.", think:"Mainly, not only. Other factors still exist.", effect:"Says one thing is the biggest share. Doesn't exclude others.", easy:"She's primarily a nurse, but she also teaches.", lsatEx:"The fish decline is primarily due to overfishing. Pollution played a smaller role.", mistake:"Reading 'primarily' as 'only.'", trick:"PRIMARILY = the main thing, not the only thing.", confusers:["predominantly","most","virtually"] },
  { id:"predominantly", term:"predominantly", cat:"strength", level:70, polarity:"positive", aliases:["predominantly","predominant","predominate","predominates"], simple:"Mostly; the main part.", lsat:"Mainly; making up the largest or dominant share.", think:"The biggest part, not all. Leave room for others.", effect:"A majority or dominant share. Weaker than 'all.'", easy:"The crowd was predominantly college students.", lsatEx:"The forest is predominantly pine. A few oak trees grow near the river.", mistake:"Treating 'predominantly' as 'entirely.'", trick:"PREDOMINANTLY = dominant share.", confusers:["primarily","most","all"] },
  { id:"all", term:"all", cat:"strength", level:100, polarity:"positive", aliases:["all","every","each"], simple:"Every single one. No exceptions.", lsat:"100% of the group, no exceptions. Works like a conditional: if something is in the group, it has the trait.", think:"Turn it into if-then: if X, then Y. One exception breaks it.", effect:"Maximum quantity: 100%. Creates a conditional you can chain with other rules.", easy:"All my friends are coming to the party.", lsatEx:"All the chefs at the restaurant trained in Paris. Lee is a chef there, so Lee trained in Paris.", mistake:"Reversing it: 'all chefs trained in Paris' doesn't mean everyone who trained in Paris is a chef.", trick:"ALL = 100%, if-then.", confusers:["most","virtually","some"] },
  { id:"most", term:"most", cat:"strength", level:55, polarity:"positive", aliases:["most","majority","more than half"], simple:"More than half. Could even be all.", lsat:"More than 50% of the group; in strict logic, it could be all.", think:"Over half. Don't assume it means 'not all.'", effect:"A majority claim: over 50%. Two 'most' claims about the same group must overlap.", easy:"Most of my coworkers drink coffee.", lsatEx:"Most residents voted, and most residents own cars. So at least one resident who voted owns a car.", mistake:"Thinking 'most' means 'not all,' or that it means nearly all. It just means over half.", trick:"MOST = 51% up to 100%.", confusers:["many","all","some"] },
  { id:"many", term:"many", cat:"strength", level:30, polarity:"positive", aliases:["many","numerous","a lot of"], simple:"A lot, but not necessarily most.", lsat:"A large number, but no percentage is guaranteed; in strict logic, treat it like 'some.'", think:"Treat it like 'some.' Don't assume it means most.", effect:"A weak quantity claim. Proves existence, not a majority.", easy:"Many people bought the new phone, but most people didn't.", lsatEx:"Many voters dislike the tax. That doesn't show that most voters dislike it.", mistake:"Treating 'many' as 'most.' Many can still be a minority.", trick:"MANY = lots, not most.", confusers:["most","some","few"] },
  { id:"some", term:"some", cat:"strength", level:5, polarity:"positive", aliases:["some","at least one"], simple:"At least one. Could be all.", lsat:"At least one; any number from one up to all.", think:"At least one. Don't assume 'not all.'", effect:"A weak quantity claim. Proves existence only.", easy:"Some of the cookies are gone. Maybe all of them are.", lsatEx:"Some doctors at the clinic speak Spanish. So it's possible all of them do.", mistake:"Assuming 'some' means 'not all' or 'only a few.'", trick:"SOME = at least one, maybe all.", confusers:["many","most","few"] },
  { id:"few", term:"few", cat:"strength", level:70, polarity:"negative", aliases:["few","a few","very few"], simple:"A small number. Not many, but usually more than zero.", lsat:"A small number; on the LSAT, typically means some, but not many. It stresses how small the group is.", think:"Some exist, but not many. Don't treat it as none.", effect:"A low-quantity claim. Usually implies at least one exists, but only a small share.", easy:"Few people showed up to the meeting.", lsatEx:"Few critics praised the film. So at least one critic praised it, but not many did.", mistake:"Reading 'few' as 'none.' Few usually means at least some.", trick:"FEW = some, but not many.", confusers:["some","many","none"] },
  { id:"none", term:"none", cat:"strength", level:100, polarity:"negative", aliases:["none","no one","nobody","nothing"], simple:"Zero. Not a single one.", lsat:"0% of the group. Works like a conditional: if something is in the group, it does not have the trait.", think:"Turn it into: if X, then not Y. Zero exceptions.", effect:"An absolute negative claim. One counterexample breaks it.", easy:"None of the leftovers are still good.", lsatEx:"None of the club members smoke. Pat smokes, so Pat is not a member.", mistake:"Treating 'none' as 'hardly any.'", trick:"NONE = zero.", confusers:["never","few","not-all"] },
  { id:"not-all", term:"not all", cat:"strength", level:5, polarity:"negative", aliases:["not all","not every"], simple:"At least one is missing. Could even be none at all.", lsat:"At least one member of the group lacks the trait; consistent with none of them having it.", think:"At least one exception. Don't assume most have it.", effect:"A weak negative claim: just one exception. Means the same as 'some are not.'", easy:"Not all the bills are paid. Maybe just one is late.", lsatEx:"Not all of the paintings are originals. So at least one painting is not an original.", mistake:"Reading 'not all' as 'most are,' or as 'none are.' It just means at least one isn't.", trick:"NOT ALL = at least one exception.", confusers:["none","some","all"] },

  { id:"must-be-true", term:"must be true", cat:"stem", aliases:["must be true","must also be true"], simple:"Find the answer the passage proves.", lsat:"Choose the answer that is 100% guaranteed by the stimulus, with no outside assumptions.", think:"Can I point to the line that proves this? If not, cross it off.", effect:"The strictest standard: the right answer is fully proven.", easy:"Your receipt says $30. 'You spent money' must be true.", lsatEx:"All the interns are paid, and Kai is an intern. So it must be true that Kai is paid.", mistake:"Picking an answer that's likely or sounds sensible but isn't proven.", trick:"MUST BE TRUE = prove it with the text.", confusers:["most-strongly-supported","could-be-true","properly-inferred"] },
  { id:"could-be-true", term:"could be true", cat:"stem", aliases:["could be true","could also be true"], simple:"Find the answer that's possible based on the passage.", lsat:"Choose the answer that is not contradicted by the stimulus; it needs only to be possible.", think:"Does anything rule it out? If not, it could be true.", effect:"A very low bar. The four wrong answers are impossible; the right one just survives.", easy:"She said she's busy Saturday. 'She's free Sunday' could be true.", lsatEx:"Every guest at the party wore blue. Could be true: some guests also wore hats.", mistake:"Rejecting an answer because it isn't proven. It only needs to be possible.", trick:"COULD BE TRUE = not ruled out.", confusers:["must-be-true","cannot-be-true","consistent"] },
  { id:"cannot-be-true", term:"cannot be true", cat:"stem", aliases:["cannot be true","could not be true","must be false"], simple:"Find the answer the passage proves wrong.", lsat:"Choose the answer contradicted by the stimulus; it must be false if the passage is true.", think:"Find the answer that clashes directly with the facts.", effect:"The right answer is impossible. Unlikely or unsupported answers aren't enough.", easy:"He's allergic to all nuts. 'He ate almonds with no reaction' cannot be true.", lsatEx:"No store in the mall opens before ten. Cannot be true: the bakery in the mall opens at eight.", mistake:"Picking an answer that's just unsupported or unlikely. It must be contradicted.", trick:"CANNOT BE TRUE = the passage proves it false.", confusers:["could-be-true","inconsistent","must-be-true"] },
  { id:"most-strongly-supported", term:"most strongly supported", cat:"stem", aliases:["most strongly supported","strongly supported","most strongly support","best supported"], simple:"Find the answer the passage backs up best.", lsat:"Choose the answer best supported by the stimulus. It need not be 100% proven, but must be well backed by the text.", think:"Which answer has the most backing in the text? Prefer modest, careful answers.", effect:"A slightly lower bar than must be true, but outside info is still not allowed.", easy:"He bought flowers and made a dinner reservation. Most strongly supported: he's planning a date.", lsatEx:"In three studies, patients who slept more healed faster. Most strongly supported: more sleep may help healing.", mistake:"Picking a bold, extreme answer. The best-supported answer is usually cautious.", trick:"MOST STRONGLY SUPPORTED = best backed, not proven.", confusers:["must-be-true","properly-inferred","most-strengthens"] },
  { id:"properly-inferred", term:"properly inferred", cat:"stem", aliases:["properly inferred","properly be inferred","can be inferred"], simple:"Find the answer that has to be true from the passage.", lsat:"Choose the answer logically guaranteed by the stimulus; the same standard as must be true.", think:"Same as must be true. Find the proof in the text.", effect:"A 100% standard. No outside assumptions allowed.", easy:"The store closes at 9 and it's now 10. Properly inferred: the store has closed.", lsatEx:"Only licensed drivers may rent cars here, and Sam rented one. It can be properly inferred that Sam is licensed.", mistake:"Accepting a reasonable guess. 'Properly' means logically guaranteed.", trick:"PROPERLY INFERRED = must be true in disguise.", confusers:["must-be-true","logically-follows","most-strongly-supported"] },
  { id:"logically-follows", term:"logically follows", cat:"stem", aliases:["logically follows","follows logically","logically follow"], simple:"The answer comes out of the passage for sure.", lsat:"The statement is guaranteed by the premises: if the premises are true, it must be true.", think:"If the facts are true, is this forced? Then it follows.", effect:"A 100% standard, like must be true.", easy:"If every one of your shirts is in the wash, it logically follows that none are in your closet.", lsatEx:"Every member paid dues. Ari is a member. It logically follows that Ari paid dues.", mistake:"Thinking it follows because it seems natural. It must be guaranteed.", trick:"LOGICALLY FOLLOWS = forced by the facts.", confusers:["properly-inferred","must-be-true","most-strongly-supported"] },
