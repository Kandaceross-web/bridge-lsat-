"theoretical": { kid:"Based on ideas, not tested yet.", does:"Describes an idea worked out in thought, not checked in real life.", whyThere:"To mark that something is an idea that still needs testing.", connects:"An idea and the testing it has not yet had.", human:"On paper, your new budget saves you two hundred dollars a month. You haven't tried it yet. How solid is that savings?" },
"correlation": { kid:"Two things that tend to happen together.", does:"Notes that two things show up together, without proving one causes the other.", whyThere:"People often wrongly treat 'together' as 'one caused the other.'", connects:"Two things that happen together.", human:"Ice cream sales and sunburns both rise in summer. Does ice cream cause sunburns, or do they just show up together?" },
"causation": { kid:"One thing makes another thing happen.", does:"Claims one thing actually produces another.", whyThere:"Knowing causes lets us change outcomes.", connects:"A cause and its effect.", human:"You flip the switch and the light turns on, every time. Is that just a coincidence, or is one making the other happen?" },
"substantiate": { kid:"To back up a claim with proof.", does:"Provides evidence that a claim is true.", whyThere:"Claims need proof to be taken seriously.", connects:"The claim and the proof offered for it.", human:"Your coworker says she brought in the biggest client. Then she shows the signed contract. What did the contract do for her claim?" },
"infer": { kid:"To figure something out from clues.", does:"Draws a conclusion from facts that were given.", whyThere:"Readers and listeners work out what the facts point to.", connects:"The clues and the conclusion drawn from them.", human:"You come home and see muddy paw prints on the couch. You haven't seen the dog do it. What do you work out?" },
"imply": { kid:"To hint at something without saying it.", does:"Suggests an idea without stating it directly.", whyThere:"Speakers often hint so they don't have to say it outright.", connects:"The speaker's words and the hidden message.", human:"Your boss says, 'I noticed you left at three yesterday.' She didn't say you were in trouble. What might she be hinting?" },
"qualified": { kid:"Limited. Not all the way.", does:"Describes a claim that is softened or limited.", whyThere:"Careful authors limit claims so they are easier to defend.", connects:"The claim and the limits put on it.", human:"Your friend says, 'I mostly agree with you, at least about the price.' Is that full agreement, or agreement with limits?" },
"tentative": { kid:"Not final. Still unsure.", does:"Describes a view held loosely, open to change.", whyThere:"To show the author is cautious, not fully committed.", connects:"The view and how firmly it is held.", human:"Your friend says, 'I think I'll take the job, but I'm not sure yet.' How firm is her decision?" },
"claim": { kid:"Something a person says is true.", does:"States something as true, which may or may not be backed up.", whyThere:"Every argument is built out of statements people say are true.", connects:"The reasons for it, or the argument it belongs to.", human:"Your neighbor says, 'This is the best pizza place in town.' Has she proven it, or just said it?" },
"author": { kid:"The person who wrote it.", does:"Is the writer whose views and attitude you must track.", whyThere:"Questions often ask what the writer thinks, not what others think.", connects:"The views in the passage that the writer holds.", human:"An article quotes three experts who disagree, then ends with the writer's own take. Whose opinion is the article really pushing?" },
"accordingly": { kid:"So. Because of that.", does:"Introduces a point or action that follows from what came before.", whyThere:"To signal a conclusion or a fitting response.", connects:"Before it: reasons. After it: the conclusion.", human:"'The store is closing early today. Accordingly, shop before five.' What is the speaker telling you to do, and why?" },
"clearly": { kid:"It's obvious, they say.", does:"Signals the speaker thinks the point is obvious, often the conclusion.", whyThere:"To make a point sound beyond question, even when it isn't.", connects:"After it: often the conclusion. Check that reasons really back it.", human:"'Clearly, the new manager is the problem,' your coworker says after one bad week. Is it really that obvious?" },
"it-follows-that": { kid:"So this must come next.", does:"Introduces a point drawn from the reasons before it.", whyThere:"To show the speaker is moving from reasons to a conclusion.", connects:"Before it: reasons. After it: the conclusion.", human:"'All the tickets are sold. It follows that we can't get in.' What led to not getting in?" },
"this-shows-that": { kid:"This proves something.", does:"Introduces what the speaker thinks the facts before it prove.", whyThere:"To turn a fact into a point.", connects:"Before it: evidence. After it: the conclusion.", human:"'Sales doubled after the price cut. This shows that customers care about price.' What is the point drawn from the sales?" },
"we-can-conclude-that": { kid:"So here's our answer.", does:"Introduces the point drawn from the reasons given.", whyThere:"To announce the main point directly.", connects:"Before it: reasons. After it: the conclusion.", human:"'Nobody was home and the door was locked. We can conclude that no one broke in.' What point is being drawn?" },
"for-this-reason": { kid:"Because of that.", does:"Introduces a point or action that comes from the reason before it.", whyThere:"To link a reason to its result or conclusion.", connects:"Before it: a reason. After it: the conclusion.", human:"'The bridge is old and cracked. For this reason, it should be closed.' What is the speaker arguing for?" },
"as-a-result": { kid:"Because of that, this happened.", does:"Introduces an effect or a conclusion that comes from what came before.", whyThere:"To show one thing led to another.", connects:"Before it: a cause or reason. After it: a result or conclusion.", human:"'The power went out. As a result, the food spoiled.' Which part happened because of the other?" },
"which-means-that": { kid:"So this is what it tells us.", does:"Introduces a point drawn from the fact just stated.", whyThere:"To spell out what a fact leads to.", connects:"Before it: a fact or reason. After it: the conclusion.", human:"'The gas light just came on, which means we need to stop soon.' What point is drawn from the gas light?" },
"we-should-conclude": { kid:"Here's what we ought to believe.", does:"Introduces the main point the speaker wants you to accept.", whyThere:"To state the conclusion directly and firmly.", connects:"Before it: reasons. After it: the conclusion.", human:"'Three studies found no link. We should conclude the drug is safe.' What is the speaker asking you to accept?" },
"it-can-be-inferred-that": { kid:"You can figure out that...", does:"Introduces something that follows from the facts given.", whyThere:"To show what the facts point to, beyond what was said.", connects:"Before it: facts. After it: what they lead to.", human:"'Every student passed, and Lisa is a student. It can be inferred that Lisa passed.' Where did that come from?" }
};

const S1_INTENT = [
  { id:"in01", kind:"mc", level:1, text:"'The coffee shop on Main Street opens at 7 a.m.'", q:"What is this person trying to do?", opts:["Trying to convince you to go to the coffee shop","Just reporting a fact","Criticizing the coffee shop"], answer:1, why:"They are only telling you the opening time. Nothing in it pushes you to believe or do anything." },
  { id:"in02", kind:"mc", level:1, text:"'You have to try the mushroom pasta here. It's the best thing on the menu.'", q:"What is this person trying to do?", opts:["Recommending something","Explaining why something happened","Comparing two restaurants"], answer:0, why:"'You have to try' is a recommendation. They want you to order the pasta." },
  { id:"in03", kind:"mc", level:1, text:"'It's supposed to storm all weekend, so the soccer tournament will probably be postponed.'", q:"What is this person trying to do?", opts:["Giving an example","Disagreeing with someone","Making a prediction"], answer:2, why:"'Will probably be postponed' is a guess about what will happen later. That is a prediction." },
  { id:"in04", kind:"mc", level:1, text:"'The dog chewed up the couch because we left him alone all day with nothing to do.'", q:"What is this person trying to do?", opts:["Recommending something","Explaining why something happened","Just reporting a fact"], answer:1, why:"The couch is already chewed. The speaker is telling you the cause, which is explaining why it happened." },
  { id:"in05", kind:"mc", level:1, text:"'My sister says that movie was amazing, but honestly I found it boring and way too long.'", q:"What is this person trying to do?", opts:["Comparing two things","Making a prediction","Disagreeing with someone","Giving an example"], answer:2, why:"The sister said one thing and the speaker says the opposite. That is disagreeing." },
  { id:"in06", kind:"mc", level:1, text:"'Our team turned in the project two days before the deadline.'", q:"What is this person trying to do?", opts:["Trying to convince you the team is the best in the company","Criticizing the deadline","Just reporting a fact"], answer:2, why:"They simply state what happened. They do not argue that the team is great or that anything should change." },
  { id:"in07", kind:"mc", level:2, text:"'A lot of phone games are designed to eat your time. Take the puzzle game my roommate downloaded: he opened it for five minutes and lost the whole evening.'", q:"What is the second sentence doing?", opts:["Disagreeing with the first sentence","Giving an example","Making a prediction"], answer:1, why:"The roommate's game is one specific case that shows what the first sentence describes. That is an example." },
  { id:"in08", kind:"mc", level:2, text:"'This store's return policy is a mess. No one at the counter can explain it, and the rules seem to change every month.'", q:"What is this person trying to do?", opts:["Criticizing something","Just reporting a fact","Recommending something","Comparing two things"], answer:0, why:"Calling the policy 'a mess' and listing its problems is criticizing it." },
  { id:"in09", kind:"mc", level:2, text:"'The train costs about ten dollars more than the bus, but it gets you to the city an hour sooner.'", q:"What is this person trying to do?", opts:["Explaining why something happened","Criticizing the bus","Comparing two things"], answer:2, why:"They set the train and the bus side by side on price and speed. That is comparing." },
  { id:"in10", kind:"mc", level:2, text:"'You really need to start putting money aside. Rent keeps going up and you don't have anything saved for emergencies.'", q:"What is this person trying to do?", opts:["Just reporting a fact","Trying to convince you of something","Giving an example"], answer:1, why:"Rising rent is a fact, but it is used to push you toward saving money. The goal is to convince you." },
  { id:"in11", kind:"mc", level:3, text:"'According to the company's quarterly report, online sales increased by eight percent compared with the previous quarter.'", q:"What is this person trying to do?", opts:["Trying to convince you the company is well managed","Making a prediction about next quarter","Just reporting a fact"], answer:2, why:"Formal wording can sound like an argument, but this only passes along a number from a report. Nothing is being argued for." },
  { id:"in12", kind:"mc", level:3, text:"'Given how frequently the printer malfunctions, the office ought to replace it rather than continue paying for repairs.'", q:"What is this person trying to do?", opts:["Explaining why the printer broke","Recommending something","Just reporting a fact","Comparing two printers"], answer:1, why:"'Ought to replace it' tells the office what to do. The frequent breakdowns are the reason behind the recommendation." },
  { id:"in13", kind:"mc", level:1, text:"'The city should repair this road because there have been 12 accidents here this year.'", q:"Why does the speaker mention the 12 accidents?", opts:["To make the idea that the road should be repaired more believable","To tell you about the history of the city","To disagree with the city"], answer:0, why:"The accidents are there to back up the main idea: the road needs fixing. They make that idea easier to accept." },
  { id:"in14", kind:"mc", level:1, text:"'We should get a cat instead of a dog. Cats don't need to be walked, and we both work long hours.'", q:"Why does the speaker mention that they both work long hours?", opts:["To complain about their jobs","To make the idea of getting a cat more believable","To report a fact about cats"], answer:1, why:"Long work hours mean no one is home to walk a dog. The speaker says it to support choosing a cat." },
  { id:"in15", kind:"mc", level:2, text:"'You'll love this hotel. My parents stayed there last summer and said the staff was wonderful.'", q:"Why does the speaker mention the parents' stay?", opts:["To tell you where the parents went on vacation","To criticize the hotel staff","To give you a reason to believe you'll love the hotel"], answer:2, why:"The parents' good experience is offered as support for the main idea: you will love the hotel." },
  { id:"in16", kind:"mc", level:2, text:"'Mia is probably going to win the class election. The three biggest clubs at school have already said they're voting for her.'", q:"Why does the speaker mention the three clubs?", opts:["To back up the prediction that Mia will win","To list the clubs at the school","To disagree with Mia's ideas"], answer:0, why:"Support from big clubs makes the prediction that Mia will win easier to believe." },
  { id:"in17", kind:"mc", level:3, text:"'The restaurant's loss of customers is most likely a result of its new pricing; attendance dropped sharply during the very month the menu was repriced.'", q:"Why does the speaker mention when attendance dropped?", opts:["To report the restaurant's monthly schedule","To criticize the customers","To support the explanation that the new prices drove customers away"], answer:2, why:"The timing lines up with the price change, which makes the speaker's explanation more believable." },
  { id:"in18", kind:"mc", level:3, text:"'Although the subscription appears inexpensive, over a full year it costs more than buying the software outright; customers should therefore consider the one-time purchase.'", q:"Why does the speaker mention the yearly cost of the subscription?", opts:["To show that the subscription is a good deal","To support the recommendation to buy the software once instead","To predict that the software will get more expensive"], answer:1, why:"The yearly cost is the reason given for the advice. It makes 'consider the one-time purchase' easier to accept." }
];

const S1_CLAIM = [
  { id:"cl01", kind:"mc", level:1, text:"", q:"Which of these is a claim?", opts:["Is it raining?","It is raining.","Grab an umbrella."], answer:1, why:"A claim is something a person says is true. 'It is raining' says something is true. A question asks, and a command tells someone to act." },
  { id:"cl02", kind:"mc", level:1, text:"'Is the hardware store open on Sundays?'", q:"Is this a claim?", opts:["Yes, because it is about a real store","No, because it is a question, not a statement that something is true"], answer:1, why:"Questions ask for information. They do not say that anything is true, so they are not claims." },
  { id:"cl03", kind:"mc", level:1, text:"'This pizza place has the best crust in town.'", q:"Is this a claim?", opts:["No, it is just an opinion","No, because it might be wrong","Yes, opinions are claims too"], answer:2, why:"The speaker says it is true that the crust is the best. Opinions count as claims, even if people disagree." },
  { id:"cl04", kind:"mc", level:1, text:"'My neighbor told me his old car gets 60 miles per gallon.'", q:"The neighbor made a claim. Does that mean it is true?", opts:["Yes, otherwise he would not say it","Only if he sounds confident","No. A claim is just something a person says is true. It could be wrong."], answer:2, why:"Making a claim and being correct are two different things. Claims can be true, false, or uncertain." },
  { id:"cl05", kind:"mc", level:1, text:"'We should leave now.'", q:"Is this a claim?", opts:["Yes. The speaker is saying it is true that leaving now is the right move.","No, it is a command","No, claims have to be facts"], answer:0, why:"'We should' statements say something is true about what is best to do. Recommendations are claims." },
  { id:"cl06", kind:"mc", level:1, text:"'Close the window, please.'", q:"Is this a claim?", opts:["Yes, it is about the window","No, it is a request. It does not say anything is true.","Yes, all sentences are claims"], answer:1, why:"A request asks someone to do something. Compare it with 'You should close the window,' which is a claim." },
  { id:"cl07", kind:"mc", level:2, text:"", q:"Which of these is NOT a claim?", opts:["The rent will go up next year.","You should call your grandmother.","Did you feed the cat?","Dogs need exercise every day."], answer:2, why:"The other three each say something is true: a prediction, a recommendation, and a general statement. 'Did you feed the cat?' only asks." },
  { id:"cl08", kind:"mc", level:2, text:"'Next year, more people will buy groceries online than in stores.'", q:"What kind of claim is this?", opts:["A recommendation","A prediction","A report about the past"], answer:1, why:"It says something will be true in the future. Predictions are claims too." },
  { id:"cl09", kind:"mc", level:2, text:"'Our gym is packed after 5 p.m. The owners should open a second location. They already have a waiting list for new members.'", q:"Which claim does the speaker most want you to accept?", opts:["The gym is packed after 5 p.m.","The owners should open a second location.","There is a waiting list for new members."], answer:1, why:"The crowding and the waiting list are there to support one idea: open a second location. That is the main claim." },
  { id:"cl10", kind:"mc", level:2, text:"'You should bring a jacket on the boat tour. The wind out on the water is really strong.'", q:"Which claim does the speaker most want you to accept?", opts:["You should bring a jacket on the boat tour.","The wind out on the water is really strong.","Boat tours are fun."], answer:0, why:"The strong wind is the reason. Bringing a jacket is what the speaker wants you to accept and do." },
  { id:"cl11", kind:"mc", level:2, text:"'Every conclusion is a claim, but not every claim is a conclusion.'", q:"What does this mean?", opts:["Claims and conclusions are exactly the same thing","Conclusions are always true and claims are not","The main point of an argument is always something said to be true, but many things said to be true are not the main point"], answer:2, why:"A conclusion is the main point, and it is a claim. Other claims in the argument can be reasons instead of the main point." },
  { id:"cl12", kind:"mc", level:2, text:"Sam: 'The bakery closes at 6. So we need to leave by 5:30.'", q:"Which of Sam's statements are claims?", opts:["Only 'The bakery closes at 6.'","Only 'We need to leave by 5:30.'","Both of them"], answer:2, why:"Both say something is true. The first is a reason, and the second is the main point Sam wants you to accept." },
  { id:"cl13", kind:"mc", level:3, text:"'Since the airline cancels such a high share of its evening flights, travelers would be wise to book morning departures.'", q:"Which claim is the main one the speaker wants you to accept?", opts:["The airline cancels many evening flights.","Travelers should book morning flights.","Morning flights are cheaper."], answer:1, why:"'Since' introduces the reason. 'Would be wise to book morning departures' is the main point. The third option is never said." },
  { id:"cl14", kind:"mc", level:3, text:"'Thousands of online reviews say this blender is the most reliable on the market.'", q:"A shopper reads this and decides the claim must be true. What is the mistake?", opts:["There is no mistake, reviews are facts","A claim does not become true just because many people make it. It still needs good support.","The shopper should only trust one review"], answer:1, why:"Lots of people saying something is still just lots of claims. Whether it is true depends on the evidence." },
  { id:"cl15", kind:"mc", level:3, text:"'Students perform better on tests when they are well rested. Teenagers' bodies are wired to fall asleep late. Therefore, high schools should start later in the morning.'", q:"Which statement is a claim that is NOT the main point?", opts:["High schools should start later in the morning.","Students perform better on tests when they are well rested.","None of them, because only the main point counts as a claim"], answer:1, why:"All three sentences are claims. The first two are reasons, and the last is the main point." },
  { id:"cl16", kind:"mc", level:3, text:"", q:"Which statement about claims is correct?", opts:["A claim must be a proven fact","A command like 'Sit down' is a claim","Only the main point of an argument counts as a claim","A recommendation like 'You should sit down' is a claim"], answer:3, why:"A recommendation says it is true that something is a good idea. Claims do not need to be proven, and commands are not claims." }
];

const S1_REASON = [
  { id:"re01", kind:"tap", level:1, speaker:null, sents:[{t:"We should take an umbrella.", role:"conclusion"},{t:"The sky is full of dark clouds.", role:"premise"}], why:"Ask: why take an umbrella? Because of the dark clouds. The clouds are the reason." },
  { id:"re02", kind:"tap", level:1, speaker:null, sents:[{t:"The bakery runs out of bread by noon,", role:"premise"},{t:"so we should get there early.", role:"conclusion"}], why:"Why go early? Because the bread runs out by noon. 'So' points to the point that follows." },
  { id:"re03", kind:"tap", level:1, speaker:null, sents:[{t:"Max needs a new pair of sneakers.", role:"conclusion"},{t:"His old ones have a hole in the bottom.", role:"premise"}], why:"Why does Max need new sneakers? Because of the hole. The hole makes the point believable." },
  { id:"re04", kind:"tap", level:1, speaker:null, sents:[{t:"My brother saved enough for a car in just one year.", role:"premise"},{t:"He is really good with money.", role:"conclusion"}], why:"Why think he is good with money? Because he saved for a car so fast. Here the reason comes first." },
  { id:"re05", kind:"tap", level:1, speaker:null, sents:[{t:"This laptop is a better deal than that one", role:"conclusion"},{t:"because it costs less and has more storage.", role:"premise"}], why:"'Because' introduces the reason: lower price and more storage. That supports 'better deal.'" },
  { id:"re06", kind:"tap", level:2, speaker:null, sents:[{t:"The fireworks probably scared our cat.", role:"conclusion"},{t:"She has been hiding under the bed since they started.", role:"premise"},{t:"She always hides when there are loud noises.", role:"premise"}], why:"Both the hiding and her fear of loud noises answer 'Why think the fireworks scared her?' Either one is a reason." },
  { id:"re07", kind:"tap", level:2, speaker:null, sents:[{t:"Jordan is not going to enjoy this restaurant.", role:"conclusion"},{t:"He can't stand spicy food.", role:"premise"},{t:"Almost every dish on the menu is very spicy.", role:"premise"}], why:"Why won't Jordan enjoy it? He hates spice, and the menu is full of it. Both sentences are reasons." },
  { id:"re08", kind:"tap", level:2, speaker:null, sents:[{t:"The new phone's battery lasts two full days.", role:"premise"},{t:"For someone who travels a lot, it is the smarter choice.", role:"conclusion"}], why:"Why is it the smarter choice for travelers? Because the battery lasts two days. The battery fact is the reason." },
  { id:"re09", kind:"tap", level:2, speaker:null, sents:[{t:"Ticket sales doubled the week after the band posted its video online.", role:"premise"},{t:"Social media clearly helped the concert sell out.", role:"conclusion"}], why:"Why think social media helped? Because sales jumped right after the video. That timing is the reason." },
  { id:"re10", kind:"tap", level:2, speaker:null, sents:[{t:"You should not lend Tara money again.", role:"conclusion"},{t:"She still hasn't paid back what she borrowed in March.", role:"premise"}], why:"Why not lend to Tara? Because she never paid back the last loan. That makes the advice easier to accept." },
  { id:"re11", kind:"tap", level:3, speaker:null, sents:[{t:"Given the candidate's extensive experience and consistently strong references,", role:"premise"},{t:"she is likely to receive the position.", role:"conclusion"}], why:"'Given' introduces the reason: experience and references. The point is that she will probably get the job." },
  { id:"re12", kind:"tap", level:3, speaker:null, sents:[{t:"The landlord's proposed rent increase is unjustified,", role:"conclusion"},{t:"since no repairs or improvements have been made to the building in five years.", role:"premise"}], why:"'Since' works like 'because.' The lack of repairs is the reason the speaker thinks the increase is unfair." },
  { id:"re13", kind:"mc", level:1, text:"", q:"What does a reason do?", opts:["It changes the subject","It makes another idea easier to believe","It asks a question"], answer:1, why:"A reason is there to support something else the speaker said, so you are more likely to accept it." },
  { id:"re14", kind:"mc", level:1, text:"'We should eat at home tonight. We've spent way too much on takeout this week.'", q:"Which question helps you find the reason?", opts:["Who?","When?","Why?"], answer:2, why:"Ask 'Why should we eat at home?' The answer, too much spent on takeout, is the reason." },
  { id:"re15", kind:"mc", level:1, text:"'We should eat at home tonight. We've spent way too much on takeout this week.'", q:"Why is the second sentence here?", opts:["To describe a restaurant","To give a reason for eating at home","To change the topic to money"], answer:1, why:"The speaker mentions the takeout spending to support the idea of eating at home." },
  { id:"re16", kind:"mc", level:2, text:"'Lena would make a great team captain. She's the one everyone already goes to when they need help.'", q:"What does 'She's the one everyone goes to for help' connect to?", opts:["Nothing, it is a separate idea","The point that Lena would make a great captain","A complaint about the team"], answer:1, why:"A reason always connects to a point. This one supports the idea that Lena would be a great captain." },
  { id:"re17", kind:"mc", level:2, text:"", q:"Why do people give reasons when they talk?", opts:["To fill silence","Because they are unsure of their point","Because they want you to believe or accept their point"], answer:2, why:"Reasons are a tool for convincing. People add them when they want you to agree." },
  { id:"re18", kind:"mc", level:3, text:"'The museum should extend its weekend hours, since visitor numbers on Saturdays already exceed its capacity by early afternoon.'", q:"Which part is the reason, and what does it support?", opts:["'Visitor numbers exceed capacity' supports 'the museum should extend its hours'","'The museum should extend its hours' supports 'visitor numbers exceed capacity'","Neither part supports the other"], answer:0, why:"Ask why the museum should extend its hours. The answer, crowds over capacity, is the reason. It supports the recommendation." }
];

const HARDER = [
  { simple:"She has good experience and references, so she will probably get the job.", hard:"Given the candidate's extensive experience and consistently strong references, she is likely to receive the position.", opts:["She will definitely get the job because of her references.","Her references are probably fake.","She has good experience and references, so she will probably get the job.","She has a lot of experience but may not get the job."], answer:2, why:"Same point, same reason. 'Is likely to receive the position' just means 'will probably get the job.'" },
  { simple:"Membership keeps dropping, so the club will probably have to hold fewer yearly events.", hard:"In light of the persistent decline in membership, the club's leadership will probably need to reduce the number of its annual events.", opts:["Membership keeps dropping, so the club will probably have to hold fewer yearly events.","The club will definitely cancel all of its events.","The club is holding fewer events, and that is why membership keeps dropping.","Membership is dropping because the leaders are unpopular, so the club will hold fewer events."], answer:0, why:"'In light of the persistent decline' means 'because membership keeps dropping.' The other options are too strong, reversed, or add a cause." },
  { simple:"The side effects are usually mild, so most patients can keep taking the medicine.", hard:"Because the medication's side effects are typically mild, the majority of patients are able to continue treatment.", opts:["The medicine has no side effects, so everyone can take it.","Most patients keep taking it, so the side effects must be mild.","The side effects are mild, but most patients stop taking it anyway.","The side effects are usually mild, so most patients can keep taking the medicine."], answer:3, why:"'Typically mild' means usually mild, and 'the majority' means most. The match keeps both the reason and the point." },
  { simple:"Fewer people ate in restaurants right as delivery apps spread, so the apps are probably part of the reason.", hard:"Since dining-room traffic fell precisely as delivery apps proliferated, the apps are plausibly a contributing factor.", opts:["Delivery apps are the only reason restaurants lost customers.","Fewer people ate in restaurants right as delivery apps spread, so the apps are probably part of the reason.","Restaurants losing customers is what caused delivery apps to spread.","Delivery apps hurt restaurants, so they should be banned."], answer:1, why:"'Plausibly a contributing factor' means 'probably part of the reason,' not the only reason. The others overstate, reverse, or add a recommendation." },
  { simple:"The lease says no pets, so getting a dog breaks the lease.", hard:"Inasmuch as the lease expressly prohibits pets, the tenant's acquisition of a dog constitutes a violation of the agreement.", opts:["Getting a dog might break the lease, depending on the landlord.","The tenant got a dog, so the lease must say no pets.","The lease says no pets, so getting a dog breaks the lease.","The lease says no pets, so the tenant will be evicted."], answer:2, why:"'Inasmuch as' means 'because,' and 'constitutes a violation' means 'breaks.' The last option adds eviction, which was never said." },
  { simple:"Shoppers keep saying price is their main complaint, so sales probably won't improve unless the store lowers prices a lot.", hard:"Given that shoppers consistently cite cost as their primary complaint, the store's sales are unlikely to improve absent a significant reduction in prices.", opts:["Shoppers keep saying price is their main complaint, so sales probably won't improve unless the store lowers prices a lot.","Lowering prices will definitely fix the store's sales.","Sales are bad, and that is why shoppers complain about prices.","Shoppers complain about prices and staff, so the store will close."], answer:0, why:"'Absent a significant reduction' means 'unless prices drop a lot.' Saying lower prices will definitely fix sales is a different, stronger claim." },
  { simple:"The team started losing when its main goalie was out, so his return should help them win more.", hard:"Insofar as the team's recent losses coincided with the absence of its starting goalkeeper, his return should improve the team's results.", opts:["The goalie caused every loss the team has ever had.","The team kept losing, so the goalie decided to come back.","The goalie is back, so the team will win every game.","The team started losing when its main goalie was out, so his return should help them win more."], answer:3, why:"'Coincided with' means 'happened at the same time as.' 'Should improve results' is a modest prediction, not 'win every game.'" },

  { simple:"Most complaints come from one department, so the problem is probably that department's managers, not the whole company.", hard:"Since the majority of complaints originate from a single department, the problem is most likely managerial rather than company-wide.", opts:["Most complaints come from one department, so the problem is probably that department's managers, not the whole company.","The whole company is badly run, which is why one department complains.","Every complaint comes from one department, so its manager should be fired.","The managers are fine, so the complaints must be from the whole company."], answer:0, why:"'Originate from a single department' means 'come from one department.' 'Most likely' means 'probably.' The others reverse, exaggerate, or add firing." },

  conclusion:{label:"Conclusion", plain:"what they want you to believe"},
  middle:{label:"Middle step", plain:"a mini-conclusion that also supports the main point"},
  background:{label:"Background", plain:"sets the scene, proves nothing"},
  opposing:{label:"Other side", plain:"a view the author pushes back on"}
};

const CORE = {
  normal:"An argument is a group of statements where one statement, the conclusion, is supported by others, the premises. Premises are offered as reasons; the conclusion is the claim those reasons are meant to establish. LSAT arguments usually include extra material too: background that sets the scene, and opposing views the author argues against. Neither of those is a premise or the conclusion.",
  plain:"Every argument has a point and some reasons. The point is what the person wants you to believe. The reasons are why they think you should believe it. Your first job on almost every Logical Reasoning question is to find the point, then ask what is holding it up.",
  kid:"Your friend says: \u201cWe should play inside. It\u2019s raining.\u201d What does your friend want? To play inside. That is the conclusion. Why? Because it\u2019s raining. That is the premise. The conclusion is the \u201cwhat.\u201d The premise is the \u201cwhy.\u201d",
  analogy:"Think of a table. The conclusion is the tabletop, the part everyone looks at. The premises are the legs holding it up. Background is the rug under the table: it\u2019s in the room, but it isn\u2019t holding anything up. If you kick out a leg, the top wobbles. That\u2019s what \u201cweakening an argument\u201d will mean later."

function touchDay(){
  const d = today(); if(S.streak.last === d) return;
  const y = new Date(Date.now()-864e5).toLocaleDateString("en-CA");
  S.streak.count = (S.streak.last === y) ? S.streak.count + 1 : 1; S.streak.last = d;
}
function addXP(n, msg){ S.xp += n; touchDay(); if(msg) toast(msg + "  +" + n + " XP"); }
const level = () => Math.floor(S.xp/120) + 1;

function record(a){
  a.at = Date.now(); a.day = today(); S.attempts.push(a); touchDay();
  if(!a.correct && a.trap){ S.profile.traps[a.trap] = (S.profile.traps[a.trap]||0) + 1; }
  // accuracy streak celebration
  let run = 0; for(let i=S.attempts.length-1;i>=0 && S.attempts[i].correct;i--) run++;
  if(a.correct && (run===5 || run===10)) toast("You\u2019ve found the conclusion " + run + " times in a row.");
  save();
}
const INTERVALS = [10*60e3, 864e5, 3*864e5, 7*864e5];
function scheduleReview(qid, ok){
  const r = S.reviews[qid] || {stage:-1};
  r.stage = ok ? Math.min(r.stage+1, 3) : 0; if(r.stage<0) r.stage=0;
  r.due = Date.now() + INTERVALS[r.stage]; S.reviews[qid] = r;
}
const dueReviews = () => Object.entries(S.reviews).filter(([,r])=>r.due<=Date.now()).map(([id])=>id);

function mastery(){
  const at = S.attempts; const total = at.length; const correct = at.filter(a=>a.correct).length;
  const acc = total ? correct/total : 0;
  const formats = new Set(at.filter(a=>a.correct).map(a=>a.kind==="review"?"independent":a.kind));
  const indep = new Set(at.filter(a=>a.kind==="independent"&&a.correct&&a.firstTry).map(a=>a.qid));
  const firstDay = at.length ? at[0].day : null;
  const laterReviews = at.filter(a=>a.kind==="review"&&a.correct&&a.day!==firstDay).length;
  const teach = !!(S.teach && S.teach.passed);
  const c = [
    {t:"Tried the skill at least once", ok: total>0},
    {t:"3 correct answers", ok: correct>=3},
    {t:"70%+ accuracy over 6+ answers, in 2+ formats (spotting parts, multiple choice)", ok: total>=6 && acc>=.7 && formats.size>=2},
    {t:"3 independent questions right on the first try, and taught it back", ok: indep.size>=3 && teach},
    {t:"2 correct reviews on a later day (proves it stuck)", ok: laterReviews>=2}
  ];
  let lvl = 0; for(let i=0;i<c.length;i++){ if(c[i].ok) lvl=i+1; else break; }
  return {lvl, criteria:c, total, correct, acc};
}
function calibration(){
  const keys = [["guess","I\u2019m guessing"],["maybe","Maybe"],["pretty","Pretty sure"],["sure","100%"]];
  return keys.map(([k,l])=>{ const xs = S.attempts.filter(a=>a.conf===k); const c = xs.filter(a=>a.correct).length; return {k,l,n:xs.length,c}; });
}
function learnerSummary(){
  const m = mastery(); const traps = Object.entries(S.profile.traps).sort((a,b)=>b[1]-a[1]);
  const reasons = Object.entries(S.profile.reasons).sort((a,b)=>b[1]-a[1]);
  const idk = Object.entries(S.profile.idk).sort((a,b)=>b[1]-a[1]);
  const confWrong = S.attempts.filter(a=>!a.correct && (a.conf==="sure"||a.conf==="pretty")).length;
  const lines = [];
  lines.push("Mastery of premise vs conclusion: " + MASTERY[m.lvl] + " (" + m.correct + "/" + m.total + " correct).");
  if(traps.length) lines.push("Traps she falls for most: " + traps.slice(0,3).map(([k,v])=>k+" ×"+v).join(", ") + ".");
  if(reasons.length) lines.push("When wrong, she usually says: " + reasons.slice(0,2).map(([k])=>REASONS.find(r=>r[0]===k)?.[1]).join(" / "));
  if(idk.length) lines.push("Help she asks for most: " + idk.slice(0,3).map(([k])=> (IDK_OPTIONS.find(o=>o[0]===k)||[k,k])[1]).join(" / ") + (idk[0] && ["life","ten"].includes(idk[0][0]) ? " (seems to learn best from everyday examples)." : ""));
  if(confWrong) lines.push("Confidently wrong " + confWrong + " time(s).");
  if(S.teach) lines.push("Teach-back: " + (S.teach.passed ? "passed" : "not yet") + (S.teach.gaps && S.teach.gaps.length ? "; gaps: " + S.teach.gaps.join("; ") : ""));
  const works = Object.entries(S.profile.works||{}).sort((a,b)=>b[1]-a[1]);
  if(works.length) lines.push("Explanation styles that finally made things click for her: " + works.slice(0,3).map(([k,v])=>(METHOD_NAMES[k]||k)+" ×"+v).join(", ") + ". Lean on these.");
  const missed = Object.entries(S.profile.missed||{}).sort((a,b)=>b[1]-a[1]);
  if(missed.length) lines.push("Styles that often did NOT work for her: " + missed.slice(0,2).map(([k])=>METHOD_NAMES[k]||k).join(", ") + ".");
  const dp = S.profile.depths||[]; if(dp.length) lines.push("On average she needs " + (dp.reduce((a,b)=>a+b,0)/dp.length).toFixed(1) + " explanation attempts before it clicks.");
  const style = STYLES.find(s=>s[0]===S.settings.style); lines.push("Preferred explanation style: " + (style?style[1]:"Simple") + ".");
  return lines.join("\n");
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
function toast(t){ const w=$("#toastwrap"); w.innerHTML = '<div class="toast" role="status">'+esc(t)+'</div>'; clearTimeout(toast.t); toast.t=setTimeout(()=>w.innerHTML="", 3200); }
function md(t){
  let h = esc(t);
  h = h.replace(/```([\s\S]*?)```/g,(m,c)=>"<pre>"+c.trim()+"</pre>");
  h = h.replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>");
  const lines = h.split("\n"); let out=[], inList=false;
  for(const ln of lines){
    if(/^\s*[-•]\s+/.test(ln)){ if(!inList){out.push("<ul>");inList=true;} out.push("<li>"+ln.replace(/^\s*[-•]\s+/,"")+"</li>"); }
    else { if(inList){out.push("</ul>");inList=false;} out.push(ln===""?"<br>":ln+"<br>"); }
  }
  if(inList) out.push("</ul>");
  return out.join("").replace(/(<br>)+$/,"").replace(/(<br>){3,}/g,"<br><br>");
}
const fmtTime = ms => { const s=Math.round(ms/1000); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); };
function words(t){ return esc(t).split(/(\s+)/).map(w=>{ const k=w.toLowerCase().replace(/[^a-z\-]/g,""); return /\S/.test(w)? '<span class="w'+(VOCAB[k]?" vocab":"")+'" data-w="'+esc(k)+'">'+w+'</span>' : w; }).join(""); }

    '<section class="panel stack" style="gap:8px"><h3>Confidence check</h3><div class="tblwrap"><table class="cal"><tr><th>When you said</th><th class="n">Answered</th><th class="n">Right</th></tr>'+cal.map(c=>'<tr><td>'+c.l+'</td><td class="n">'+c.n+'</td><td class="n">'+(c.n?Math.round(c.c/c.n*100)+"%":"—")+'</td></tr>').join("")+'</table></div><p class="muted">'+(confWrong? confWrong+' confidently wrong answer'+(confWrong>1?"s":"")+'. These are the most valuable to review: they\u2019re in your error journal.' : 'Questions you get wrong while feeling sure will be flagged here.')+'</p></section></div>';
  h += '<section class="panel stack" style="gap:8px"><h3>Practice history</h3><div class="row tnum" style="gap:28px"><span><span class="mono">Avg time</span><br>'+avg+'</span><span><span class="mono">Changed answers</span><br>'+changed.length+(changed.length?" ("+changed.filter(a=>a.correct).length+" ended right)":"")+'</span><span><span class="mono">Timed sections</span><br>0</span><span><span class="mono">Score estimate</span><br>Not yet</span></div><p class="muted">A score range only appears after several full timed sections. A guess from a handful of practice questions would mislead you.</p></section>';

function nextDue(){ const t = Math.min(...Object.values(S.reviews).map(r=>r.due)); const d = t-Date.now(); return d<36e5? "in "+Math.max(1,Math.round(d/6e4))+" min" : d<864e5? "in "+Math.round(d/36e5)+" hours" : "in "+Math.round(d/864e5)+" days"; }
function trapAdvice(t){ return ({"Restates evidence":"You\u2019re picking true facts from the passage instead of the point. Use the Why test: the conclusion is the one the others answer \u201cwhy?\u201d for.","Too strong":"Watch for words like always, never, any, best, nothing at all. If the passage didn\u2019t go that far, neither can the answer.","Opposite answer":"You\u2019re picking the view the author argues against. \u201cSome people say\u2026\u201d is usually the other side.","Outside the scope":"You\u2019re bringing in outside ideas. If the passage never mentioned it, it can\u2019t be the conclusion.","Indicator-word trap":"\u201cSo\u201d and \u201ctherefore\u201d mark a conclusion, but not always the main one. Check what it supports."})[t] || "We\u2019ll keep drilling this trap."; }

function sIdea(){
  return '<section class="panel stack"><div class="row" style="justify-content:space-between"><h2>Every argument has a point and reasons</h2>'+idkBtn("idea")+'</div>'+bdSlot("s:idea")+''+
  levelsBar("core-level", U.coreLevel, [["normal","Normal LSAT"],["plain","Plain English"],["kid","Like I\u2019m 10"],["analogy","Real life"]])+
  '<p class="explain">'+esc(CORE[U.coreLevel])+'</p></section>'+
  '<section class="panel stack"><h3>The two words, translated</h3><dl style="margin:0">'+
  '<div class="term"><dt>Conclusion</dt><dd>\u201cWhat they are trying to convince you to believe.\u201d</dd></div>'+
  '<div class="term"><dt>Premise</dt><dd>\u201cThe evidence or reason someone gives you.\u201d</dd></div>'+
  '<div class="term"><dt>Background</dt><dd>\u201cScene-setting. True, maybe, but it isn\u2019t proving anything.\u201d</dd></div>'+
  '<div class="term"><dt>Opposing view</dt><dd>\u201cWhat someone else thinks, usually set up so the author can disagree.\u201d</dd></div>'+
  '<div class="term"><dt>Intermediate conclusion</dt><dd>\u201cA middle step: proven by one reason, then used to prove the main point.\u201d</dd></div></dl></section>'+
  '<section class="panel stack"><h3>Two tests that work every time</h3><div class="grid2">'+
  '<div class="note accent"><h4>The Why test</h4>Point at a sentence and ask \u201cWhy should I believe that?\u201d If another sentence answers, you\u2019ve found a conclusion and its premise.</div>'+
  '<div class="note accent"><h4>The Therefore test</h4>Put \u201ctherefore\u201d between two sentences: <em>premise, therefore conclusion</em>. If it sounds right one way and wrong the other way, you know which is which.</div></div></section>'+
  '<section class="panel stack"><h3>Signpost words</h3><div class="grid2"><div><span class="mono">Usually a conclusion follows</span><p>therefore · thus · so · hence · consequently · clearly · it follows that · we should · this shows that</p></div><div><span class="mono">Usually a premise follows</span><p>because · since · for · given that · after all · as shown by · moreover · in addition</p></div></div>'+
  '<div class="note warn"><h4>Signposts help, but they can mislead</h4>The conclusion can come first, in the middle, or last. Some arguments have no signpost at all. And \u201cso\u201d sometimes marks a middle step, not the main point. Signposts are clues; the Why test is the proof.</div></section>';
}

    (st!==undefined? '<div class="note '+(ok?"good":"warn")+'">'+(ok?"<strong>Right.</strong> ":"<strong>That one\u2019s a reason.</strong> Ask: why should I believe it? The answer points to the conclusion. ")+esc(e.lesson)+'</div>' : "")+'</section>'; }).join("");

function sPractice(kind){
  const list = QUESTIONS.filter(q=>q.mode===(kind==="guided"?"guided":"independent"));
  const id = U.cur[kind]; const q = Q(id); const s = qs(id);
  let h = '<section class="panel stack" style="gap:8px"><h2>'+(kind==="guided"?"Guided practice":"On your own")+'</h2><p class="lead">'+(kind==="guided"?"Hints and the tutor are open. Wrong answers explain themselves, and you can try again.":"No hints or tutor until you answer. Tell me how sure you are before you submit. That\u2019s how we find answers you were confidently wrong about.")+'</p></section>';
  h += questionHTML(q, s, kind, list);
  return h;
}
function questionHTML(q, s, kind, list){
  const indep = kind!=="guided"; const locked = indep && !s.done;
  let h = '<section class="panel stack">';
  h += '<div class="qbar"><div class="qnav" aria-label="Questions">'+list.map((x,i)=>{ const xs=U.q[x.id]; const c = xs&&xs.done?(xs.correct?"ok":"no"):""; return '<button data-act="qgo" data-k="'+kind+'" data-id="'+x.id+'" class="'+c+(xs&&xs.flag?" flag":"")+'" aria-current="'+(x.id===q.id)+'" aria-label="Question '+(i+1)+'">'+(i+1)+'</button>';}).join("")+'</div>'+
    '<div class="row" style="gap:8px">'+(S.settings.timer?'<span class="timer tnum" id="timer" data-start="'+s.start+'" data-stop="'+(s.done?s.end:"")+'">0:00</span>':"")+'<span class="pill">'+q.type+' · '+q.difficulty+'</span><button class="chip" data-act="flag" data-id="'+q.id+'" aria-pressed="'+s.flag+'">'+(s.flag?"Flagged":"Flag")+'</button></div></div>';
  h += stimHTML(q.sents,{roles:s.done&&s.showRoles,key:q.id,speaker:q.speaker});
  h += '<div class="row" style="justify-content:space-between"><span class="muted" style="font-size:.85rem">'+(U.vocabMode?"Tap any word for a plain definition.":"Tap a sentence to highlight it.")+'</span><button class="chip" data-act="vocab-toggle" aria-pressed="'+U.vocabMode+'">Look up a word</button></div>';
  h += '<p class="stem">'+esc(q.stem)+'</p>';
  h += '<div class="choices">'+q.choices.map(c=>{ const cls=["choice"]; if(s.sel===c.l) cls.push("on"); if(s.elim[c.l]) cls.push("x");
      if(s.done){ if(c.l===q.answer) cls.push("right"); else if(s.sel===c.l) cls.push("wrong"); }
      else if(!indep && s.tries.includes(c.l)) cls.push("wrong");
      return '<div class="'+cls.join(" ")+'"><button class="pick" data-act="choose" data-id="'+q.id+'" data-l="'+c.l+'"'+(s.done?" disabled":"")+'><span class="letter">'+c.l+'</span><span class="ctext">'+esc(c.t)+'</span></button><button class="elim" data-act="elim" data-id="'+q.id+'" data-l="'+c.l+'" title="Cross out '+c.l+'" aria-label="Cross out '+c.l+'">'+(s.elim[c.l]?"↺":"⊘")+'</button></div>';}).join("")+'</div>';
  if(!s.done){
    if(indep){
      h += '<div class="stack" style="gap:6px"><span class="mono">How confident are you?</span><div class="conf">'+[["guess","I\u2019m guessing"],["maybe","Maybe"],["pretty","Pretty sure"],["sure","100%"]].map(([k,l])=>'<button data-act="conf" data-id="'+q.id+'" data-v="'+k+'" aria-pressed="'+(s.conf===k)+'">'+l+'</button>').join("")+'</div></div>';
      h += '<div class="row"><button class="btn primary" data-act="submit" data-id="'+q.id+'" data-k="'+kind+'"'+(s.sel&&s.conf?"":" disabled")+'>Submit answer</button>'+idkBtn("q:"+q.id, true)+'<span class="muted" style="font-size:.85rem">On your own: breakdowns unlock after you answer.</span></div>';
    } else {
      const hintsLeft = q.hints.length - s.hints;
      h += '<div class="row"><button class="btn primary" data-act="submit" data-id="'+q.id+'" data-k="'+kind+'"'+(s.sel?"":" disabled")+'>Check</button><button class="btn" data-act="hint" data-id="'+q.id+'"'+(hintsLeft?"":" disabled")+'>Hint ('+s.hints+' of '+q.hints.length+')</button>'+idkBtn("q:"+q.id)+'</div>';
      if(s.hints) h += '<div class="stack" style="gap:6px">'+q.hints.slice(0,s.hints).map((t,i)=>'<div class="note accent"><span class="mono">Hint '+(i+1)+'</span><br>'+esc(t)+'</div>').join("")+'</div>';
      const last = s.tries[s.tries.length-1];
      if(last){ const c = q.choices.find(x=>x.l===last); h += '<div class="note bad"><h4>'+c.l+' isn\u2019t it. Try again.</h4>'+esc(c.why)+(c.trap?' <span class="trap">'+esc(c.trap)+'</span>':"")+'</div>'; }
    }
    h += bdSlot("q:"+q.id);
  } else h += resultHTML(q, s, kind);
  return h + '</section>';
}
function resultHTML(q, s, kind){
  const indep = kind!=="guided"; const c = q.choices.find(x=>x.l===q.answer); const mine = q.choices.find(x=>x.l===s.sel);
  let h = '';
  if(s.correct) h += '<div class="note good"><h4>'+(s.firstTry?"Correct on the first try.":"Correct.")+'</h4>'+esc(c.why)+(indep&&s.conf==="guess"?" You said you were guessing, so this one will come back to make sure.":"")+'</div>';
  else {
    h += '<div class="note bad"><h4>The answer is '+q.answer+'.</h4>You chose '+s.sel+'. '+esc(mine.why)+(mine.trap?' <span class="trap">'+esc(mine.trap)+'</span>':"")+((s.conf==="sure"||s.conf==="pretty")?'<br><strong>You felt sure about this one.</strong> That makes it one of the most useful questions to study. It\u2019s saved to your error journal.':"")+'</div>';
    if(indep && !s.reason) h += '<div class="stack" style="gap:6px"><span class="mono">Wrong-answer detective: what made you choose '+s.sel+'?</span><div class="chips">'+REASONS.map(([k,l])=>'<button class="chip" data-act="reason" data-id="'+q.id+'" data-v="'+k+'">'+l+'</button>').join("")+'</div></div>';
    if(s.reason) h += '<div class="note warn"><h4>The thinking mistake</h4>'+esc(REASONS.find(r=>r[0]===s.reason)[2])+'</div>';
  }
  h += '<div class="row">'+idkBtn("q:"+q.id)+'<button class="btn" data-act="roles" data-id="'+q.id+'">'+(s.showRoles?"Hide":"Show")+' the parts</button></div>'+bdSlot("q:"+q.id);
  h += '<div class="stack" style="gap:10px"><h3>Explanation</h3>'+levelsBar("qlevel:"+q.id, s.level||defaultLevel(), LEVELS.filter(l=>l[0]!=="socratic"))+explainBody(q, s.level||defaultLevel())+'</div>';
  h += '<div class="stack" style="gap:10px"><h3>Answer choice autopsy</h3><div class="autopsy">'+q.choices.map(x=>'<div class="aut'+(x.l===q.answer?" correct":"")+'"><span class="letter">'+x.l+'</span><div class="stack" style="gap:4px"><span>'+esc(x.t)+'</span><span><span class="lbl">Why someone picks it: </span>'+esc(x.pick)+'</span><span><span class="lbl">'+(x.l===q.answer?"Why it\u2019s right: ":"Why it\u2019s wrong: ")+'</span>'+esc(x.why)+'</span>'+(x.trap?'<span><span class="trap">The trap: '+esc(x.trap)+'</span></span>':'<span><span class="trap okay">Correct answer</span></span>')+'</div></div>').join("")+'</div></div>';
  h += '<div class="note"><h4>Why did they write it this way?</h4>'+esc(q.explain.testing)+'</div>';
  const list = QUESTIONS.filter(x=>x.mode===(kind==="guided"?"guided":"independent"));
  const i = list.findIndex(x=>x.id===q.id);
  if(kind==="review") h += '<div class="row"><button class="btn primary" data-act="review-next">'+(dueReviews().length?"Next review":"Back to today")+'</button></div>';
  else if(i<list.length-1) h += '<div class="row"><button class="btn primary" data-act="qgo" data-k="'+kind+'" data-id="'+list[i+1].id+'">Next question</button></div>';
  return h;
}

  const t = S.teach;
  let h = '<section class="panel stack"><div class="row" style="justify-content:space-between"><h2>Now you\u2019re the teacher</h2>'+idkBtn("teach")+'</div>'+bdSlot("s:teach")+''+

/* =========================================================
   TUTOR
   ========================================================= */
const T = { sample:undefined, turns:[], msgs:[], busy:false, ctl:null, ctx:null, level:null, open:false, helpCount:{} };
const RULES = `You are an elite, patient private LSAT tutor sitting beside one student who started as a complete beginner. You are inside a study app. Each message from the app includes a CONTEXT block describing exactly what she is looking at right now. Use it; never ask her to paste the question.

How to teach:
- Plain English, short sentences. If you must use an LSAT term, translate it right away (premise = "the reason they give you"; conclusion = "what they want you to believe"; intermediate conclusion = "a middle step").
- Never shame. Never say "obviously", "simply", "as you should know", "this is simple", "you already learned this", "just". Say things like "The wording makes this look harder than the logic is. Let's strip it down."
- Never repeat an explanation you already gave in this chat. If she still doesn't get it, change the method: an everyday example (work, money, family, friends, restaurants, social media), smaller steps, a picture made of arrows, or one small question.
- Teaching ladder for an unanswered question (unless CONTEXT says reveal is allowed): 1st help = clarify what the question asks; 2nd = one small hint; 3rd = break the argument into parts; 4th = help eliminate one or two wrong choices. Do not name the correct letter or state the correct answer's content before then. If she asks for the answer directly, give it.
- When CONTEXT says reveal is allowed, you may explain the answer fully.
- Explanation levels: Normal LSAT; Plain English (almost no terms); Like I'm 12 (very simple sentences); Real-life analogy; Sentence by sentence ("Sentence 1: here's what they're telling us..." then "So in regular English, this whole paragraph is basically saying..."); Draw the logic (plain-text boxes and arrows inside a code block, e.g. EVIDENCE / ↓ / CONCLUSION); Socratic (ask exactly ONE small question, then stop and wait).
- Keep replies under about 140 words unless she asks for more. Use **bold** sparingly and "- " bullets only for short lists.
- End teaching replies with one short check-in question so she has to think (e.g. "Which sentence do you think the others are supporting?").
- Only use the passage and choices in CONTEXT. Don't invent LSAT facts you aren't sure of.
- Vocabulary rule: simple explanation first, technical explanation second, LSAT application third. Never define an unfamiliar word using other unfamiliar words. If her mistake involves a word she may not know, stop and teach that word first ("Before we continue, we need to fix this foundation.").
- Teaching order, always: (1) what is happening in real life, (2) what the person is trying to DO, (3) what they say, (4) why they say it, (5) how the ideas connect, (6) what a regular person would call it, (7) what the LSAT calls it, (8) how the LSAT tests it, (9) how to recognize it fast. Human language first; the LSAT term is a label for something she already understands. Use the four levels: kid-simple, everyday, LSAT, what to do on the exam. Keep asking "What job is this sentence doing?" and "Why did the author tell me this?".
- Stay inside what she has been taught. If CONTEXT says Step 1 (conclusions only), don't launch into premises, background or opposing views as formal lessons.`;

function tutorContext(){
  const c = T.ctx || {kind:"lesson", step:STEPS[U.step]?.t};
  const L = [];
  L.push("Student's default explanation style: " + (STYLES.find(s=>s[0]===S.settings.style)||[,"Simple"])[1] + ". 'Just tell me' mode: " + (S.settings.justTell?"ON (give answers directly)":"off") + ".");
  L.push("Requested explanation level for this reply: " + (T.level ? LEVELS.find(l=>l[0]===T.level)[1] : "use her default"));
  L.push("Learner memory:\n" + learnerSummary());
  if(c.kind==="s1"){
    const it = S1_BY[c.uid]; const set = s1().set; const answered = !(set && set.items[set.i]===c.uid && !set.answered);
    L.push("Location: Argument Foundations, Step 1 (CONCLUSION ONLY; premises, background and opposing views have not been formally taught yet, so explain them only descriptively). Skill: "+((S1_SKILLS.find(s=>s.id===it.skill)||{label:"mastery exam"}).label)+", level "+LVL_NAME[it.level]+".");
    if(it.kind==="tap"){ L.push("Task: "+taskText(it)); L.push("Argument: "+(it.speaker?it.speaker+": ":"")+it.sents.map((s,i)=>"S"+(i+1)+": "+s.t).join(" ")); L.push("Answer key (for you): "+it.sents.map((s,i)=>"S"+(i+1)+"="+R1[s.role]).join(", ")); if(set && set.items[set.i]===c.uid && set.sel!==null && set.sel!==undefined) L.push("She selected: S"+(set.sel+1)+(set.answered?(set.ok?" (correct)":" (wrong)"):" (not yet checked)")); }
    else if(it.kind==="mcq"){ const q = Q(it.qid); L.push("Stimulus: "+q.sents.map(s=>s.t).join(" ")); L.push("Stem: "+q.stem); L.push("Choices: "+q.choices.map(x=>x.l+") "+x.t).join(" | ")); L.push("Correct: "+q.answer); }
    else { const o = U.s1opts && U.s1opts.uid===it.uid ? U.s1opts : null; L.push("Question: "+(it.q||(o&&o.prompt)||"")+(it.focus?" Sentence: "+it.focus:"")+(o&&o.big?" ("+o.big+")":"")); L.push("Options: "+((it.opts||(o&&o.opts)||[]).map((x,i)=>"ABCD"[i]+") "+x).join(" | "))); L.push("Correct: "+"ABCD"[it.answer!==undefined?it.answer:(o?o.answer:0)]); if(it.vid) L.push("Word: "+VB[it.vid].term+" = "+VB[it.vid].simple+" / LSAT: "+VB[it.vid].lsat); }
    L.push("Answered yet: "+(answered?"yes":"no"));
  } else if(c.kind==="s1l"){
    const l = S1_LESSONS.find(x=>x.id===c.id); L.push("Location: Argument Foundations, Step 1 (CONCLUSION ONLY), lesson: "+(l?l.title:c.id)+". Teach only conclusions; don't formally teach premises yet.");
    const lad = S1_LADDERS[c.id]; if(lad) L.push("Lesson content summary: "+lad[0].text);
  } else if(c.kind==="question"){
    const q = Q(c.qid.replace(/^r:/,"")); const s = qs(c.qid);
    const revealed = s.done || S.settings.justTell || (T.helpCount[c.qid]||0) >= 4;
    L.push("Location: Lesson 'Premise vs Conclusion', " + (c.qid.startsWith("r:")?"spaced review":(q.mode==="guided"?"Guided practice":"Independent practice")) + ", question type " + q.type + " (" + q.difficulty + ").");
    L.push("Stimulus: " + (q.speaker?q.speaker+": ":"") + q.sents.map(x=>x.t).join(" "));
    L.push("Question stem: " + q.stem);
    L.push("Choices:\n" + q.choices.map(x=>x.l+") "+x.t).join("\n"));
    L.push("Correct answer (for your reference): " + q.answer + ". Sentence roles: " + q.sents.map((x,i)=>"S"+(i+1)+"="+ROLES[x.role].label).join(", "));
    L.push("Her current selection: " + (s.sel||"none") + ". Wrong tries so far: " + (s.tries.join(", ")||"none") + ". Answer changes: " + s.changed + ". Hints used: " + s.hints + ". Time on question: " + fmtTime((s.end||Date.now())-s.start) + ". Submitted: " + (s.done?("yes, "+(s.correct?"correct":"wrong")+", confidence '"+(s.conf||"n/a")+"'"+(s.reason?", she says she picked it because: "+REASONS.find(r=>r[0]===s.reason)[1]:"")):"no") + ".");
    L.push("Times she has asked for help on this question: " + (T.helpCount[c.qid]||0) + ".");
    L.push("REVEAL ALLOWED: " + (revealed?"yes":"no, follow the teaching ladder"));
  } else {
    if(c.kind=="home"){ L.push("Location: the "+c.view+" page of the app (not a specific question). Current unit: Argument Foundations, Step 1 (Conclusion).\n"+(typeof s1Stats==="function"?"Step 1 skill scores: "+S1_SKILLS.map(sk=>sk.label+" "+Math.round((s1Stats()[sk.id].score||0)*100)+"%").join(", "):"")); return L.join("\n"); }
    const st = STEPS.find(s=>s.id===c.step) || STEPS[U.step];
    L.push("Location: Lesson 'Premise vs Conclusion', part: " + st.t + ".");
    const mat = {idea:"Core idea: conclusion = what they want you to believe; premise = reason given. Background and opposing views are neither. Tests: the Why test, the Therefore test. Signpost words, with the warning that 'so' can mark a middle step.",
      everyday:"Everyday examples: " + EVERYDAY.map(e=>e.sents.map(s=>s.t).join(" ")).join(" | "),
      anatomy:"Argument she is labeling: " + ANATOMY[U.anat.idx].sents.map((s,i)=>"S"+(i+1)+": "+s.t+" [answer: "+ROLES[s.role].label+"]"+(U.anat.picks[i]?" [her label: "+ROLES[U.anat.picks[i]].label+"]":"")).join(" ") + (U.anat.checked?" (checked)":" (not checked yet: don't give away labels unless asked)"),
      example:"Worked example: Critic: " + EXAMPLE.sents.map(s=>s.t).join(" ") + " Stem: " + EXAMPLE.stem + " Conclusion is the last sentence.",
      teach:"Teach-it-back exercise. Her draft so far: " + (U.teachDraft||"(empty)") + ". Help her think; don't write the explanation for her.",
      mastery:"Mastery screen. " + learnerSummary()}[st.id] || "";
    if(mat) L.push(mat);
  }
  return L.join("\n");
}
function contextLabel(){
  const c = T.ctx;
  if(c && c.kind==="home") return "Looking at: "+({today:"your dashboard",lesson:"Argument Foundations",words:"your vocabulary",drill:"a vocabulary drill",plan:"your year",journal:"your error journal",settings:"settings"}[c.view]||"the app");
  if(c && c.kind==="locked") return "Test in progress";
  if(c && c.kind==="s1") return "Looking at: Step 1 practice \u00b7 "+((S1_SKILLS.find(s=>s.id===(S1_BY[c.uid]||{}).skill)||{label:"exam"}).label);
  if(c && c.kind==="s1l") return "Looking at: Step 1 lesson \u00b7 "+((S1_LESSONS.find(l=>l.id===c.id)||{}).title||"");
  if(!c || c.kind!=="question") return "Looking at: " + (U.view==="lesson" ? STEPS[U.step].t : "your dashboard");
  const q = Q(c.qid.replace(/^r:/,"")); const list = QUESTIONS.filter(x=>x.mode===q.mode);
  return "Looking at: " + (c.qid.startsWith("r:")?"Review":(q.mode==="guided"?"Guided":"Independent")) + " question " + (list.findIndex(x=>x.id===q.id)+1) + " · " + q.type;
}
function setCtxFromView(){
  if(U.view==="practice" && s1().set && s1().set.items[s1().set.i]){ T.ctx = {kind:"s1", uid:s1().set.items[s1().set.i]}; return; }
  if(U.view==="exam" || U.view==="ret"){ T.ctx = {kind:"locked"}; return; }
  if(U.view==="lesson" && U.s1lesson){ T.ctx = {kind:"s1l", id:U.s1lesson}; return; }
  if(U.view==="lesson" && false){ const st = STEPS[U.step].id; if(st==="guided"||st==="solo") T.ctx = {kind:"question", qid:U.cur[st==="guided"?"guided":"solo"]}; else T.ctx = {kind:"lesson", step:st}; }
  else if(U.view==="review" && U.review) T.ctx = {kind:"question", qid:"r:"+U.review};
  else T.ctx = {kind:"home", view:U.view};
}

function refreshMsgs(){ const m=$("#t-msgs"); if(m){ m.innerHTML = msgsHTML(); scrollMsgs(); } const c=$("#t-chips"); if(c) c.innerHTML = chipsHTML(); const f=$("#t-form"); if(f){ const b=f.querySelector("button"); b.outerHTML = T.busy?'<button class="btn" type="button" data-act="t-stop">Stop</button>':'<button class="btn primary" type="submit">Send</button>'; } }
function openTutor(){ T.open=true; $("#tutor").classList.add("open"); $("#scrim").hidden = window.matchMedia("(min-width:1120px)").matches; }
function closeTutor(){ T.open=false; $("#tutor").classList.remove("open"); $("#scrim").hidden = true; }

async function getSample(){ if(T.sample!==undefined) return T.sample; try{ T.sample = (window.claude&&claude.use) ? await claude.use("sample") : null; }catch(e){ T.sample=null; } return T.sample; }

async function ask(text, opts={}){
  setCtxFromView();
  if(tutorLocked()){ openTutor(); renderTutor(); toast("Help unlocks after you submit this one."); return; }
  if(T.busy) return;
  const qid = T.ctx.kind==="question" ? T.ctx.qid : null;
  if(qid) T.helpCount[qid] = (T.helpCount[qid]||0) + 1;
  T.msgs.push({r:"u", text}); T.idkMode = false; refreshMsgs();
  const sample = await getSample();
  if(!sample){ T.msgs.push({r:"t", text: fallback(opts.idk||null, text)}); refreshMsgs(); return; }
  T.busy = true; T.ctl = new AbortController(); const bubble = {r:"t", text:"Thinking\u2026"}; T.msgs.push(bubble); refreshMsgs();
  const turns = T.turns.slice(-10);
  const input = [{role:"user", content:RULES}, ...turns, {role:"user", content:"CONTEXT (live from the app):\n"+tutorContext()+"\n\nSTUDENT: "+(opts.prompt||text)}];
  try{
    const r = await sample(input, {cache:false, signal:T.ctl.signal, onText:({text:t})=>{ bubble.text=t; const m=$("#t-msgs"); if(m){ m.lastElementChild.innerHTML = md(t); scrollMsgs(); } }});
    bubble.text = r.text; T.turns.push({role:"user", content:opts.prompt||text},{role:"assistant", content:r.text});
  }catch(e){
    if(e.code==="cancelled"){ bubble.text = (e.text||"") + (e.text?"\n\n(stopped)":"Stopped."); }
    else if(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"].includes(e.code)){ T.sample=null; bubble.text = fallback(opts.idk||null, text); T.msgs.splice(T.msgs.indexOf(bubble),0,{r:"sys", text:"The live tutor is off for this view, so here\u2019s a built-in explanation instead."}); }
    else if(e.code==="rate_limited"){ bubble.text = (e.text?e.text+"\n\n":"") + "I\u2019ve hit a usage limit for the moment. Try again in a little while. Meanwhile:\n\n" + fallback(opts.idk||null, text); }
    else { bubble.text = (e.text?e.text+"\n\n(interrupted)":"Something interrupted me. Send that again?"); }
  }
  T.busy = false; refreshMsgs();
}

/* Offline / fallback teaching: never repeat the same variant twice in a row */
function fallback(idk, text){
  const c = T.ctx;
  if(!c || c.kind!=="question"){
    const st = (STEPS.find(s=>s.id===c?.step)||STEPS[U.step]).id;
    const order = idk==="ten"?["kid"]: idk==="life"?["analogy"]: idk==="over"?["plain"]: ["plain","kid","analogy","normal"];
    T.seen = T.seen||{}; const key="core"; const used = T.seen[key]||[];
    const pick = order.find(o=>!used.includes(o)) || order[0]; T.seen[key] = used.includes(pick)?[pick]:[...used,pick];
    let extra = st==="example" ? "\n\nIn the critic example: the last sentence (\u201cTherefore\u2026 the new translation is a poor one\u201d) is the point. Ask \u201cwhy is it poor?\u201d The two middle sentences answer." : st==="anatomy" ? "\n\nFor each sentence ask: is the author claiming this, giving a reason, reporting what others think, or just setting the scene?" : "";
    return CORE[pick] + extra + "\n\nWhich sentence do you think the others are holding up?";
  }
  const q = Q(c.qid.replace(/^r:/,"")); const s = qs(c.qid); const done = s.done || S.settings.justTell;
  const sbs = q.sents.map((x,i)=>"**Sentence "+(i+1)+"** ("+ROLES[x.role].label+"): "+x.note).join("\n");
  const draw = "```\n" + q.sents.filter(x=>x.role==="evidence").map(x=>"EVIDENCE: "+x.t.slice(0,60)+(x.t.length>60?"…":"")).join("\n") + "\n      ↓\n" + (q.sents.some(x=>x.role==="middle")? "MIDDLE STEP: "+q.sents.find(x=>x.role==="middle").t.slice(0,60)+"…\n      ↓\n":"") + (done? "CONCLUSION: "+q.sents.find(x=>x.role==="conclusion").t : "CONCLUSION: ?  (which sentence goes here?)") + "\n```";
  const map = {
    q: "Here\u2019s the question in regular English: **" + q.stemPlain + "**",
    asking: "Here\u2019s the question in regular English: **" + q.stemPlain + "**\nYou\u2019re hunting for the point, not a true fact.",
    passage: sbs, sbs: sbs, logic: draw, wording: q.explain.plain, ten: q.explain.kid, life: q.explain.analogy,
    over: "Let\u2019s start fresh. " + CORE.plain + "\n\nNow: " + q.stemPlain,
    mywrong: s.sel ? "You picked " + s.sel + ". " + q.choices.find(x=>x.l===s.sel).why + (done?"":"\nLook again at which sentence that choice really matches.") : "Pick an answer first, then I can tell you what it\u2019s doing.",
    theirright: done ? q.choices.find(x=>x.l===q.answer).why + "\n\n" + q.explain.normal : "I\u2019ll show you why the right answer works once you\u2019ve answered. Want a hint instead?\n\n" + q.hints[Math.min(s.hints, q.hints.length-1)]
  };
  if(idk && map[idk]) return map[idk] + "\n\nDoes that make it click, or should I try another way?";
  const t = (text||"").toLowerCase();
  if(t.includes("hint")){ const i = Math.min((T.helpCount[c.qid]||1)-1, q.hints.length-1); return q.hints[i]; }
  if(t.includes("visual")) return draw;
  if(t.includes("translate")||t.includes("asking")) return map.q;
  if(t.includes("conclusion")) return done ? "The conclusion: \u201c"+q.sents.find(x=>x.role==="conclusion").t+"\u201d" : "Try the Why test on each sentence. The one that the others explain is the conclusion. Which one is it?";
  if(t.includes("evidence")) return done ? "The evidence: " + q.sents.filter(x=>x.role==="evidence").map(x=>"\u201c"+x.t+"\u201d").join(" ") : "Evidence answers \u201cwhy?\u201d Find the sentences that are facts or reasons rather than the author\u2019s judgment.";
  const m = (text||"").match(/why is ([a-e]) wrong/i);
  if(m){ const ch = q.choices.find(x=>x.l===m[1].toUpperCase()); if(ch) return (done||ch.l!==q.answer) ? ch.l+": "+ch.why : "Hold that thought until you\u2019ve answered. What\u2019s making you doubt it?"; }
  return done ? q.explain.plain + "\n\nWhat part still feels shaky?" : q.hints[Math.min(s.hints, q.hints.length-1)];
}

function idkPanel(ctx){
  setCtxFromView();
  if(ctx && ctx.startsWith("q:")) T.ctx = {kind:"question", qid:ctx.slice(2)};
  if(tutorLocked()){ toast("Help unlocks after you submit this one."); return; }
  openTutor(); T.idkMode = true;
  T.msgs.push({r:"t", text:"Okay. Tell me which part feels confusing."});
  renderTutor();
}
function idkPick(k){
  S.profile.idk[k] = (S.profile.idk[k]||0)+1; save();
  const label = IDK_OPTIONS.find(o=>o[0]===k)[1];
  const lv = {ten:"kid", life:"analogy", sbs:"sbs", logic:"draw"}[k];
  const prev = T.level; if(lv) T.level = lv;
  const prompt = label + (k==="over" ? " Please restart from zero with a completely different approach than anything you\u2019ve said so far." : "") + " (Remember: change your method from anything already said in this chat.)";
  ask(label, {idk:k, prompt}).then(()=>{ if(lv) T.level = prev; });
}

const WEEK = 7*864e5;
function planWeek(){ if(!S.plan||!S.plan.start) return 0; return Math.max(1, Math.floor((Date.now() - new Date(S.plan.start+"T00:00:00").getTime())/WEEK) + 1); }
function phaseOf(w){ return PHASES.find(p=>w>=p.from && w<=p.to) || (w>52 ? PHASES[PHASES.length-1] : PHASES[0]); }
function weekDate(w){ const d = new Date(new Date(S.plan.start+"T00:00:00").getTime() + (w-1)*WEEK); return d.toLocaleDateString(undefined,{month:"short", day:"numeric"}); }
function moduleLevel(id){ return id==="m2" ? Math.min(5, s1().mastered ? 1 : 0) : 0; }

function readiness(){
  const P = S.plan||{}; const tests = (P.tests||[]).slice().sort((a,b)=>a.date<b.date?-1:1);
  const last3 = tests.slice(-3); const avg = last3.length ? last3.reduce((s,t)=>s+t.score,0)/last3.length : null;
  const target = P.target||null;
  const profMods = MODULES.filter(m=>moduleLevel(m.id)>=3).length;
  const recent = S.attempts.filter(a=>["guided","independent","review","stone"].includes(a.kind)).slice(-40);
  const recentAcc = recent.length ? recent.filter(a=>a.correct).length/recent.length : 0;
  const crit = [
    {t:"Every skill in the course at Proficient or better", detail: profMods+" of "+MODULES.length+" skills", ok: profMods===MODULES.length},
    {t:"At least 5 full official practice tests taken, timed", detail: tests.length+" logged", ok: tests.length>=5},
    {t:"Your last 3 official practice tests average at or above your target", detail: avg===null ? "No tests yet" : "Average "+avg.toFixed(1)+(target?" vs target "+target:" (set a target)"), ok: !!target && last3.length===3 && avg>=target},
    {t:"None of those last 3 is more than 3 points under your target", detail: last3.length===3 ? "Lowest: "+Math.min(...last3.map(t=>t.score)) : "Needs 3 tests", ok: !!target && last3.length===3 && Math.min(...last3.map(t=>t.score))>=target-3},
    {t:"80%+ on your last 40 practice questions in this app", detail: recent.length ? Math.round(recentAcc*100)+"% on "+recent.length : "No questions yet", ok: recent.length>=40 && recentAcc>=.8},
    {t:"90% of the vocabulary bank mastered", detail: vCounts().mastered+" of "+VBANK.length+" words", ok: vCounts().mastered >= .9*VBANK.length},
    {t:"3 practice essays written for the writing section", detail: (P.essays||0)+" written", ok: (P.essays||0)>=3}
  ];
  const met = crit.filter(c=>c.ok).length;
  const verdict = met===crit.length ? "go" : (met>=4 ? "close" : "build");
  return {crit, met, verdict, avg, last3, tests, target};
}
const VERDICT = {
  go:{label:"OK, you can test.", note:"You’ve hit every readiness mark. Look up the next LSAT dates on lsac.org and register. Registration closes weeks before each test, so do it soon. Keep taking one practice test a week until test day."},
  close:{label:"Getting close.", note:"Most of the marks are there. Keep taking official practice tests and repairing what they show you."},
  build:{label:"Not yet. Keep building.", note:"That’s exactly where you should be for now. The plan gets you there one phase at a time."}
};

function scoreChart(tests, target){
  if(!tests.length) return '<p class="muted">Your official practice test scores will chart here.</p>';
  const W=640,H=200,pl=40,pr=16,pt=14,pb=28;
  const vals = tests.map(t=>t.score).concat(target?[target]:[]);
  let lo = Math.max(120, Math.floor((Math.min(...vals)-4)/5)*5), hi = Math.min(180, Math.ceil((Math.max(...vals)+4)/5)*5);
  if(hi-lo<10) hi = Math.min(180, lo+10);
  const x = i => tests.length===1 ? (pl+(W-pr))/2 : pl + i*((W-pl-pr)/(tests.length-1));
  const y = v => pt + (hi-v)*((H-pt-pb)/(hi-lo));
  let ticks=[]; for(let v=lo; v<=hi; v+=5) ticks.push(v);
  let g = '<svg viewBox="0 0 '+W+' '+H+'" style="width:100%;height:auto;display:block" role="img" aria-label="Practice test scores over time">';
  g += ticks.map(v=>'<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-8)+'" y="'+(y(v)+4)+'" text-anchor="end" font-size="11" fill="var(--muted)" font-family="IBM Plex Mono, monospace">'+v+'</text>').join("");
  if(target) g += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y(target)+'" y2="'+y(target)+'" stroke="var(--warn)" stroke-width="1.5" stroke-dasharray="5 4"/><text x="'+(W-pr)+'" y="'+(y(target)-6)+'" text-anchor="end" font-size="11" fill="var(--warn)" font-family="Figtree, sans-serif">Target '+target+'</text>';
  g += '<polyline fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round" points="'+tests.map((t,i)=>x(i)+","+y(t.score)).join(" ")+'"/>';
  g += tests.map((t,i)=>'<circle cx="'+x(i)+'" cy="'+y(t.score)+'" r="'+(i===tests.length-1?5:3.5)+'" fill="'+(i===tests.length-1?"var(--accent)":"var(--surface)")+'" stroke="var(--accent)" stroke-width="2"><title>'+esc(t.name)+': '+t.score+'</title></circle>').join("");
  g += tests.map((t,i)=>(tests.length<=8||i%Math.ceil(tests.length/8)===0||i===tests.length-1)?'<text x="'+x(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10.5" fill="var(--muted)" font-family="Figtree, sans-serif">'+new Date(t.date+"T00:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric"})+'</text>':"").join("");
  return '<div class="tblwrap">'+g+'</svg></div>';
}

function qLadder(q, s){
  const revealed = s.done || S.settings.justTell;
  const L = [];
  L.push({m:"breakdown", text:"**They\u2019re asking:** " + q.stemPlain + "\n\n**What to do:** find the one sentence the author wants you to believe. For each sentence ask \u201cWhy should I believe that?\u201d If another sentence answers it, you\u2019ve found a reason and the thing it supports." + (revealed ? "" : "\n\n**First nudge:** " + q.hints[0])});
  L.push({m:"sbs", html:()=>sbsHTML(q) + (revealed ? '<p class="explain">'+esc(q.explain.plain)+'</p>' : "")});
  L.push({m:"analogy", text:q.explain.analogy});
  L.push({m:"draw", html:()=>diagramHTML(q.sents)});
  L.push({m:"kid", text:q.explain.kid});
  if(revealed){
    const right = q.choices.find(c=>c.l===q.answer), mine = s.sel && s.sel!==q.answer ? q.choices.find(c=>c.l===s.sel) : null;
    L.push({m:"answer", text:"**Why " + q.answer + " is right:** " + right.why + (mine ? "\n\n**Why " + mine.l + " feels right:** " + mine.pick + "\n**Why it isn\u2019t:** " + mine.why : "") + "\n\n**What the test is doing:** " + q.explain.testing});
  } else {
    const wrong = q.choices.filter(c=>c.l!==q.answer).slice(0,2);
    L.push({m:"elim", text:"Let\u2019s cross two out together.\n\n" + wrong.map(c=>"- **" + c.l + "** is out. " + c.why).join("\n") + "\n\nNow compare what\u2019s left using the Why test."});
  }
  L.push({m:"normal", text: revealed ? q.explain.normal : "Every wrong choice here is one of three things: a reason dressed up as the point, something bigger than what was actually said, or something never mentioned. " + q.hints[q.hints.length-1]});
  return L;
}
function ladderFor(key){
  let L;
  if(key.startsWith("s1:")) L = s1ItemLadder(S1_BY[key.slice(3)]);
  else if(key.startsWith("s1l:")) L = (S1_LADDERS[key.slice(4)]||S1_LADDERS.word).slice();
  else if(key.startsWith("q:")){ const id = key.slice(2); L = qLadder(Q(id.replace(/^r:/,"")), qs(id)); }
  else L = (LADDERS[key.slice(2)] || LADDERS.idea).slice();
  // memory: the method that has clicked for her most often moves up to second place
  const best = Object.entries(S.profile.works||{}).sort((a,b)=>b[1]-a[1])[0];
  if(best && best[1]>=2){ const i = L.findIndex(x=>x.m===best[0]); if(i>1){ const [x] = L.splice(i,1); L.splice(1,0,x); } }
  return L;
}

function bdStart(ctx){
  const key = /^(q|s1|s1l):/.test(ctx) ? ctx : "s:" + ctx;
  if(key.startsWith("s1:")){ const uid = key.slice(3); T.ctx = {kind:"s1", uid}; const set = s1().set; if(set && set.items[set.i]===uid && !set.answered){ set.assisted[uid] = true; } }
  else if(key.startsWith("s1l:")){ T.ctx = {kind:"s1l", id:key.slice(4)}; }
  else if(key.startsWith("q:")){ const id = key.slice(2); const q = Q(id.replace(/^r:/,"")); const s = qs(id);
    if((q.mode==="independent"||id.startsWith("r:")) && !s.done){ toast("On your own: answer first, then I\u2019ll break it down."); return; }
    T.ctx = {kind:"question", qid:id}; }
  else T.ctx = {kind:"lesson", step:key.slice(2)};
  S.profile.bdClicks = (S.profile.bdClicks||0) + 1; save();
  if(!U.bd[key] || U.bd[key].state==="done") U.bd[key] = {levels:[], state:"loading", tried:[]};

}

function bdYes(key){

function bdCheck(key, i){

function bdDone(key){

  S.profile.depths = (S.profile.depths||[]).concat(b.levels.length).slice(-40);
